<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Generation (ledger), beyond the slides</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- Generation (ledger), beyond the slides: ops/video/scripts/
         generation-ledger.md. The magpie's real ledger sheets write ". it sits
         on the dog ." one draw at a time (a row's marks become counters in a
         cup, one comes out, its colour names the word); then the tree of
         everything they could have written, and ten thousand words of their
         own writing counted back into a blank sheet. Sibling of
         generation-grid: the walk, the tree and the recount are the shared
         parts in ../_parts/. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="landscape" data-composition-id="generation-ledger"
         data-start="0" data-duration="160.41" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="160.41" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="153.41" data-track-index="1"></audio>
    </div>
    <script type="module">
      import { WALK, wordTimes, paperLine, splice, walkStyle } from "./parts/generation-walk.js";
      import { tree, labels, walkWords, samplePaths, treeStyle, GOLD } from "./parts/tree.js";
      import * as CV from "./parts/converge.js";

      const build = (tl, S, T) => {
        const K = KIT, D = KIT_DATA, MG = MAGPIE;
        const scene = document.getElementById("scene");
        const A = S.area;
        const W = wordTimes(T);
        const w = W.word;
        treeStyle(), walkStyle();
        const PAL = D.palette; // red, blue, green, yellow: the boxes' order
        const M = D.ledger["the-magpie"];

        // ---- the real sheets, and a row found by its word
        const where = (word) => {
          for (let s = 0; s < M.sheets.length; s++) {
            const r = M.sheets[s].pages[0].findIndex((e) => e.prefix.join(" ") === word);
            if (r >= 0) return { sheet: s, row: r, entry: M.sheets[s].pages[0][r] };
          }
          throw new Error(`no row for ${word}`);
        };
        const SHEET_W = 1700;
        const sheets = M.sheets.map((s) => {
          const sh = K.sheet(scene, s.pages[0], PAL, { w: SHEET_W, rowH: 120, header: [s.range[0].join(" "), s.range[1].join(" ")], title: M.title });
          K.set(sh.rows.flatMap((r) => r.cells.flatMap((c) => c.strokes)), { strokeDashoffset: 0 });
          K.set(sh.el, { opacity: 0 });
          return sh;
        });
        const sheetRowY = (sh, i) => 90 + 24 + i * 120; // K.sheet's header and pad
        // the five sheets fanned on the desk
        // spread, not stacked: every sheet's text stays readable
        const FAN = [
          { x: 70, y: 70, scale: 0.3, rotation: -3 },
          { x: 700, y: 50, scale: 0.3, rotation: 2 },
          { x: 1330, y: 80, scale: 0.3, rotation: -2 },
          { x: 380, y: 420, scale: 0.3, rotation: 3 },
          { x: 1010, y: 400, scale: 0.3, rotation: -3 },
        ];
        sheets.forEach((sh, i) => K.set(sh.el, FAN[i]));

        // ---- focus rows: a row out on the desk, at the sheet's own size
        const FX = 150, FY = 50;
        const focus = {};
        for (const word of [".", "it", "sits", "on", "the", "dog"]) {
          const r = K.ledgerRow(scene, where(word).entry, PAL, { x: FX, y: FY, w: SHEET_W, h: 120 });
          K.set(r.cells.flatMap((c) => c.strokes), { strokeDashoffset: 0 });
          K.set(r.el, { opacity: 0 });
          focus[word] = r;
        }
        const colOf = (word, next) => where(word).entry.followers.findIndex((f) => f?.text.toLowerCase() === next);
        // where a row's k-th mark in box c sits on the desk (the row in its slot)
        const markAt = (row, c, k, at = { x: FX, y: FY }) => {
          const b = row.cells[c].strokes[k].getBBox();
          return { x: at.x + b.x + b.width / 2, y: at.y + b.y + b.height / 2 };
        };
        const boxAt = (row, c) => ({ x: FX + row.cells[c].cx, y: FY + row.cells[c].cy });
        const enterRow = (row, t) => tl.fromTo(row.el, { opacity: 0, y: FY + 60 }, { opacity: 1, y: FY }, t, { dur: 0.45, ease: "out-cubic" });
        const exitRow = (row, t) => tl.to(row.el, { opacity: 0, y: FY - 40 }, t, { dur: 0.35, ease: "in-cubic" });
        const lightFor = (els, t, hold = 1.0) => {
          tl.to(els, { opacity: 1 }, t, { dur: 0.2 });
          tl.to(els, { opacity: 0 }, t + hold, { dur: 0.35 });
        };
        // (no yoyo: the engine's yoyo returns to an unresolved value)
        const pulse = (els, t, s = 1.15) => {
          tl.to(els, { scale: s, transformOrigin: "50% 50%" }, t, { dur: 0.22, ease: "out-quad" });
          tl.to(els, { scale: 1 }, t + 0.22, { dur: 0.25, ease: "in-out-quad" });
        };

        // ---- the cup, the tub of counters, the strip of paper
        const cup = K.cup(scene, { x: 770, y: 215, r: 150 });
        const CUPC = cup.centre;
        K.set(cup.el, { opacity: 0, transformOrigin: "50% 50%" });
        const TUB = { x: 1330, y: 300, w: 320, h: 200 };
        const tubL = K.layer(scene, TUB.x, TUB.y);
        const tubS = K.svg("svg", { width: TUB.w, height: TUB.h, viewBox: `0 0 ${TUB.w} ${TUB.h}` }, tubL);
        const tubLine = K.svg("rect", { x: 6, y: 6, width: TUB.w - 12, height: TUB.h - 12, class: "line" }, tubS);
        [["red", 0.2, 0.35], ["blue", 0.34, 0.62], ["green", 0.48, 0.34], ["yellow", 0.6, 0.64], ["red", 0.72, 0.38], ["blue", 0.84, 0.62], ["green", 0.3, 0.8], ["yellow", 0.8, 0.22]].forEach(([c, fx, fy]) =>
          K.svg("circle", { cx: fx * TUB.w, cy: fy * TUB.h, r: 22, fill: K.COUNTER[c], stroke: "rgb(0 0 0 / 30%)", "stroke-width": 2 }, tubS));
        K.set(tubL, { opacity: 0 });
        const TUBC = { x: TUB.x + TUB.w / 2, y: TUB.y + TUB.h / 2 };
        const PAPER = { x: 310, y: 684 };
        const paper = paperLine(scene, WALK.slice(1), { x: PAPER.x, y: PAPER.y, w: 1300, h: 116, size: 62 });
        K.set(paper.el, { opacity: 0 });

        // ---- counters: each of a row's marks lifts off as a counter in its
        // box's colour and drops into the cup; one comes out; the cup tips back
        const CR = cup.cr;
        const flyer = (colour, at) => {
          const c = K.counter(scene, colour, { r: CR });
          K.set(c.el, { x: at.x - CR - 4, y: at.y - CR - 4, opacity: 0 });
          return c.el;
        };
        let inCup = [];
        const fill = (row, plan, total) => {
          let i = 0;
          for (const { c, t, dur } of plan) {
            const n = row.cells[c].strokes.length;
            for (let k = 0; k < n; k++, i++) {
              const from = markAt(row, c, k);
              const s = cup.slot(i, total);
              const el = flyer(PAL[c].name, from);
              const tk = t + (n > 1 ? (dur * k) / (n - 1) : 0);
              tl.set(el, { opacity: 1 }, tk);
              K.raise(tl, el, tk);
              tl.set(row.cells[c].strokes[k], { opacity: 0.15 }, tk);
              tl.to(el, { x: CUPC.x - cup.D / 2 + s.x - CR - 4, y: CUPC.y - cup.D / 2 + s.y - CR - 4 }, tk, { dur: 0.55, ease: "in-out-cubic" });
              inCup.push({ el, colour: PAL[c].name, strokes: row.cells[c].strokes[k] });
            }
          }
        };
        // one counter of `colour` comes out and sits under its box
        const draw = (row, c, t) => {
          const k = inCup.findIndex((x) => x.colour === PAL[c].name);
          const [pick] = inCup.splice(k, 1);
          const b = boxAt(row, c);
          K.raise(tl, pick.el, t);
          tl.to(pick.el, { x: b.x - CR - 4, y: FY + 120 + 18, scale: 1.25 }, t, { dur: 0.6, ease: "in-out-cubic" });
          inCup.push(pick); // it goes back with the rest
          lightFor(row.cells[c].lit, t + 0.45, 1.6);
        };
        // tip the cup back into the tub: every counter goes back
        const tipBack = (t) => {
          tl.to(cup.el, { rotation: 14 }, t, { dur: 0.25, ease: "out-quad" });
          tl.to(cup.el, { rotation: 0 }, t + 0.45, { dur: 0.3, ease: "in-out-quad" });
          inCup.forEach(({ el }, i) => {
            K.raise(tl, el, t + 0.1 + (i % 7) * 0.02);
            tl.to(el, { x: TUBC.x - CR - 4 + (K.jitter(i) - 0.5) * 160, y: TUBC.y - CR - 4 + (K.jitter(i + 50) - 0.5) * 80, scale: 1 }, t + 0.1 + (i % 7) * 0.02, { dur: 0.45, ease: "in-cubic" });
            tl.to(el, { opacity: 0 }, t + 0.45, { dur: 0.2 });
          });
          inCup = [];
        };

        // ============================================================ line 0
        // (TC) the magpie's sheets fanned on the desk, held still
        tl.to(sheets.map((s) => s.el), { opacity: 1 }, 0.1, { dur: 0.5, stagger: 0.08 });

        // ============================================================ line 1
        // a row is a word; its boxes are what came next, and how often
        const sThe = sheets[where("the").sheet];
        const FULL = { x: 110, y: 60, scale: 1, rotation: 0 };
        const tGather = w(1, "Each") - 0.3;
        sheets.forEach((sh) => {
          if (sh === sThe) tl.to(sh.el, FULL, tGather, { dur: 0.8, ease: "in-out-cubic" });
          else tl.to(sh.el, { x: FULL.x + 300, y: FULL.y + 100, rotation: 0, opacity: 0 }, tGather, { dur: 0.6, ease: "in-cubic" });
        });
        const prefixes = sThe.rows.map((r) => r.prefixEl);
        tl.to(prefixes, { fill: "#be830e" }, w(1, "word"), { dur: 0.25 });
        tl.to(prefixes, { fill: "#1a1a1a" }, w(1, "word") + 1.0, { dur: 0.4 });
        const rowThe = sThe.rows[where("the").row];
        tl.to(rowThe.lit, { opacity: 1 }, w(1, "words"), { dur: 0.3 });
        rowThe.cells.forEach((c, i) => pulse(c.strokes, w(1, "mark") + i * 0.15, 1.2));
        tl.to(rowThe.lit, { opacity: 0 }, w(1, "Maybe") + 0.3, { dur: 0.5 });

        // ============================================================ line 2
        // the colours run red, blue, green, yellow; a colour names a place in
        // the row, not a word
        const fThe = focus.the, fIt = focus.it;
        const t2 = T.start(2) - 0.6;
        // the sheet's row for "the" becomes the row on the desk (same size, same place)
        const theAt = { x: FULL.x, y: FULL.y + sheetRowY(sThe, where("the").row) };
        tl.fromTo(fThe.el, { x: theAt.x, y: theAt.y, opacity: 0 }, { opacity: 1 }, t2, { dur: 0.01 });
        K.raise(tl, fThe.el, t2);
        tl.to(sThe.el, { opacity: 0 }, t2 + 0.05, { dur: 0.4 });
        tl.to(fThe.el, { x: FX, y: FY }, t2 + 0.2, { dur: 0.6, ease: "in-out-cubic" });
        ["red", "blue", "green", "yellow"].forEach((c, i) => {
          lightFor(fThe.cells[i].lit, w(2, c), 0.5);
          pulse(fThe.cells[i].rule, w(2, c), 1.3);
        });
        const IT_Y = 300;
        const rc = flyer("red", { x: 78, y: FY + 60 });
        K.set(rc, { x: -100 });
        K.raise(tl, rc, w(2, "red", 2) - 0.2);
        tl.to(rc, { opacity: 1, x: 78 - CR - 4 }, w(2, "red", 2) - 0.2, { dur: 0.45, ease: "out-cubic" });
        lightFor(fThe.cells[0].lit, w(2, "magpie"), 1.4);
        tl.fromTo(fIt.el, { x: FX, y: IT_Y + 40, opacity: 0 }, { y: IT_Y, opacity: 1 }, w(2, "another"), { dur: 0.45, ease: "out-cubic" });
        K.raise(tl, rc, w(2, "red", 3) - 0.2);
        tl.to(rc, { y: IT_Y + 60 - CR - 4 }, w(2, "red", 3) - 0.2, { dur: 0.55, ease: "in-out-cubic" });
        lightFor(fIt.cells[0].lit, w(2, "means", 2), 1.3);

        // ============================================================ line 3
        // the row for full stop slides out of its sheet; each mark becomes a
        // counter in its box's colour, into the cup
        const t3 = T.start(3) - 0.3;
        K.vanish(tl, [fThe.el, fIt.el, rc], t3);
        tl.set(fIt.el, { y: FY }, t3 + 0.4);
        const dotW = where(".");
        const sDot = sheets[dotW.sheet];
        const SD = { x: (1920 - SHEET_W * 0.7) / 2, y: 110, scale: 0.7, rotation: 0 };
        tl.set(sDot.el, SD, t3 + 0.3);
        tl.to(sDot.el, { opacity: 1 }, t3 + 0.35, { dur: 0.4 });
        const fDot = focus["."];
        tl.to(sDot.rows[dotW.row].lit, { opacity: 1 }, w(3, "row"), { dur: 0.25 });
        const tOut = w(3, "stop", 2) - 0.1;
        K.raise(tl, fDot.el, tOut);
        tl.fromTo(fDot.el, { x: SD.x, y: SD.y + sheetRowY(sDot, dotW.row) * 0.7, scale: 0.7, opacity: 0 }, { opacity: 1 }, tOut, { dur: 0.01 });
        tl.to(fDot.el, { x: FX, y: FY, scale: 1 }, tOut, { dur: 0.7, ease: "in-out-cubic" });
        tl.to(sDot.el, { opacity: 0, y: SD.y + 120 }, tOut, { dur: 0.5, ease: "in-cubic" });
        K.appear(tl, [cup.el, tubL], w(3, "cup") - 0.2, { y: 20, stagger: 0.1 });
        pulse(fDot.cells[0].strokes[0], w(3, "every"), 1.5);
        fill(fDot, [
          { c: 0, t: w(3, "seven"), dur: 0.9 },
          { c: 1, t: w(3, "four"), dur: 0.45 },
          { c: 2, t: w(3, "three"), dur: 0.3 },
          { c: 3, t: w(3, "three", 2), dur: 0.3 },
        ], 17);

        // ============================================================ line 4
        // draw one: red, "it"; write it; the cup goes back; the row for "it"
        pulse(cup.el, w(4, "Seventeen"), 1.04);
        draw(fDot, 0, w(4, "Red") - 0.3);
        K.appear(tl, paper.el, w(4, "Red") + 0.2, { y: 20 });
        K.write(tl, paper.words[0], w(4, "Write"));
        tipBack(w(4, "tip"));
        const tToIt = w(4, "row") - 0.3;
        exitRow(fDot, tToIt);
        enterRow(fIt, tToIt + 0.2);

        // ============================================================ line 5
        // ten counters for the row for "it"; red again: "sits"
        fill(fIt, [
          { c: 0, t: w(5, "three"), dur: 0.25 },
          { c: 1, t: w(5, "three", 2), dur: 0.25 },
          { c: 2, t: w(5, "three", 3), dur: 0.25 },
          { c: 3, t: w(5, "one"), dur: 0 },
        ], 10);
        draw(fIt, colOf("it", "sits"), w(5, "Red") - 0.1);
        K.write(tl, paper.words[1], w(5, "sits"));

        // ============================================================ line 6
        // one box, no cup
        const t6 = w(6, "Sits") - 0.4;
        tipBack(t6 - 0.3);
        exitRow(fIt, t6);
        enterRow(focus.sits, t6 + 0.15);
        lightFor(focus.sits.cells[0].lit, w(6, "on") - 0.15, 0.8);
        K.write(tl, paper.words[2], w(6, "on"));
        const tOn = w(6, "on", 2) - 0.4;
        exitRow(focus.sits, tOn);
        enterRow(focus.on, tOn + 0.15);
        lightFor(focus.on.cells[0].lit, w(6, "the") - 0.15, 0.8);
        K.write(tl, paper.words[3], w(6, "the"));
        tl.to(cup.el, { opacity: 0.3 }, w(6, "no"), { dur: 0.3 });

        // ============================================================ line 7
        // all four colours for "the": yellow, "dog"; two and two for "dog":
        // red, full stop
        const fTheW = focus.the;
        const t7 = T.start(7) - 0.1;
        exitRow(focus.on, t7);
        tl.set(fTheW.el, { x: FX }, t7);
        enterRow(fTheW, t7 + 0.15);
        tl.to(cup.el, { opacity: 1 }, t7 + 0.3, { dur: 0.3 });
        const tFill = w(7, "fills");
        fill(fTheW, [0, 1, 2, 3].map((c) => ({ c, t: tFill + c * 0.5, dur: 0.4 })), 19);
        draw(fTheW, colOf("the", "dog"), w(7, "Yellow") - 0.2);
        K.write(tl, paper.words[4], w(7, "dog"));
        const tDog = w(7, "after") - 0.3;
        tipBack(tDog - 0.35);
        exitRow(fTheW, tDog);
        enterRow(focus.dog, tDog + 0.15);
        fill(focus.dog, [
          { c: 0, t: w(7, "red"), dur: 0.2 },
          { c: 1, t: w(7, "blue"), dur: 0.2 },
        ], 4);
        draw(focus.dog, colOf("dog", "."), w(7, "red", 2) - 0.2);
        K.write(tl, paper.words[5], w(7, "full", 2));

        // ============================================================ line 8
        // the book never says it: two of its sentences, whose halves make it
        const t8 = T.start(8) - 0.5;
        tipBack(t8 - 0.4);
        exitRow(focus.dog, t8);
        K.vanish(tl, [cup.el, tubL], t8 + 0.1);
        const PAPER_MID = { x: (1920 - 1300) / 2, y: 560, scale: 1 };
        tl.to(paper.el, { x: PAPER_MID.x, y: PAPER_MID.y }, t8 + 0.2, { dur: 0.8, ease: "in-out-cubic" });
        splice(tl, scene, { cx: 960, y: 300, size: 68, times: { show: w(8, "book") - 0.1, pieces: w(8, "sits", 2), join: w(8, "Nobody") } });
        const sp = scene.querySelectorAll(".splice-word");

        // ============================================================ line 9
        // everything the model could have written: the tree, the walk in gold
        const tCol = T.end(8) + 0.15;
        const box = { x0: 250, x1: A.x + A.w - 10, y0: A.y + 16, y1: A.y + A.h - 16 };
        const tGrow = [w(9, "here's"), w(10, "Every") - 0.7];
        const tWalk = w(10, "Every") - 0.35, STEP = 0.3;
        const tFade = w(10, "run") - 0.1;
        const others = samplePaths(MG.rows, { n: 3, seed: 11, avoid: WALK });
        const tOther = w(10, "different");
        const T3 = tree(tl, scene, {
          rows: MG.rows,
          box,
          grow: tGrow,
          dim: { t: tGrow[1] - 0.3, to: 0.35 },
          paths: [
            { words: WALK, colour: GOLD, t0: tWalk, step: STEP },
            ...others.map((p, i) => ({ words: p, colour: [255, 255, 255], width: 3.5, t0: tOther + i * 0.22, step: 0.07, out: tOther + i * 0.22 + 1.0 })),
          ],
          canvasBox: { x: 0, y: 0, w: S.W, h: S.H - S.captionH },
        });
        K.set(T3.el, { opacity: 0 });
        tl.set(T3.el, { opacity: 1 }, tGrow[0] - 0.05);
        const lab = labels(tl, scene, T3, { from: 1, to: 3 });
        tl.to([...lab.values()], { opacity: 0.25 }, tGrow[1] - 0.3, { dur: 0.8 });
        const from = [{ x: paper.centres(PAPER_MID)[0].x - 90, y: paper.centres(PAPER_MID)[0].y }, ...paper.centres(PAPER_MID)];
        tl.to([paper.el, ...sp], { opacity: 0 }, tCol, { dur: 0.4 });
        const ww = walkWords(tl, scene, T3, WALK, { from, colX: A.x + 40, labels: lab, times: { col: tCol, root: w(9, "And") - 0.1, walk: tWalk, step: STEP } });
        tl.to([T3.el, ...lab.values(), ...ww.all], { opacity: 0 }, tFade, { dur: 0.5 });

        // ============================================================ lines 10-11
        // run it ten thousand times and count what comes out, into a blank sheet
        const sim = CV.simulate(MG.rows, { n: 10000, seed: 37 });
        const nAt = CV.schedule({ t0: w(10, "count") - 0.3, t1: w(11, "different"), short: 20, hold: w(11, "sounding") - 0.5, t2: w(11, "book") + 0.2, long: 10000 });
        const BS = { x: 40, y: 40, scale: 0.62 };
        const blankSheet = M.sheets[where("the").sheet];
        const blank = K.sheet(scene, blankSheet.pages[0], PAL, { w: SHEET_W, rowH: 120, header: [blankSheet.range[0].join(" "), blankSheet.range[1].join(" ")], title: M.title });
        K.set(blank.el, { ...BS, opacity: 0 });
        blank.el.setAttribute("data-layout-allow-occlusion", ""); // the recount's marks draw over it
        tl.to(blank.el, { opacity: 1 }, tFade + 0.3, { dur: 0.5 });
        const s = BS.scale;
        const cells = [];
        blank.rows.forEach((row, r) => row.cells.forEach((c) => {
          if (!c.follower) return;
          const bb = c.box.getBBox();
          cells.push({ a: row.entry.prefix[0].toLowerCase(), b: c.follower.text.toLowerCase(), x: bb.x * s, y: bb.y * s, w: bb.width * s, h: bb.height * s });
        }));
        const markC = CV.marks(tl, scene, sim, nAt, { x: BS.x, y: BS.y, w: SHEET_W * s, h: blank.height * s, cells, cap: 10, th: 22, sp: 5.6, lw: 1.8, font: 17 });
        const streamC = CV.stream(tl, scene, sim, nAt, { x: 40, y: 600, w: 1840, h: 80, size: 40 });
        K.set([markC.el, streamC.el], { opacity: 0 });
        tl.set([markC.el, streamC.el], { opacity: 1 }, tFade + 0.3);
        const tShares = w(11, "Every") - 0.1;
        const bRowThe = blank.rows[where("the").row];
        tl.to(bRowThe.lit, { opacity: 1 }, tShares, { dur: 0.3 });
        const sharesC = CV.shares(tl, scene, sim, nAt, {
          x: 1150, y: 110, w: 720, h: 380, row: "the",
          followers: where("the").entry.followers.map((f, c) => ({ word: f.text, count: f.count, colour: PAL[c].hex })),
          labels: (t, k) => ["the row for “the” in the book", `in ${Math.floor(k).toLocaleString("en-AU")} words it wrote`],
        });
        K.set(sharesC.el, { opacity: 0 });
        tl.to(sharesC.el, { opacity: 1 }, tShares, { dur: 0.4 });

        // ============================================================ line 12
        // four jobs: the reader, the filler, the drawer and the writer
        const t12 = T.start(12) - 0.5;
        tl.to([blank.el, markC.el, streamC.el, sharesC.el], { opacity: 0 }, t12, { dur: 0.4 });
        const END_FAN = [
          { x: 50, y: 40, scale: 0.22, rotation: -2 },
          { x: 450, y: 50, scale: 0.22, rotation: 2 },
          { x: 50, y: 240, scale: 0.22, rotation: 2 },
          { x: 450, y: 250, scale: 0.22, rotation: -2 },
          { x: 250, y: 440, scale: 0.22, rotation: 1 },
        ];
        sheets.forEach((sh, i) => {
          tl.set(sh.el, { ...END_FAN[i], opacity: 0 }, t12 + 0.3);
          tl.set(sh.rows.flatMap((r) => r.lit), { opacity: 0 }, t12 + 0.3);
          tl.to(sh.el, { opacity: 1 }, t12 + 0.4 + i * 0.06, { dur: 0.4 });
        });
        const END_CUP = { x: 900, y: 70 };
        tl.set(cup.el, { ...END_CUP, rotation: 0 }, t12 + 0.3);
        tl.to([cup.el, tubL], { opacity: 1 }, t12 + 0.5, { dur: 0.4 });
        const endPaper = paperLine(scene, ["it"], { x: 900, y: 650, w: 900, h: 116, size: 62 });
        K.set(endPaper.el, { opacity: 0 });
        tl.to(endPaper.el, { opacity: 1 }, t12 + 0.6, { dur: 0.4 });
        const ECUPC = { x: END_CUP.x + cup.D / 2, y: END_CUP.y + cup.D / 2 };
        const jobs = {
          reader: { x: 40, y: 30, w: 800, h: 590 },
          filler: { x: TUB.x, y: TUB.y, w: TUB.w, h: TUB.h },
          drawer: { x: END_CUP.x, y: END_CUP.y, w: 380, h: 380 },
          writer: { x: 900, y: 650, w: 900, h: 116 },
        };
        // a gold ring around each job's things in turn (drawn at size: a
        // scaled K.ring would scale its border too)
        const rings = Object.fromEntries(Object.entries(jobs).map(([k, b]) => {
          const e = K.el("div", { style: { position: "absolute", left: `${b.x - 12}px`, top: `${b.y - 12}px`, width: `${b.w + 24}px`, height: `${b.h + 24}px`, border: "5px solid var(--gold)" } }, scene);
          K.set(e, { opacity: 0 });
          return [k, e];
        }));
        const ringOn = (k, t0, t1) => {
          tl.to(rings[k], { opacity: 1 }, t0, { dur: 0.3 });
          if (t1) tl.to(rings[k], { opacity: 0 }, t1, { dur: 0.3 });
        };
        const tReader = w(12, "reader");
        ringOn("reader", tReader - 0.3, w(12, "filler") - 0.3);
        ringOn("filler", w(12, "filler") - 0.2, w(12, "drawer") - 0.3);
        ringOn("drawer", w(12, "drawer") - 0.2, w(12, "writer") - 0.3);
        ringOn("writer", w(12, "writer") - 0.2, w(12, "Tip") - 0.2);
        const lDot = where(".");
        tl.to(sheets[lDot.sheet].el, { y: END_FAN[lDot.sheet].y - 30 }, w(12, "finds"), { dur: 0.4, ease: "out-cubic" });
        tl.to(sheets[lDot.sheet].el, { y: END_FAN[lDot.sheet].y }, w(12, "filler") - 0.3, { dur: 0.4 });
        // one counter per mark: counters hop from the tub into the cup
        const hops = [0, 1, 2].map((i) => {
          const el = flyer(["red", "blue", "red"][i], TUBC);
          const sl = cup.slot(i, 3);
          tl.set(el, { opacity: 1 }, w(12, "counter") + i * 0.25);
          K.raise(tl, el, w(12, "counter") + i * 0.25);
          tl.to(el, { x: END_CUP.x + sl.x - CR - 4, y: END_CUP.y + sl.y - CR - 4 }, w(12, "counter") + i * 0.25, { dur: 0.5, ease: "in-out-cubic" });
          return el;
        });
        K.raise(tl, hops[1], w(12, "pulls"));
        tl.to(hops[1], { x: ECUPC.x + 240 - CR - 4, y: ECUPC.y - 60 - CR - 4, scale: 1.2 }, w(12, "pulls"), { dur: 0.55, ease: "in-out-cubic" });
        K.write(tl, endPaper.words[0], w(12, "writes"));
        tl.to(cup.el, { rotation: 14 }, w(12, "Tip"), { dur: 0.25, ease: "out-quad" });
        tl.to(cup.el, { rotation: 0 }, w(12, "Tip") + 0.45, { dur: 0.3 });
        hops.forEach((el, i) => {
          K.raise(tl, el, w(12, "Tip") + 0.1 + i * 0.05);
          tl.to(el, { x: TUBC.x - CR - 4 + (i - 1) * 60, y: TUBC.y - CR - 4, scale: 1 }, w(12, "Tip") + 0.1 + i * 0.05, { dur: 0.5, ease: "in-cubic" });
          tl.to(el, { opacity: 0 }, w(12, "Tip") + 0.55, { dur: 0.2 });
        });

        // ============================================================ line 13
        // (TC) reader, find the full stop
        const tFind = w(13, "find");
        ringOn("reader", tFind - 0.3);
        tl.to(sheets[lDot.sheet].el, { y: END_FAN[lDot.sheet].y - 12, scale: 0.26 }, w(13, "full"), { dur: 0.45, ease: "out-cubic" });
        tl.to(sheets[lDot.sheet].rows[lDot.row].lit, { opacity: 1 }, w(13, "stop") + 0.2, { dur: 0.3 });

        // ---- glints: the cup's rim and the tub as they arrive (line 3), and
        // again on the held desk at the close
        K.glint(tl, cup.rim, { from: w(3, "cup") + 0.3, to: w(3, "seven") });
        K.glint(tl, tubLine, { kind: "gap", phase: 0.8, from: w(3, "cup") + 0.3, to: w(3, "seven") });
        K.glint(tl, cup.rim, { from: t12 + 0.9, to: w(12, "reader") - 0.3, lap: 2.4 });
        K.glint(tl, tubLine, { kind: "gap", from: w(13, "stop") + 0.4, to: T.duration, lap: 2.4 });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["generation-ledger"] = tl;
      });
    </script>
  </body>
</html>
