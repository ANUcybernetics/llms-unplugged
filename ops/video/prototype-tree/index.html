<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — prototype: the tree of every text</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      .word {
        position: absolute; left: 0; top: 0; transform-origin: 50% 50%;
        font-family: var(--font-tok); font-size: 30px; line-height: 1; white-space: nowrap;
        color: var(--text-2); background: var(--desk); padding: 4px 8px 7px; border-radius: 6px;
      }
      .word.punct { padding: 4px; }
      .word.col { font-size: 40px; color: var(--text); background: none; }
      .word.lit { color: var(--gold-2); font-weight: 700; }
    </style>
  </head>
  <body>
    <!-- Prototype beat for TASK-167 (the canvas layer): ops/video/scripts/
         generation.md, "And here's every sentence this model could have written
         instead." The magpie's counts, rooted at the full stop: every path the
         counts allow, DEPTH words deep, drawn on a canvas as a pure function of
         t (each branch as thick as it is likely), then the walk ". it sits on
         the dog ." lights gold through it while the rest dims. The caption
         is a stand-in timing (no voice yet). -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="prototype-tree"
         data-start="0" data-duration="18.00" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="18.00" data-track-index="0"></div>
    </div>
    <script type="module">
      import * as C from "./kit/motion/canvas.js";

      const build = (tl, S, T) => {
        const K = KIT, D = KIT_DATA;
        const scene = document.getElementById("scene");
        const A = S.area;

        // ---- the model: The magpie's ledger rows, lowercased (the CLI keeps
        // "Here", "Down", "Swoop" capitalised after a full stop; the video's
        // model is the lowercased text, so those merge into their rows)
        const rows = new Map();
        for (const r of D.ledger["the-magpie"].sheets.flatMap((s) => s.pages.flat())) {
          const w = r.prefix[0].toLowerCase();
          const row = rows.get(w) ?? new Map();
          for (const f of r.followers) row.set(f.text.toLowerCase(), (row.get(f.text.toLowerCase()) ?? 0) + f.count);
          rows.set(w, row);
        }
        // a row's followers with probabilities, the likeliest in the middle and
        // the rest alternating outwards, so the tree's bold paths run through its
        // middle and the rare ones fan to the edges
        const followers = (w) => {
          const row = [...(rows.get(w) ?? new Map())];
          const total = row.reduce((s, [, n]) => s + n, 0);
          const byCount = row.map(([word, n], i) => ({ word, p: n / total, i })).sort((a, b) => b.p - a.p || a.i - b.i);
          const out = [];
          byCount.forEach((f, k) => (k % 2 ? out.unshift(f) : out.push(f)));
          return out;
        };

        // ---- the tree: every path from "." DEPTH words deep, one node per
        // prefix. Leaves share the height evenly; a node sits at the middle of
        // its leaves.
        const DEPTH = 12;
        const X0 = 250, X1 = A.x + A.w - 10, DX = (X1 - X0) / DEPTH;
        const Y0 = A.y + 16, Y1 = A.y + A.h - 16;
        const colX = (d) => X0 + d * DX;
        const nodes = []; // { word, depth, parent, p, leaf0, leaves, y }
        let leafCount = 0;
        const grow = (word, depth, parent, p) => {
          const n = { word, depth, parent, p, leaf0: leafCount, leaves: 0, kids: [] };
          nodes.push(n);
          if (depth === DEPTH) leafCount++;
          else for (const f of followers(word)) n.kids.push(grow(f.word, depth + 1, n, p * f.p));
          n.leaves = leafCount - n.leaf0;
          return n;
        };
        const root = grow(".", 0, null, 1);
        const LH = (Y1 - Y0) / leafCount;
        for (const n of nodes) n.y = Y0 + (n.leaf0 + n.leaves / 2) * LH;
        // past the walk's last word, nodes stagger a little in x (seeded), so
        // the thousands of junctions don't line up into vertical seams
        const r = C.rng(167);
        for (const n of nodes) n.x = colX(n.depth) + (n.depth > 6 && n.depth < DEPTH ? (r() - 0.5) * 0.6 * DX : 0);

        // the walk the script takes: . it sits on the dog .
        const WALK = [".", "it", "sits", "on", "the", "dog", "."];
        const path = [root];
        for (const w of WALK.slice(1)) path.push(path.at(-1).kids.find((k) => k.word === w));

        // ---- times
        const tFly = 0.7; // the column's "." moves to the root
        const G0 = 1.5, G1 = 9.2; // the tree grows left to right
        const tDim = 10.4; // the tree dims
        const W0 = 11.2, WSTEP = 0.75; // the walk lights, one word per step
        const growEase = C.phase; // (t, t0, dur, ease)
        const frontX = (t) => X0 + (X1 - X0 + 2) * growEase(t, G0, G1 - G0, "in-out-quad");
        // when the front reaches x (for the labels): invert frontX by bisection
        const tAt = (x) => {
          let a = G0, b = G1;
          for (let i = 0; i < 40; i++) {
            const m = (a + b) / 2;
            frontX(m) < x ? (a = m) : (b = m);
          }
          return b;
        };

        // ---- branch style: each branch is as thick as it is likely, and its
        // ink (opacity times width) is its probability times a gain that grows
        // smoothly left to right. Probability is conserved at every node (the
        // branches leaving it add up to the one arriving), so the ink does not
        // step at a column edge; the gain keeps the deep columns' thousands of
        // hairlines visible, and fades the last column out. The opacity rides a
        // gradient along x, and branches are grouped into buckets (depth, width,
        // ink) so a frame strokes a few hundred paths, not ten thousand.
        const L = (a, b, s) => a + (b - a) * s;
        const width = (p) => 0.4 + 11 * Math.sqrt(p);
        const INK = 15, GAIN = Math.log(12) / DEPTH;
        const gain = (x) => {
          const d = (x - X0) / DX;
          return Math.exp(GAIN * d) * (d > DEPTH - 1 ? 1 - 0.8 * (d - DEPTH + 1) : 1);
        };
        const q = (a) => +Math.exp(Math.round(Math.log(a) * 32) / 32).toFixed(5);
        const STOPS = Array.from({ length: 4 * DEPTH + 1 }, (_, i) => i / (4 * DEPTH));
        const buckets = new Map();
        for (const n of nodes) {
          if (!n.parent) continue;
          const w = +width(n.p).toFixed(2);
          const k = q((INK * n.p) / w); // opacity per unit of gain
          const key = `${w}|${k}`;
          if (!buckets.has(key)) buckets.set(key, { w, stops: STOPS.map((f) => Math.min(0.95, k * gain(L(X0, X1, f)))), nodes: [] });
          buckets.get(key).nodes.push(n);
        }
        const styles = [...buckets.values()].sort((a, b) => a.w - b.w);

        // a branch is a cubic with level tangents from its parent to its node;
        // drawn up to the growth front, it is split at the parameter s where its
        // x reaches the front (x(s) = 1.5s - 1.5s^2 + s^3 of the step)
        const sAt = (f) => {
          let s = f;
          for (let i = 0; i < 6; i++) s -= (1.5 * s - 1.5 * s * s + s ** 3 - f) / (1.5 - 3 * s + 3 * s * s);
          return Math.max(0, Math.min(1, s));
        };
        const branch = (ctx, n, s) => {
          const xa = n.parent.x, xb = n.x, ya = n.parent.y, yb = n.y;
          const p1x = (xa + xb) / 2, p2x = p1x;
          ctx.moveTo(xa, ya);
          if (s >= 1) return ctx.bezierCurveTo(p1x, ya, p2x, yb, xb, yb);
          // de Casteljau: the first part of the curve, up to s
          const q1x = L(xa, p1x, s), q1y = ya;
          const rx = L(p1x, p2x, s), ry = L(ya, yb, s);
          const q2x = L(q1x, rx, s), q2y = L(q1y, ry, s);
          const ux = L(rx, L(p2x, xb, s), s), uy = L(ry, yb, s);
          ctx.bezierCurveTo(q1x, q1y, q2x, q2y, L(q2x, ux, s), L(q2y, uy, s));
        };

        const gold = "#e5a930";
        C.canvas(
          tl,
          scene,
          (ctx, t) => {
            const fx = frontX(t);
            if (fx <= X0) return;
            // how far along each branch the front has reached
            const sOf = (n) => (fx >= n.x ? 1 : fx <= n.parent.x ? 0 : sAt((fx - n.parent.x) / (n.x - n.parent.x)));
            const dim = 1 - 0.65 * C.phase(t, tDim, 0.8, "in-out-quad");
            ctx.globalAlpha = dim;
            for (const st of styles) {
              const g = ctx.createLinearGradient(X0, 0, X1, 0);
              STOPS.forEach((f, i) => g.addColorStop(f, `rgb(255 255 255 / ${st.stops[i].toFixed(4)})`));
              ctx.strokeStyle = g;
              ctx.lineWidth = st.w;
              ctx.beginPath();
              for (const n of st.nodes) {
                const s = sOf(n);
                if (s > 0) branch(ctx, n, s);
              }
              ctx.stroke();
            }
            // the walk, gold, one step at a time
            ctx.globalAlpha = 1;
            ctx.lineCap = "round";
            ctx.strokeStyle = gold;
            ctx.lineWidth = 5;
            ctx.beginPath();
            for (let k = 1; k < path.length; k++) {
              const s = C.phase(t, W0 + (k - 1) * WSTEP, WSTEP * 0.7, "in-out-quad");
              if (s > 0) branch(ctx, path[k], sAt(s));
            }
            ctx.stroke();
          },
          { x: 0, y: 0, w: S.W, h: S.H - S.captionH },
        );

        // ---- words
        const word = (text, cls = "") => {
          const punct = K.isPunct(text);
          const e = K.el("div", { class: `word ${punct ? "punct" : ""} ${cls}`.trim(), ...(punct ? {} : { text }) }, scene);
          if (punct) K.punctTile(e, text, { fill: "var(--desk)" });
          return e;
        };
        const centreAt = (el, x, y) => K.set(el, { x: x - el.offsetWidth / 2, y: y - el.offsetHeight / 2 });

        // the strip's words, in a column at the left edge
        const colGap = 64, colTop = (Y0 + Y1) / 2 - ((WALK.length - 1) * colGap) / 2;
        const column = WALK.map((w, i) => {
          const el = word(w, "col");
          centreAt(el, A.x + 40, colTop + i * colGap);
          return el;
        });
        // the first full stop becomes the root
        const rootEl = column[0];
        const rootTo = { x: colX(0) - rootEl.offsetWidth / 2 - 18, y: root.y - rootEl.offsetHeight / 2 };
        tl.to(column.slice(1), { opacity: 0.4 }, tFly - 0.2, { dur: 0.4 });
        tl.to(rootEl, rootTo, tFly, { dur: 0.7, ease: "in-out-cubic" });

        // the first three words deep are labelled as the front passes them
        const labels = new Map();
        for (const n of nodes) {
          if (n.depth < 1 || n.depth > 3) continue;
          const el = word(n.word);
          centreAt(el, colX(n.depth), n.y);
          K.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1 }, tAt(colX(n.depth) - 8), { dur: 0.3 });
          labels.set(n, el);
        }
        tl.to([...labels.values()], { opacity: 0.25 }, tDim, { dur: 0.8 });

        // the walk: each column word flies from the column onto its node as the
        // gold reaches it, and lights
        path.slice(1).forEach((n, i) => {
          const el = column[i + 1];
          const t = W0 + i * WSTEP + WSTEP * 0.35;
          const lit = word(n.word, "lit");
          centreAt(lit, n.x, n.y);
          K.set(lit, { opacity: 0 });
          const to = { x: K.get(lit, "x") + (lit.offsetWidth - el.offsetWidth) / 2, y: K.get(lit, "y") + (lit.offsetHeight - el.offsetHeight) / 2 };
          tl.to(el, { ...to, scale: 0.75, opacity: 1 }, t, { dur: 0.45, ease: "in-out-cubic" });
          tl.to(el, { opacity: 0 }, t + 0.4, { dur: 0.15 });
          tl.to(lit, { opacity: 1 }, t + 0.3, { dur: 0.2 });
          if (labels.has(n)) tl.to(labels.get(n), { opacity: 0 }, t + 0.3, { dur: 0.2 });
        });
        tl.to(rootEl, { color: gold }, W0 - 0.3, { dur: 0.3 });

        window.TREE = { nodes: nodes.length, leaves: leafCount, buckets: styles.length };
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["prototype-tree"] = tl;
      });
    </script>
  </body>
</html>
