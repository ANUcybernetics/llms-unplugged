<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Generation (cutouts), beyond the slides</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- A worked sentence, a four-way choice, then the classroom activity. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="landscape" data-composition-id="generation-cutouts"
         data-start="0" data-duration="144.08" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="144.08" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="137.08" data-track-index="1"></audio>
    </div>
    <script type="module">
      import { WALK, wordTimes, paperLine, splice, walkStyle } from "./parts/generation-walk.js";
      import { cutouts, spread, row, piles, heap, at, tokenBox } from "./parts/cutouts-slips.js";

      const build = (tl, S, T) => {
        const K = KIT, MG = MAGPIE;
        const scene = document.getElementById("scene");
        const A = S.area;
        const W = wordTimes(T);
        const w = W.word;
        walkStyle();

        // ---- the cutouts: one slip per pair, the "the fence" slips on top
        // (they lift across the spread first)
        const C = cutouts(scene, MG, { size: 44, last: (p) => p.a === "the" && p.b === "fence" });
        const all = C.slips;
        const of = C.of;
        const els = (list) => list.map((o) => o.el);
        // the spread full frame; swept up to the top of the desk to make room
        // for the piles, the chain and the paper; and the hand-off's spread
        const FULL = spread(all, { x0: 16, x1: 1904, y0: 14, y1: 876, cols: 12, rows: 11, scale: 0.5, jx: 70, jy: 34, rot: 14, seed: 3 });
        const TOP = spread(all, { x0: 16, x1: 1904, y0: 8, y1: 410, cols: 12, rows: 11, scale: 0.38, jx: 64, jy: 10, rot: 8, seed: 3 });
        const END = spread(all, { x0: 16, x1: 1904, y0: 10, y1: 600, cols: 12, rows: 11, scale: 0.42, jx: 24, jy: 10, rot: 6, seed: 3 });
        all.forEach((o) => K.set(o.el, { ...FULL[o.k], opacity: 0 }));

        // the work zone under the swept-up spread: piles, the chosen slip,
        // the chain of slips used, the strip of paper
        const WZ = { cx: 960, cy: 548, scale: 0.72 };
        const CHOSEN = { cx: 1520, cy: 548, scale: 0.95 };
        const PAPER = { x: 410, y: 752 };
        const paper = paperLine(scene, WALK.slice(1), { x: PAPER.x, y: PAPER.y, w: 1100, h: 108, size: 56 });
        K.set(paper.el, { opacity: 0 });

        // the six slips the walk uses, and their chain above the paper
        const walk = [
          of(".", "it")[0],
          of("it", "sits")[1],
          of("sits", "on")[0],
          of("on", "the")[0],
          of("the", "dog")[2],
          of("dog", ".")[0],
        ];
        const chainAt = (scale, cy, gap) => row(walk, { cx: 960, cy, scale, gap, rot: 0 });
        const CHAIN = chainAt(0.55, 680, 10);
        const DOMINO = chainAt(1, 798, 12);

        // ---- helpers
        // a slip that moves lands on top of whatever it lands on (fly)
        const fly = (o, place, t, opts) => {
          K.raise(tl, o.el, t);
          tl.to(o.el, place, t, opts);
        };
        const go = (list, places, t, { dur = 0.6, stagger = 0, ease = "in-out-cubic" } = {}) =>
          list.forEach((o, i) => fly(o, places[i], t + i * stagger, { dur, ease }));
        const home = (list, t, layout = TOP) => go(list, list.map((o) => layout[o.k]), t, { dur: 0.55, stagger: 0.02 });
        const light = (list, t, on = true) => tl.to(list.map((o) => o.lit), { opacity: on ? 1 : 0 }, t, { dur: on ? 0.25 : 0.35 });
        // the rest of the spread dims while `keep` is picked out
        // (the chain of slips used stays lit: `chained` grows as the build
        // goes, in time order)
        const chained = [];
        const dim = (keep, t, to = 0.28) => {
          const set = new Set([...keep, ...chained]);
          tl.to(els(all.filter((o) => !set.has(o))), { opacity: to }, t, { dur: 0.4 });
          if (keep.length) tl.to(els(keep), { opacity: 1 }, t, { dur: 0.3 });
        };
        const undim = (t, list = all) => tl.to(els(list), { opacity: 1 }, t, { dur: 0.4 });
        // (no yoyo: the engine's yoyo returns to an unresolved value)
        const pulse = (targets, t, s = 1.3, base = 1) => {
          tl.to(targets, { scale: s }, t, { dur: 0.22, ease: "out-quad" });
          tl.to(targets, { scale: base }, t + 0.22, { dur: 0.25, ease: "in-out-quad" });
        };
        const pulseSlips = (list, places, t, k = 1.14) =>
          list.forEach((o, i) => pulse(o.el, t, places[i].scale * k, places[i].scale));
        // group a word's slips by next word, in the row's order (MAGPIE.rows:
        // first met in the book, the ledger's colour order)
        const groups = (a) => MG.rows[a].map(([b]) => of(a, b));
        // shuffle a heap and slide one slip out of it to CHOSEN
        const pick = (list, chosen, t0, tOut) => {
          const H = { cx: WZ.cx, cy: WZ.cy, scale: WZ.scale };
          go(list, heap(list, { ...H, mix: 0 }), t0, { dur: 0.45, stagger: 0.012 });
          const mid = (t0 + 0.45 + list.length * 0.012 + tOut) / 2 - 0.12;
          go(list, heap(list, { ...H, mix: 1 }), mid, { dur: 0.24, ease: "in-out-quad" });
          fly(chosen, at(chosen, CHOSEN.cx, CHOSEN.cy, CHOSEN.scale), tOut, { dur: 0.5, ease: "out-cubic" });
          light([chosen], tOut + 0.3);
        };
        // Every selected slip returns after its word has been recorded.
        const settle = (chosen, rest, t, slot) => {
          light([chosen], t, false);
          home([chosen], t);
          home(rest, t + 0.05);
        };

        // ============================================================ line 0
        // (TC) the desk, top-down: the magpie's cutouts spread out, boxes up
        tl.to(els(all), { opacity: 1 }, 0.1, { dur: 0.5 });

        // ============================================================ line 1
        // one slip lifts and faces the camera: "the" boxed, "fence" beside it;
        // five more "the fence" slips stack on it
        const tf = of("the", "fence");
        const hero = tf[0];
        const HERO = at(hero, 960, 430, 1.55);
        dim([], w(1, "Every") + 0.1, 0.3);
        fly(hero, { ...HERO, opacity: 1 }, w(1, "Every") + 0.15, { dur: 0.85, ease: "in-out-cubic" });
        const ring = K.ring(scene, { w: 100, h: 100, stroke: 5 });
        const bPrev = tokenBox(hero, HERO, 0), bNext = tokenBox(hero, HERO, 1);
        tl.set(ring.el, { x: bPrev.x - 12, y: bPrev.y - 12, scaleX: (bPrev.w + 24) / 100, scaleY: (bPrev.h + 24) / 100 }, w(1, "word") - 0.3);
        K.raise(tl, ring.el, w(1, "word") - 0.3); // over the lifted slip it rings
        tl.to(ring.el, { opacity: 1 }, w(1, "word") - 0.1, { dur: 0.3 });
        ring.around(tl, bNext, w(1, "word", 2) - 0.1, 0.45, 12);
        tl.to(ring.el, { opacity: 0 }, w(1, "A", 3) - 0.2, { dur: 0.35 });
        const stackAt = tf.map((o, j) => ({ ...at(o, 960 + (K.jitter(j * 5) - 0.5) * 16, 430 - j * 12, 1.55), rotation: j ? (K.jitter(j * 9) - 0.5) * 6 : 0 }));
        tf.slice(1).forEach((o, j) => {
          const t = w(1, "six") - 0.25 + j * 0.12;
          tl.to(o.el, { opacity: 1 }, t, { dur: 0.2 });
          fly(o, stackAt[j + 1], t, { dur: 0.7, ease: "in-out-cubic" });
        });
        pulseSlips(tf, stackAt, w(1, "slips") - 0.05, 1.05);

        // ============================================================ line 2
        // the spread sweeps up; the full stop slips light; ". it" slides out;
        // "it" is written
        const t2 = T.start(2) - 0.4;
        undim(t2);
        all.forEach((o) => tl.to(o.el, TOP[o.k], t2 + 0.05 + (FULL[o.k].y / 900) * 0.35, { dur: 0.8, ease: "in-out-cubic" }));
        K.appear(tl, paper.el, t2 + 0.9, { y: 20 });
        const dots = of(".");
        dim(dots, w(2, "full"));
        light(dots, w(2, "full") + 0.05);
        const s0 = walk[0];
        fly(s0, at(s0, CHOSEN.cx, CHOSEN.cy, CHOSEN.scale), w(2, "This") - 0.1, { dur: 0.6, ease: "in-out-cubic" });
        light(dots.filter((o) => o !== s0), w(2, "This"), false);
        K.write(tl, paper.words[0], w(2, "Write"));
        light([s0], w(2, "down") + 0.2, false);
        home([s0], w(2, "back"));
        undim(w(2, "down") + 0.3);

        // ============================================================ line 3
        // every "it" slip gathers into one loose row, next words showing;
        // shuffled, one slides out: "it sits"
        const its = groups("it").flat();
        dim(its, w(3, "every"));
        light(its, w(3, "every"));
        const IT_ROW = row(its, { cx: WZ.cx, cy: WZ.cy, scale: WZ.scale, gap: 14 });
        go(its, IT_ROW, w(3, "box") - 0.2, { dur: 0.7, stagger: 0.06 });
        light(its, w(3, "ten") - 0.2, false);
        [["sits", "sits"], ["watches", "watches"], ["goes", "goes"], ["is", "is"]].forEach(([b, said]) => {
          const g = its.filter((o) => o.b === b);
          pulseSlips(g, g.map((o) => IT_ROW[its.indexOf(o)]), w(3, said) - 0.05, 1.12);
        });
        const s1 = walk[1];
        pick(its, s1, w(3, "Shuffle") - 0.1, w(3, "sits", 2) - 0.45);
        K.write(tl, paper.words[1], w(3, "sits", 2) + 0.1);
        settle(s1, its.filter((o) => o !== s1), w(3, "back"), 1);
        undim(T.end(3) + 0.4);

        // ============================================================ line 4
        // every "sits" slip says "on"; every "on" slip says "the"
        const sits = of("sits"), ons = of("on");
        dim(sits, w(4, "Every") - 0.1);
        light(sits, w(4, "Every") - 0.1);
        const SITS_ROW = row(sits, { cx: WZ.cx, cy: WZ.cy, scale: WZ.scale, gap: 30 });
        go(sits, SITS_ROW, w(4, "slip") - 0.3, { dur: 0.6, stagger: 0.06 });
        light(sits, w(4, "says") + 0.1, false);
        pulse(sits.map((o) => o.nextTok), w(4, "on"), 1.3);
        K.write(tl, paper.words[2], w(4, "on") + 0.1);
        settle(walk[2], sits.filter((o) => o !== walk[2]), w(4, "and") + 0.05, 2);
        dim(ons, w(4, "every", 2) - 0.1);
        light(ons, w(4, "every", 2) - 0.1);
        const ONS_ROW = row(ons, { cx: WZ.cx, cy: WZ.cy, scale: WZ.scale, gap: 30 });
        go(ons, ONS_ROW, w(4, "on", 2) - 0.2, { dur: 0.6, stagger: 0.06 });
        light(ons, w(4, "says", 2), false);
        pulse(ons.map((o) => o.nextTok), w(4, "the"), 1.3);
        K.write(tl, paper.words[3], w(4, "the") + 0.1);
        settle(walk[3], ons.filter((o) => o !== walk[3]), w(4, "only"), 3);
        undim(w(4, "way"));

        // ============================================================ line 5
        // nineteen "the" slips in four piles; shuffled, "the dog" comes out;
        // four "dog" slips in two piles; shuffled, "dog ." comes out
        const theG = groups("the"), thes = theG.flat();
        dim(thes, w(5, "The") - 0.1);
        light(thes, w(5, "The") - 0.1);
        const THE_P = piles(theG, { cx: WZ.cx - 40, cy: WZ.cy, scale: WZ.scale, gap: 70, step: 11 });
        theG.forEach((g, i) => go(g, THE_P[i], w(5, "nineteen") - 0.2 + i * 0.12, { dur: 0.7, stagger: 0.04 }));
        light(thes, w(5, "slips") + 0.3, false);
        const s4 = walk[4];
        pick(thes, s4, w(5, "Pick") - 0.1, w(5, "dog") - 0.4);
        K.write(tl, paper.words[4], w(5, "dog") + 0.1);
        settle(s4, thes.filter((o) => o !== s4), w(5, "And") - 0.3, 4);
        const dogG = groups("dog"), dogs = dogG.flat();
        dim(dogs, w(5, "dog", 2) - 0.15);
        light(dogs, w(5, "dog", 2) - 0.15);
        const DOG_P = piles(dogG, { cx: WZ.cx - 40, cy: WZ.cy, scale: WZ.scale, gap: 110, step: 11 });
        dogG.forEach((g, i) => go(g, DOG_P[i], w(5, "four") - 0.25 + i * 0.12, { dur: 0.6, stagger: 0.05 }));
        light(dogs, w(5, "two") - 0.1, false);
        pulseSlips(dogG[0], DOG_P[0], w(5, "full"), 1.12);
        pulseSlips(dogG[1], DOG_P[1], w(5, "runs"), 1.12);
        const s5 = walk[5];
        pick(dogs, s5, w(5, "Pick", 2) - 0.1, w(5, "full", 2) - 0.35);
        K.write(tl, paper.words[5], w(5, "stop"));
        light([s5], T.end(5) + 0.2, false);
        home([s5], T.end(5) + 0.2);

        // ============================================================ line 6
        // the six slips end to end like dominoes, the strip above them, and
        // above that two of the book's sentences, whose halves make it
        const t6 = T.start(6) - 0.4;
        const others = all.filter((o) => !walk.includes(o));
        tl.to(els(others), { opacity: 0 }, t6 - 0.2, { dur: 0.5 });
        const PAPER_MID = { x: PAPER.x, y: 574, scale: 1 };
        tl.to(paper.el, { x: PAPER_MID.x, y: PAPER_MID.y }, t6 + 0.1, { dur: 0.8, ease: "in-out-cubic" });
        go(walk, DOMINO, t6 + 0.1, { dur: 0.8, stagger: 0.04 });
        splice(tl, scene, { cx: 960, y: 290, size: 68, times: { show: w(6, "book") - 0.1, pieces: w(6, "fence"), join: w(6, "dog") } });
        const sp = scene.querySelectorAll(".splice-word");
        // one pair at a time: each slip's next word is the next slip's box
        walk.forEach((o, i) => {
          const t = w(6, "ended") + i * 0.2;
          tl.to(o.lit, { opacity: 1 }, t, { dur: 0.2 });
          tl.to(o.lit, { opacity: 0 }, t + 0.45, { dur: 0.3 });
        });
        // Four choices after "the", shown at a scale that can be read.
        const forkStart = T.start(7);
        tl.to([paper.el, ...sp, ...els(walk)], { opacity: 0 }, forkStart - 0.4, { dur: 0.4 });
        const fork = K.layer(scene, 0, 0);
        const forkSvg = K.svg("svg", { width: 1920, height: 860, viewBox: "0 0 1920 860" }, fork);
        const forkRoot = K.svg("text", { x: 420, y: 445, fill: "var(--text)", "font-size": 58, "font-family": "var(--font-tok)" }, forkSvg);
        forkRoot.textContent = "the";
        K.set(fork, { opacity: 0 });
        tl.to(fork, { opacity: 1 }, forkStart, { dur: 0.3 });
        const forkPaths = {};
        const counts = [5, 6, 4, 4];
        ["magpie", "fence", "postie", "dog"].forEach((word, i) => {
          const y = 170 + i * 170;
          const path = K.svg("path", { d: `M 550 425 C 950 425, 950 ${y}, 1310 ${y}`, fill: "none", stroke: "var(--text)", "stroke-width": counts[i] * 3 }, forkSvg);
          const label = K.svg("text", { x: 1340, y: y + 20, fill: "var(--text)", "font-size": 58, "font-family": "var(--font-tok)" }, forkSvg);
          label.textContent = word;
          K.set([path, label], { opacity: 0 });
          tl.to([path, label], { opacity: 1 }, w(7, word), { dur: 0.35 });
          forkPaths[word] = path;
        });
        const highlight = (word, t0, t1) => {
          tl.to(forkPaths[word], { stroke: "var(--gold)" }, t0, { dur: 0.2 });
          if (t1) tl.to(forkPaths[word], { stroke: "var(--text)" }, t1, { dur: 0.2 });
        };
        highlight("dog", T.start(8), w(8, "different"));
        highlight("fence", w(8, "different"), w(8, "dog"));
        highlight("dog", w(8, "dog"));
        tl.to(fork, { opacity: 0 }, T.start(10) - 0.5, { dur: 0.4 });

        // ============================================================ line 10
        // the hand-off: the cutouts spread out again; a starting word; the
        // slips whose box colour matches light, then the ones whose word
        // does; one lifts, its next word is written; the next word's colour
        // lights
        const t10 = T.start(10) - 0.5;
        chained.length = 0; // the walk's slips are back in the spread
        all.forEach((o) => {
          tl.set(o.el, heap([o], { cx: 960, cy: 320, scale: 0.42, spreadX: 60, spreadY: 30, rot: 20, mix: 3 })[0], t10 + 0.3);
          tl.set(o.lit, { opacity: 0 }, t10 + 0.3);
        });
        tl.to(els(all), { opacity: 1 }, t10 + 0.35, { dur: 0.3 });
        all.forEach((o) => tl.to(o.el, END[o.k], w(10, "Spread") + K.jitter(o.k * 3 + 17) * 0.4, { dur: 0.8, ease: "out-cubic" }));
        const endPaper = paperLine(scene, ["the", "postie", "runs"], { x: 610, y: 752, w: 700, h: 108, size: 56 });
        K.set(endPaper.el, { opacity: 0 });
        K.appear(tl, endPaper.el, w(10, "Write") - 0.2, { y: 20 });
        K.write(tl, endPaper.words[0], w(10, "starting"));
        // box colour first, then the word
        const byColour = (word) => all.filter((o) => K.colourIndex(o.A) === K.colourIndex(word));
        const cThe = byColour("the"), eThes = of("the");
        dim(cThe, w(10, "find"), 0.22);
        dim(eThes, w(10, "box") - 0.1, 0.22);
        light(eThes, w(10, "box") - 0.1);
        const ELIFT = { cx: 960, cy: 680, scale: 0.85 };
        const e1 = of("the", "postie")[1];
        const endHeap = heap(eThes, { cx: 960, cy: 420, scale: 0.65, mix: 0 });
        go(eThes, endHeap, w(10, "Shuffle"), { dur: 0.45 });
        go(eThes, heap(eThes, { cx: 960, cy: 420, scale: 0.65, mix: 1 }), w(10, "pick"), { dur: 0.35 });
        fly(e1, at(e1, ELIFT.cx, ELIFT.cy, ELIFT.scale), w(10, "looking"), { dur: 0.55, ease: "out-cubic" });
        light(eThes.filter((o) => o !== e1), w(10, "looking"), false);
        K.write(tl, endPaper.words[1], w(10, "beside"));
        home(eThes.filter((o) => o !== e1), w(10, "back"), END);
        // put it back; the next word's colour
        light([e1], w(10, "back"), false);
        fly(e1, END[e1.k], w(10, "back"), { dur: 0.5, ease: "in-out-cubic" });
        const cPostie = byColour("postie"), ePosties = of("postie");
        undim(w(10, "back") + 0.1, cPostie);
        dim(cPostie, w(10, "back") + 0.1, 0.22);
        pulseSlips(cPostie, cPostie.map((o) => END[o.k]), w(10, "colours"), 1.15);
        dim(ePosties, w(10, "matches") - 0.1, 0.22);
        light(ePosties, w(10, "matches") - 0.1);

        // ============================================================ line 11
        // (TC) start chaining: one lifts, its next word is written
        const e2 = of("postie", "runs")[0];
        light(ePosties.filter((o) => o !== e2), w(11, "Start"), false);
        fly(e2, at(e2, ELIFT.cx, ELIFT.cy, ELIFT.scale), w(11, "Start") - 0.1, { dur: 0.5, ease: "out-cubic" });
        K.write(tl, endPaper.words[2], w(11, "chaining"));
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["generation-cutouts"] = tl;
      });
    </script>
  </body>
</html>
