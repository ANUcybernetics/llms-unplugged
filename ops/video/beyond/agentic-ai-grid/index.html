<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Agentic AI (grid)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- Agentic AI (grid): ops/video/beyond/scripts/agentic-ai-grid.md. The
         desk: The magpie's grid at the left (the model), a d10 and the paper
         strip at the right, a phone that slides in when the tool is called.
         The harness beats (phone, splice, back-fill, the loop) are shared
         with agentic-ai-ledger in parts/agentic.js. Every beat lands on a word
         of the voice track (timing.json from align.py). -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="agentic-ai-grid"
         data-start="0" data-duration="126.30" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="126.30" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="126.30" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as AG from "./parts/agentic.js";

      const build = (tl, S, T) => {
        const K = KIT, MP = MAGPIE;
        const scene = document.getElementById("scene");

        // ---- the model: The magpie's grid, lowercased (MAGPIE, checked
        // against the CLI), drawn large and scaled down so its tallies and
        // headers stay crisp at 4K
        const bg = K.bigrams(MP.words, MP.vocab);
        const V = (w) => bg.idx.get(w);
        const N = bg.vocab.length;
        const CELL = 90, HEAD = 220;
        const grid = K.grid(scene, bg, { cell: CELL, head: HEAD });
        const GW = grid.width;
        const GS = 870 / (GW + CELL + 10), GX = 60, GY = 8;
        K.set(grid.el, { x: GX, y: GY, scale: GS });
        // every tally is already on the sheet: this is a finished grid
        K.set(grid.cells.flat().flatMap((c) => c.strokes), { strokeDashoffset: 0 });
        // headers set larger than the kit's default, the column words turned
        // upright so twenty-four of them fit
        grid.rowHead.forEach((h, r) => { if (!K.isPunct(bg.vocab[r])) h.setAttribute("font-size", 50); });
        grid.colHead.forEach((h, c) => {
          if (K.isPunct(bg.vocab[c])) return;
          const x = HEAD + c * CELL + CELL / 2 + 16, y = HEAD - 16;
          Object.entries({ x, y, "font-size": 46, "text-anchor": "start", transform: `rotate(-90 ${x} ${y})` }).forEach(([k, v]) => h.setAttribute(k, v));
        });
        for (const b of [...grid.rowBands, ...grid.colBands]) b.setAttribute("fill-opacity", "0.45");
        // a cell's box in scene coordinates
        const cellBox = (r, c) => ({ x: GX + (HEAD + c * CELL) * GS, y: GY + (HEAD + r * CELL) * GS, w: CELL * GS, h: CELL * GS });
        const headBox = (r) => ({ x: GX + 6 * GS, y: GY + (HEAD + r * CELL) * GS, w: (HEAD - 12) * GS, h: CELL * GS });
        // cell fills (under the rules and tallies), row mutes and row outlines
        // (over them): what lights a cell or a whole row's share
        const under = grid.colBands.at(-1).nextSibling;
        const fills = bg.vocab.map((_, r) => bg.vocab.map((_, c) => {
          if (!bg.counts[r][c]) return null;
          const f = K.svg("rect", { x: HEAD + c * CELL + 3, y: HEAD + r * CELL + 3, width: CELL - 6, height: CELL - 6, fill: "#e5a930" });
          grid.svg.insertBefore(f, under);
          K.set(f, { opacity: 0 });
          return f;
        }));
        const mutes = bg.vocab.map((_, r) => {
          const m = K.svg("rect", { x: 0, y: HEAD + r * CELL, width: GW, height: CELL, fill: "var(--paper)" });
          grid.svg.insertBefore(m, grid.dimmer);
          K.set(m, { opacity: 0 });
          return m;
        });
        const outlines = bg.vocab.map((_, r) => {
          const o = K.svg("rect", { x: 4, y: HEAD + r * CELL + 4, width: GW - 8, height: CELL - 8, fill: "none", stroke: "var(--gold)", "stroke-width": 9 }, grid.svg);
          K.set(o, { opacity: 0 });
          return o;
        });
        // each row's chance of rolling punctuation: its share of tallies
        const PUNCT = bg.vocab.map((w, c) => c).filter((c) => K.isPunct(bg.vocab[c]));
        const share = bg.vocab.map((_, r) => {
          const tot = bg.counts[r].reduce((s, n) => s + n, 0);
          return tot ? PUNCT.reduce((s, c) => s + bg.counts[r][c], 0) / tot : 0;
        });
        // where "sandwich" would go: a row after the last, which the grid hasn't got
        const slotEl = K.el("div", { class: "ag-slot", style: { width: `${GW * GS}px`, height: `${CELL * GS}px` } }, scene);
        K.set(slotEl, { x: GX, y: GY + (GW + 10) * GS, opacity: 0 });

        // a ring that moves between cells, and one for the dice strip
        const ring = K.ring(scene, { w: 100, h: 100, stroke: 4 });
        const ringAt = (b, t, dur = 0.35, pad = 4) => ring.around(tl, b, t, dur, pad);
        const ring2 = K.ring(scene, { w: 100, h: 100 });

        // ---- the right of the desk: a d10, the paper strip, the phone (shared)
        const d = AG.desk(scene, S);
        const die = K.die(scene, { x: 965, y: 30, size: 130, face: 3 });
        // d10 faces shared across a row by its tallies (the grid lesson rolls
        // one d10 for every row; the rounding is the booklet's)
        const d10 = (r) => {
          const opts = K.rowOptions(bg, r);
          const total = opts.reduce((s, o) => s + o.count, 0);
          let cum = 0, from = 0;
          return opts.map((o) => {
            cum += o.count;
            const to = Math.min(Math.max(Math.round((cum * 10) / total), 1), 10) - 1;
            const b = { word: o.word, count: o.count, from, to };
            from = to + 1;
            return b;
          });
        };
        const faceFor = (r, word, k = 0) => { const b = d10(r).find((b) => b.word === word); return Math.min(b.to, b.from + k); };

        // the dice strip for the row for "dog": full stop 0-4, runs 5-9
        const DOG = V("dog"), STOP = V(".");
        const dogBands = d10(DOG);
        const strip = K.strip(scene, dogBands, { x: 1120, y: 24, face: 64, labelSize: 40 });
        K.set(strip.el, { opacity: 0 });
        // the full stop's label is a symbol tile, as on the printed booklet
        const stopBand = dogBands.findIndex((b) => b.word === ".");
        const lab = strip.labels[stopBand];
        lab.setAttribute("visibility", "hidden");
        const labTile = K.punctBox(strip.svg, ".", { x: +lab.getAttribute("x"), y: 20 + 40 - 13, size: 40, colour: K.tokenColour(".") });
        K.set(labTile, { opacity: 0 });
        const labCentre = { x: 1120 + +lab.getAttribute("x"), y: 24 + 47 };
        const shadeBand = (i, t) => {
          const b = dogBands[i];
          tl.set(strip.blocks[i], { opacity: 1 }, t);
          tl.fromTo(strip.blocks[i], { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1 }, t, { dur: 0.5, ease: "out-cubic" });
          tl.to(i === stopBand ? labTile : strip.labels[i], { opacity: 1 }, t + 0.15, { dur: 0.3 });
          tl.to(strip.nums.slice(b.from, b.to + 1), { fill: "#ffffff" }, t + 0.25, { dur: 0.3 });
        };

        // ============================================================ line 0 (TC)
        // the desk, held; then "the loop you've already run": ". here comes
        // the dog", each word found in its row
        AG.fadeIn(tl, [grid.el, die.el, d.note.el, d.pen], 0.2, { stagger: 0.12 });
        const tRun = T.word(0, "It's");
        AG.write(tl, d, 0, 0, tRun);
        const steps = [["." , "here"], ["here", "comes"], ["comes", "the"], ["the", "dog"]];
        steps.forEach(([a, b], k) => {
          const t = tRun + 0.55 + k * 0.72, r = V(a), c = V(b);
          tl.to(grid.rowBands[r], { opacity: 1 }, t, { dur: 0.2 });
          if (k === 0) { tl.set(ring.el, { x: cellBox(r, c).x - 4, y: cellBox(r, c).y - 4, scaleX: (cellBox(r, c).w + 8) / 100, scaleY: (cellBox(r, c).h + 8) / 100 }, t); tl.to(ring.el, { opacity: 1 }, t + 0.1, { dur: 0.2 }); }
          else ringAt(cellBox(r, c), t + 0.05, 0.3);
          if (d10(r).length > 1) K.land(tl, die, faceFor(r, b), t);
          AG.write(tl, d, 0, k + 1, t + 0.35);
          tl.to(grid.rowBands[r], { opacity: 0 }, t + 0.6, { dur: 0.2 });
        });
        tl.to(ring.el, { opacity: 0 }, tRun + 0.55 + 4 * 0.72, { dur: 0.3 });

        // ============================================================ line 1
        // "the moment you roll a punctuation mark": the punctuation columns
        // light, top to bottom; "full stop", "comma" name theirs; "tool call"
        const tPunct = T.word(1, "punctuation");
        [STOP, V(","), V("!")].forEach((c, i) => {
          tl.set(grid.colBands[c], { opacity: 1 }, tPunct);
          tl.fromTo(grid.colBands[c], { scaleY: 0, transformOrigin: "50% 0" }, { scaleY: 1 }, tPunct + i * 0.18, { dur: 0.9, ease: "in-out-quad" });
        });
        const pulse = (els, t) => tl.to(els, { scale: 1.35, transformOrigin: "50% 50%" }, t, { dur: 0.3, yoyo: true, ease: "out-cubic" });
        pulse(grid.colHead[STOP], T.word(1, "full"));
        pulse(grid.colHead[V(",")], T.word(1, "comma"));
        pulse(PUNCT.map((c) => grid.colHead[c]), T.word(1, "tool"));

        // ============================================================ line 2
        // "It rolls one, like any other word": the punctuation tallies light
        // among all the others. "Some rows almost never call it. Some always
        // do.": each row lights by its share of punctuation.
        const tRolls = T.word(2, "rolls");
        const punctFills = bg.vocab.flatMap((_, r) => PUNCT.map((c) => fills[r][c]).filter(Boolean));
        const otherFills = fills.flat().filter((f) => f && !punctFills.includes(f));
        tl.to(PUNCT.map((c) => grid.colBands[c]), { opacity: 0 }, tRolls - 0.2, { dur: 0.4 });
        tl.to(punctFills, { opacity: 0.85 }, tRolls, { dur: 0.35 });
        const tLike = T.word(2, "like");
        tl.to(otherFills, { opacity: 0.4 }, tLike, { dur: 0.35 });
        tl.to(otherFills, { opacity: 0 }, T.word(2, "word") + 0.6, { dur: 0.4 });
        const tRows = T.word(2, "rows");
        tl.to(punctFills, { opacity: 0 }, tRows, { dur: 0.4 });
        bg.vocab.forEach((_, r) => {
          if (share[r]) tl.to(grid.rowBands[r], { opacity: share[r] }, tRows + 0.1 + r * 0.04, { dur: 0.3 });
          else tl.to(mutes[r], { opacity: 0.6 }, T.word(2, "never"), { dur: 0.4 });
        });
        const always = bg.vocab.map((_, r) => r).filter((r) => share[r] === 1);
        tl.to(always.map((r) => outlines[r]), { opacity: 1 }, T.word(2, "always"), { dur: 0.25, stagger: 0.08 });
        const t3 = T.start(3);
        tl.to([...grid.rowBands, ...outlines, ...mutes], { opacity: 0 }, t3 - 0.3, { dur: 0.4 });

        // ============================================================ line 3
        // "Say you've written 'here comes the dog'. The row for 'dog': nought
        // to four is a full stop, five to nine is 'runs'. Roll a three. Full
        // stop. Stop."
        AG.ringWords(tl, d, 0, 1, 4, T.word(3, "written"), T.word(3, "row") - 0.2);
        const tRow = T.word(3, "row");
        tl.to(grid.rowBands[DOG], { opacity: 1 }, tRow, { dur: 0.3 });
        tl.to(mutes.filter((_, r) => r !== DOG), { opacity: 0.45 }, tRow, { dur: 0.4 });
        K.appear(tl, strip.el, tRow + 0.1, { y: 16 });
        const tNought = T.word(3, "nought");
        shadeBand(stopBand, tNought);
        tl.set(ring.el, { x: cellBox(DOG, STOP).x - 4, y: cellBox(DOG, STOP).y - 4, scaleX: (cellBox(DOG, STOP).w + 8) / 100, scaleY: (cellBox(DOG, STOP).h + 8) / 100 }, tNought);
        tl.to(ring.el, { opacity: 1 }, tNought, { dur: 0.25 });
        const tFive = T.word(3, "five");
        shadeBand(1 - stopBand, tFive);
        ringAt(cellBox(DOG, V("runs")), tFive, 0.35);
        // the roll lands on 3, in the full stop's band
        const tThree = T.word(3, "three");
        K.land(tl, die, 3, tThree - 0.2);
        const f3 = strip.faceAt(3);
        tl.set(ring2.el, { x: f3.x - 38, y: f3.y - 38, scaleX: 0.76, scaleY: 0.76 }, tThree);
        tl.to(ring2.el, { opacity: 1 }, tThree + 0.1, { dur: 0.2 });
        strip.light(tl, 3, tThree + 0.1);
        const tFull = T.word(3, "full", 2);
        ringAt(cellBox(DOG, STOP), tFull - 0.1, 0.35);
        tl.to(ring2.el, { opacity: 0 }, tFull + 0.2, { dur: 0.3 });
        // the full stop lifts out of the strip; "Stop.": it waits on the paper,
        // the pencil lifts, and the phone slides in over the strip
        const tStop = T.word(3, "stop", 3);
        AG.pending(tl, d, labCentre, tFull, tStop - 0.2);
        K.vanish(tl, strip.el, tStop - 0.15, { y: -16 });
        AG.phoneIn(tl, d, tStop + 0.3);
        tl.to([ring.el, grid.rowBands[DOG], ...mutes], { opacity: 0 }, T.end(3) + 0.2, { dur: 0.4 });

        // ============================================================ line 4
        AG.toolCall(tl, T, d, 4);

        // ============================================================ line 5
        // the reply written whole, then the full stop; carry on from the full
        // stop: its row lights, a face lands, the pencil moves again
        const { tFrom } = AG.splice(tl, T, d, 5, "rolled");
        tl.to(grid.rowBands[STOP], { opacity: 1 }, tFrom + 0.3, { dur: 0.3 });
        const tIt = T.word(5, "stop", 2);
        K.land(tl, die, faceFor(STOP, "it", 1), tIt - 0.35);
        tl.set(ring.el, { x: cellBox(STOP, V("it")).x - 4, y: cellBox(STOP, V("it")).y - 4, scaleX: (cellBox(STOP, V("it")).w + 8) / 100, scaleY: (cellBox(STOP, V("it")).h + 8) / 100 }, tIt - 0.1);
        tl.to(ring.el, { opacity: 1 }, tIt - 0.1, { dur: 0.2 });
        AG.writeAfterStop(tl, d, tIt + 0.2);
        tl.to([ring.el, grid.rowBands[STOP]], { opacity: 0 }, T.start(6) + 0.2, { dur: 0.35 });

        // ============================================================ line 6
        // "Why from the full stop, and not from 'sandwich'? Because your grid
        // has no row for 'sandwich'. But it always has one for a full stop."
        // The row headers are searched top to bottom; the row "sandwich"
        // would need isn't there. Then the full stop's row, present and lit.
        AG.ringWords(tl, d, 1, 5, 5, T.word(6, "sandwich") - 0.1, T.word(6, "But") - 0.2);
        const tSearch = T.word(6, "grid");
        const per = (T.word(6, "sandwich", 2) - 0.1 - tSearch) / N;
        bg.vocab.forEach((_, r) => {
          tl.to(grid.rowBands[r], { opacity: 1 }, tSearch + r * per, { dur: 0.05 });
          tl.to(grid.rowBands[r], { opacity: 0 }, tSearch + (r + 1) * per + 0.05, { dur: 0.1 });
        });
        const tEmpty = T.word(6, "sandwich", 2);
        tl.to(slotEl, { opacity: 1 }, tEmpty - 0.1, { dur: 0.2 });
        tl.to(slotEl, { opacity: 0.3 }, tEmpty + 0.5, { dur: 0.25 });
        tl.to(slotEl, { opacity: 1 }, tEmpty + 0.75, { dur: 0.25 });
        tl.to(slotEl, { opacity: 0 }, T.word(6, "But"), { dur: 0.3 });
        const tHas = T.word(6, "one");
        tl.to(grid.rowBands[STOP], { opacity: 1 }, tHas, { dur: 0.3 });
        tl.set(ring.el, { x: headBox(STOP).x, y: headBox(STOP).y, scaleX: headBox(STOP).w / 100, scaleY: headBox(STOP).h / 100 }, tHas);
        tl.to(ring.el, { opacity: 1 }, T.word(6, "full", 2), { dur: 0.25 });
        tl.to([ring.el, grid.rowBands[STOP]], { opacity: 0 }, T.start(7), { dur: 0.35 });

        // ============================================================ line 7
        AG.backfill(tl, T, d, 7);

        // ============================================================ line 8
        // the desk's right side clears for the loop; the grid stays, the model
        const t8 = T.start(8);
        K.vanish(tl, [die.el, d.note.el, d.pen, d.phone.el], t8 - 0.1, { dur: 0.4 });
        const loop = AG.harnessLoop(scene, { x: 950, y: 20, w: 920, h: 850, labels: ["roll", "punctuation", "pause", "message out", "reply in", "carry on"] });
        AG.drawLoop(tl, loop, t8 + 0.4, 1.8);
        // "never learned what comes next after 'the dog'": the row for "dog"
        // holds a full stop and "runs", and nothing else
        const tAfter = T.word(8, "after");
        tl.to(grid.rowBands[DOG], { opacity: 1 }, tAfter, { dur: 0.3 });
        tl.to(mutes.filter((_, r) => r !== DOG), { opacity: 0.5 }, tAfter, { dur: 0.4 });
        tl.to([fills[DOG][STOP], fills[DOG][V("runs")]], { opacity: 0.8 }, T.word(8, "dog") + 0.1, { dur: 0.3 });
        const tAsk = AG.harness(tl, T, loop, 8, "rolled");
        tl.to(fills[DOG][V("runs")], { opacity: 0 }, tAsk, { dur: 0.3 });
        tl.to([grid.rowBands[DOG], fills[DOG][STOP], ...mutes], { opacity: 0 }, T.word(8, "thing"), { dur: 0.5 });

        // ============================================================ line 9
        // take the person out: the loop runs on its own
        const t10 = T.start(10);
        AG.takeOut(tl, T, loop, 9, t10 - 0.6);

        // ============================================================ line 10 (TC)
        // back to the desk as it opened: the grid, the die and a fresh strip
        K.vanish(tl, loop.el, t10 - 0.5, { dur: 0.4 });
        tl.set([...d.note.lines.flatMap((l) => l.words)], { opacity: 0 }, t10 - 0.1);
        tl.set(d.pen, d.tip(0, 0, false), t10 - 0.1);
        tl.to([die.el, d.note.el, d.pen], { opacity: 1 }, t10, { dur: 0.6, stagger: 0.1 });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["agentic-ai-grid"] = tl;
      });
    </script>
  </body>
</html>
