<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Same algorithm</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script src="parts/generated/same-booklet.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      .bar-word { font-family: var(--font-tok); font-weight: 700; white-space: nowrap; line-height: 1; }
      .bar-num { font-family: var(--font-ui); font-weight: 600; white-space: nowrap; line-height: 1; }
      .frac { font-family: var(--font-ui); font-weight: 600; color: var(--gold-2); font-size: 38px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <!-- Same algorithm (beyond): ops/video/beyond/scripts/same-algorithm.md.
         The magpie in every body a room can hold it in: four kits on the desk,
         the row for "the" morphing through tallies, ledger marks, counters,
         slips and numbers (parts/morph.js), those numbers as shares of one
         bar, then one walk ". it sits on the dog ." drawn with the cup, the
         die and the slips in turn. The booklet quarter is the magpie's own
         booklet (parts/build-same-booklet.py). Every beat lands on a word of
         the voice track. -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="same-algorithm"
         data-start="0" data-duration="113.81" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="113.81" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="113.81" data-track-index="1"></audio>
    </div>
    <script type="module">
      import { row, morph, jump, slip, slipsFromMarks } from "./parts/morph.js";
      import * as C from "./kit/motion/canvas.js";
      import { ease } from "./kit/motion/motion.js";

      const build = (tl, S, T) => {
        const K = KIT, D = KIT_DATA, MG = MAGPIE;
        const scene = document.getElementById("scene");
        const A = S.area;
        const PAL = D.palette; // red, blue, green, yellow: a row's followers in first-meet order
        const GOLD = "#e5a930";
        // a named ease as a function of p, for the canvas's zoom (the same curve the timeline uses)
        const easeAt = (name, p) => ease(name)(Math.max(0, Math.min(1, p)));
        // K.appear without its scale, for things that rest at a scale of their own
        const arrive = (els, t, { dy = 20, dur = 0.5, stagger = 0.06 } = {}) =>
          tl.fromTo(els, { opacity: 0, y: `+=${dy}` }, { opacity: 1, y: `-=${dy}` }, t, { dur, stagger, ease: "out-quart" });

        // the model's rows as the kit's ledger entries (lowercased, as MAGPIE is)
        const entry = (w) => ({ prefix: [w], followers: MG.rows[w].map(([text, count]) => ({ text, count })) });
        // a row's followers in grid column order (the vocab's first-use order)
        const gridOrder = (w) => [...MG.rows[w]].sort((a, b) => MG.vocab.indexOf(a[0]) - MG.vocab.indexOf(b[0]));
        // a strip of generated text must be a walk the model allows
        const checkWalk = (words) => words.slice(1).forEach((w, i) => {
          if (!MG.rows[words[i]]?.some(([n]) => n === w)) throw new Error(`"${words[i]} ${w}" is not in the magpie`);
        });
        // pencil words on a paper strip; punctuation as the kit's symbol tile
        const writtenStrip = (parent, words, { x, y, w, h = 110, size = 54 }) => {
          checkWalk(words);
          const L = K.layer(parent, x, y);
          const p = K.paper(L, { w, h });
          const line = K.pencilLine(p.el, words, { x: 30, y: (h - size) / 2, size });
          line.words.forEach((sp, i) => {
            if (!K.isPunct(words[i])) return;
            sp.textContent = "";
            sp.style.verticalAlign = "-0.12em";
            K.punctTile(sp, words[i]);
          });
          return { el: L, paper: p, words: line.words, x, y, w, h };
        };
        // where a written word's centre is, in the scene
        const wordAt = (strip, i) => {
          const sp = strip.words[i];
          return { x: strip.x + 30 + sp.offsetLeft + sp.offsetWidth / 2, y: strip.y + strip.h / 2 };
        };
        const writeAll = (strip, t) => strip.words.forEach((sp) => tl.set(sp, { opacity: 1, y: 0 }, t));

        // a flat top-down tub of counters (as generation-ledger draws it)
        const makeTub = (parent, { x = 0, y = 0, w = 260, h = 170 } = {}) => {
          const g = K.layer(parent, x, y);
          const s = K.svg("svg", { width: w, height: h, viewBox: `0 0 ${w} ${h}` }, g);
          K.svg("rect", { x: 6, y: 6, width: w - 12, height: h - 12, rx: 20, fill: "#efe6d8", stroke: "rgb(0 0 0 / 25%)", "stroke-width": 3 }, s);
          [["red", 0.24, 0.4], ["red", 0.38, 0.64], ["blue", 0.5, 0.36], ["blue", 0.6, 0.62], ["green", 0.72, 0.4], ["yellow", 0.82, 0.62]]
            .forEach(([c, fx, fy]) => K.svg("circle", { cx: fx * w, cy: fy * h, r: 15, fill: K.COUNTER[c], stroke: "rgb(0 0 0 / 30%)", "stroke-width": 2 }, s));
          return { el: g, w, h };
        };
        // a cup holding a row's counters, all in from the start
        const fullCup = (parent, w, { x, y, r = 140 }) => {
          const cup = K.cup(parent, { x, y, r });
          const total = MG.rows[w].reduce((s, [, n]) => s + n, 0);
          let i = 0;
          MG.rows[w].forEach(([, n], c) => { for (let k = 0; k < n; k++) K.set(cup.add(PAL[c].name, i++, total).el, { opacity: 1 }); });
          return cup;
        };

        // ================================================= the four kits
        // Each quarter is a layer, so the kits can slide away and come back.
        const QW = 880, QH = 360;
        const QPOS = { grid: [A.x, A.y], ledger: [A.x + 920, A.y], cutouts: [A.x, A.y + 410], booklet: [A.x + 920, A.y + 410] };
        const QOUT = { grid: [-1000, -120], ledger: [1000, -120], cutouts: [-1000, 120], booklet: [1000, 120] };
        const quarter = (k) => { const L = K.layer(scene, ...QPOS[k]); K.set(L, { opacity: 0 }); return L; };
        const qGrid = quarter("grid"), qLedger = quarter("ledger"), qCut = quarter("cutouts"), qBook = quarter("booklet");
        const QUARTERS = { grid: qGrid, ledger: qLedger, cutouts: qCut, booklet: qBook };

        // -- the grid and a d10: the magpie's whole grid, drawn large and scaled down
        const bg = K.bigrams(MG.words, MG.vocab);
        const G_SCALE = 0.22;
        const grid = K.grid(qGrid, bg, { x: 150, y: 6, cell: 60, head: 130 });
        K.set(grid.el, { scale: G_SCALE });
        const gridStrokes = grid.cells.flat().flatMap((c) => c.strokes);
        const qDie = K.die(qGrid, { x: 590, y: 120, size: 150, face: 7 });
        K.set(qDie.el, { opacity: 0 });

        // -- ledger sheets, the cup, the tub
        const LM = D.ledger["the-magpie"];
        const mkSheet = (idx) => {
          const s = LM.sheets[idx];
          const sh = K.sheet(qLedger, s.pages[0], PAL, { w: 1700, rowH: 120, header: [s.range[0].join(" "), s.range[1].join(" ")], title: LM.title });
          sh.rows.forEach((r) => r.cells.forEach((c) => K.drawOn(tl, c.strokes, 0, 0.01, 0)));
          return sh;
        };
        const fan = [[0, 20, 40, -8], [2, 170, 60, 3], [4, 320, 30, 10]].map(([idx, x, y, rot]) => {
          const sh = mkSheet(idx);
          K.set(sh.el, { x, y, scale: 0.2, rotation: rot, transformOrigin: "0 0", opacity: 0 });
          return sh;
        });
        // the fanned sheets lie over each other on purpose
        qLedger.querySelectorAll("text").forEach((t) => t.setAttribute("data-layout-allow-overlap", ""));
        const sheetThe = fan[2]; // "the → watches": its first row is the row for "the"
        if (LM.sheets[4].pages[0][0].prefix.join(" ") !== "the") throw new Error("sheet 5 doesn't start at the");
        const qCup = fullCup(qLedger, ".", { x: 0, y: 0, r: 140 });
        K.set(qCup.el, { x: 690, y: 20, scale: 0.52, opacity: 0 });
        const qTub = makeTub(qLedger);
        K.set(qTub.el, { x: 680, y: 220, scale: 0.6, opacity: 0 });

        // -- a spread of cutouts: the book's first pairs, scattered
        const spread = [];
        for (let i = 0; i < 30; i++) {
          const o = slip(qCut, MG.words[i], MG.words[i + 1], { size: 24 });
          const col = i % 5, rw = Math.floor(i / 5);
          const cx = 90 + col * 175 + (K.jitter(i * 3) - 0.5) * 40, cy = 34 + rw * 58 + (K.jitter(i * 5 + 1) - 0.5) * 12;
          K.set(o.el, { x: cx - o.w / 2, y: cy - o.h / 2, rotation: (K.jitter(i * 7 + 2) - 0.5) * 14, opacity: 0 });
          o.ring = K.el("div", { style: { position: "absolute", inset: "-5px", border: "4px solid var(--gold)", borderRadius: "6px" } }, o.el);
          K.set(o.ring, { opacity: 0 });
          o.prev = MG.words[i];
          spread.push(o);
        }

        // -- the magpie's booklet, open at pages 3 and 4
        const BK = SAME_BOOKLET.pages;
        const BK_H = 350, bkScale = BK_H / BK[2].h, BK_W = BK[2].w * bkScale;
        const bookletPage = (n, x) => {
          const frame = K.el("div", { class: "paper", style: { width: `${BK_W}px`, height: `${BK_H}px`, overflow: "hidden", borderRadius: "3px" } }, qBook);
          K.set(frame, { x, y: 5, opacity: 0 });
          K.el("img", { src: `parts/generated/same-booklet/pages/sheet-00${n}.png`, style: { position: "absolute", left: 0, top: 0, width: `${BK_W}px`, height: `${BK_H}px` } }, frame);
          return frame;
        };
        const bkLeft = bookletPage(3, QW / 2 - BK_W - 2), bkRight = bookletPage(4, QW / 2 + 2);
        const theLine = BK[3].lines.find((l) => l.words[0] === "the" && l.words.length > 1);
        const [bx0, by0, bx1, by1] = theLine.bbox.map((v) => v * bkScale);
        const bkRing = K.el("div", { style: { position: "absolute", left: 0, top: 0, width: `${bx1 - bx0 + 12}px`, height: `${by1 - by0 + 10}px`, border: "3px solid var(--gold)", borderRadius: "4px" } }, bkRight);
        K.set(bkRing, { x: bx0 - 6, y: by0 - 5, opacity: 0 });

        // -- the book itself, for "the same model"
        const book = K.bookPage(scene, ["The magpie is back.", "It sits on the fence."], { x: A.cx - 230, y: A.cy - 70, w: 460, h: 140, size: 36, pad: 28 });
        K.set(book.el, { opacity: 0 });
        book.lines.forEach((l) => l.setAttribute("data-layout-allow-overlap", "")); // it lies over the kits' inner corners

        // ============================================================ line 0
        // the kits arrive one per sentence; then the book behind them all
        tl.to(qGrid, { opacity: 1 }, T.word(0, "grid") - 0.2, { dur: 0.01 });
        arrive(grid.el, T.word(0, "grid") - 0.2);
        K.drawOn(tl, gridStrokes, T.word(0, "grid") + 0.2, 0.15, 0.005);
        K.land(tl, qDie, 7, T.word(0, "die"));

        tl.to(qLedger, { opacity: 1 }, T.word(0, "sheets") - 0.2, { dur: 0.01 });
        tl.fromTo(fan.map((s) => s.el), { opacity: 0, y: "+=30" }, { opacity: 1, y: "-=30" }, T.word(0, "sheets") - 0.2, { dur: 0.5, stagger: 0.12, ease: "out-quart" });
        arrive([qCup.el, qTub.el], T.word(0, "cup"), { stagger: 0.25 });

        tl.to(qCut, { opacity: 1 }, T.word(0, "pile") - 0.2, { dur: 0.01 });
        spread.forEach((o, i) => tl.fromTo(o.el, { opacity: 0, y: `-=40` }, { opacity: 1, y: `+=40` }, T.word(0, "pile") - 0.2 + K.jitter(i * 11) * 0.9, { dur: 0.4, ease: "out-cubic" }));

        tl.to(qBook, { opacity: 1 }, T.word(0, "booklet") - 0.3, { dur: 0.01 });
        K.appear(tl, [bkLeft, bkRight], T.word(0, "booklet") - 0.3, { stagger: 0.1 });

        // "They're all running the same model": the book, then the same row lit in every kit
        const tBook = T.word(0, "They're");
        // the kits step outward and dim to give the book the middle of the desk
        const QAWAY = { grid: [-50, -35], ledger: [50, -35], cutouts: [-60, 45], booklet: [60, 45] };
        Object.entries(QUARTERS).forEach(([k, L]) =>
          tl.to(L, { x: QPOS[k][0] + QAWAY[k][0], y: QPOS[k][1] + QAWAY[k][1], opacity: 0.45 }, tBook - 0.1, { dur: 0.5, ease: "in-out-cubic" }));
        K.appear(tl, book.el, tBook + 0.1, { y: 16 });
        const tSame = T.word(0, "same");
        tl.to(Object.values(QUARTERS), { opacity: 1 }, tSame - 0.1, { dur: 0.3 });
        const rThe = bg.idx.get("the");
        tl.to(grid.rowBands[rThe], { opacity: 1 }, tSame, { dur: 0.3 });
        tl.to(sheetThe.rows[0].lit, { opacity: 1 }, tSame + 0.1, { dur: 0.3 });
        // the slips for "the" lift off the table, ringed
        const theSlips = spread.filter((o) => o.prev === "the");
        tl.to(theSlips.map((o) => o.ring), { opacity: 1 }, tSame + 0.2, { dur: 0.3 });
        tl.to(theSlips.map((o) => o.el), { y: "-=8", scale: 1.12 }, tSame + 0.2, { dur: 0.3, ease: "out-cubic" });
        tl.to(bkRing, { opacity: 1 }, tSame + 0.3, { dur: 0.3 });

        // ============================================================ line 1
        // the row for "the" lifts out of the grid; the kits slide away
        const R = row(scene, "the", MG.rows.the, { x: 120, y: 110 });
        const tLift = T.word(1, "one") - 0.1;
        // a gold band lifts off the grid's row and grows into the big row
        const lift = K.el("div", { style: { position: "absolute", left: 0, top: 0, width: "100px", height: "100px", background: "var(--gold)", borderRadius: "4px", transformOrigin: "0 0" } }, scene);
        K.set(lift, { opacity: 0 });
        const gx = QPOS.grid[0] + 150, gy = QPOS.grid[1] + 6;
        const bandBox = { x: gx, y: gy + (grid.head + rThe * grid.cell) * G_SCALE, w: grid.width * G_SCALE, h: grid.cell * G_SCALE };
        tl.set(lift, { x: bandBox.x, y: bandBox.y, scaleX: bandBox.w / 100, scaleY: bandBox.h / 100 }, tLift - 0.01);
        tl.to(lift, { opacity: 0.6 }, tLift, { dur: 0.15 });
        tl.to(lift, { x: R.x, y: R.y, scaleX: R.W / 100, scaleY: R.geom.bot / 100 }, tLift + 0.15, { dur: 0.8, ease: "in-out-cubic" });
        tl.to(lift, { opacity: 0 }, tLift + 0.85, { dur: 0.4 });
        tl.fromTo(R.el, { opacity: 0 }, { opacity: 1 }, tLift + 0.6, { dur: 0.4 });
        R.drawMarks(tl, tLift + 0.6, 0.01, 0);
        tl.to(book.el, { opacity: 0 }, tLift, { dur: 0.3 });
        Object.entries(QUARTERS).forEach(([k, L]) =>
          tl.to(L, { x: QPOS[k][0] + QOUT[k][0], y: QPOS[k][1] + QOUT[k][1], opacity: 0 }, tLift + 0.1, { dur: 0.7, ease: "in-cubic" }));
        // the lit highlights go out while the kits are away, ready for their return
        tl.set([grid.rowBands[rThe], sheetThe.rows[0].lit, bkRing, ...spread.map((o) => o.ring)], { opacity: 0 }, tLift + 1);

        // "from a picture book called The magpie": the book comes back under the row
        const tPic = T.word(1, "picture");
        tl.set(book.el, { x: A.cx - 300, y: 520 }, tPic - 0.3);
        tl.to(book.el, { opacity: 1 }, tPic, { dur: 0.35 });
        tl.to(book.el, { opacity: 0 }, T.word(1, "grid") - 0.1, { dur: 0.35 });

        // "On a grid, it's tallies": the marks wink gold
        const tTally = T.word(1, "tallies");
        R.marks.forEach((m, c) => {
          tl.fromTo(m.paths, { stroke: "#1a1a1a" }, { stroke: GOLD }, tTally + c * 0.1, { dur: 0.2 });
          tl.to(m.paths, { stroke: "#1a1a1a" }, tTally + c * 0.1 + 0.6, { dur: 0.3 });
        });
        // "On a ledger": the grid becomes a ledger row; "coloured boxes": the colours
        morph(tl, R, { ledger: T.word(1, "ledger"), colour: T.word(1, "coloured") });

        // ============================================================ line 2
        morph(tl, R, { counters: T.word(2, "cup"), slips: T.word(2, "cutouts"), numbers: T.word(2, "four") });

        // ============================================================ line 3
        // the four numbers become four widths of one bar, where the row was
        const TOTAL = MG.rows.the.reduce((s, [, n]) => s + n, 0);
        const BX = R.x + R.geom.prefixW, BW = R.n * R.geom.slotW, BY = R.y + R.geom.top, BH = R.geom.rowH;
        const tBar = T.word(3, "chances");
        const segs = [];
        let acc = 0;
        MG.rows.the.forEach(([w, n], c) => {
          const x0 = BX + (acc / TOTAL) * BW, sw = (n / TOTAL) * BW;
          acc += n;
          const L = K.layer(scene, x0, BY);
          const seg = K.el("div", { style: { position: "absolute", left: "2px", top: 0, width: `${sw - 4}px`, height: `${BH}px`, background: PAL[c].hex, borderRadius: "6px" } }, L);
          const ink = PAL[c].name === "yellow" ? "#1a1a1a" : "#fff";
          const wd = K.el("div", { class: "bar-word", text: w, style: { position: "absolute", left: "20px", top: "22px", fontSize: "44px", color: ink } }, L);
          const nm = K.el("div", { class: "bar-num", text: String(n), style: { position: "absolute", left: "20px", top: "78px", fontSize: "52px", color: ink } }, L);
          K.set(L, { opacity: 0 });
          K.set(seg, { scaleX: 0.2, transformOrigin: "0 50%" });
          segs.push({ L, seg, wd, nm, x0, w: sw, c });
        });
        // the row gives way to the bar: each number rises into its share
        tl.to([R.svg], { opacity: 0 }, tBar - 0.1, { dur: 0.4 });
        segs.forEach((s, c) => {
          const N = R.numbers[c];
          const t = tBar + c * 0.12;
          tl.to(N.el, { x: s.x0 + 20 - R.x, y: BY + 78 - R.y - 40, scale: 0.4, opacity: 0 }, t, { dur: 0.55, ease: "in-out-cubic" });
          tl.to(s.L, { opacity: 1 }, t + 0.1, { dur: 0.2 });
          tl.to(s.seg, { scaleX: 1 }, t + 0.1, { dur: 0.5, ease: "out-cubic" });
        });
        // the whole bar is the row's nineteen: a bracket under it
        const brk = K.layer(scene, BX, BY + BH + 16);
        const brkSvg = K.svg("svg", { width: BW, height: 70, viewBox: `0 0 ${BW} 70`, style: "overflow: visible" }, brk);
        K.svg("path", { d: `M2 0 L2 14 L${BW - 2} 14 L${BW - 2} 0`, fill: "none", stroke: "var(--text-2)", "stroke-width": 3 }, brkSvg);
        K.svg("text", { x: BW / 2, y: 58, "text-anchor": "middle", "font-size": 38, class: "ui", "font-weight": 600, fill: "rgb(255 255 255 / 85%)", text: String(TOTAL) }, brkSvg);
        K.set(brk, { opacity: 0 });
        // a share lit: the others dim; a ghost of the fraction it's close to sits under it
        const ghost = (seg, frac, label) => {
          const L = K.layer(scene, seg.x0, BY + BH + 110);
          const w = BW * frac;
          K.el("div", { style: { position: "absolute", left: "2px", top: 0, width: `${w - 4}px`, height: "30px", border: "3px dashed var(--gold)", borderRadius: "6px" } }, L);
          K.el("div", { class: "frac", text: label, style: { position: "absolute", left: `${w + 18}px`, top: "-8px" } }, L);
          K.set(L, { opacity: 0 });
          return L;
        };
        const sFence = segs[1], sDog = segs[3];
        const gThird = ghost(sFence, 1 / 3, "⅓"), gFifth = ghost(sDog, 1 / 5, "⅕");
        const tFence = T.word(3, "fence");
        tl.to(segs.filter((s) => s !== sFence).map((s) => s.L), { opacity: 0.3 }, tFence, { dur: 0.35 });
        tl.to(sFence.L, { y: BY - 14 }, tFence, { dur: 0.35, ease: "out-cubic" });
        tl.to(brk, { opacity: 1 }, T.word(3, "nineteen"), { dur: 0.35 });
        tl.to(gThird, { opacity: 1 }, T.word(3, "third"), { dur: 0.35 });
        const tDog = T.word(3, "dog");
        tl.to([sFence.L, gThird], { opacity: 0.3 }, tDog, { dur: 0.35 });
        tl.to(sFence.L, { y: BY }, tDog, { dur: 0.35 });
        tl.to(sDog.L, { opacity: 1, y: BY - 14 }, tDog, { dur: 0.35, ease: "out-cubic" });
        tl.to(gThird, { opacity: 0 }, tDog, { dur: 0.3 });
        tl.to(gFifth, { opacity: 1 }, T.word(3, "fifth"), { dur: 0.35 });

        // ============================================================ line 4
        // the walk: a paper strip, the row for full stop, the cup
        const t4 = T.start(4) - 0.3;
        K.vanish(tl, [R.el, brk, gFifth, ...segs.map((s) => s.L)], t4, { dur: 0.4 });
        const WALK = [".", "it", "sits", "on", "the", "dog", "."];
        const strip = writtenStrip(scene, WALK, { x: A.cx - 560, y: 690, w: 1120, h: 124, size: 62 });
        K.set(strip.el, { opacity: 0 });
        K.appear(tl, strip.el, T.word(4, "sentence") - 0.2, { y: 30 });
        K.write(tl, strip.words[0], T.word(4, "sentence") + 0.4);

        // the row for full stop and the cup under it
        const LR_W = 1500, LR_H = 150, LR_X = A.cx - LR_W / 2, LR_Y = 90;
        const rowDot = K.ledgerRow(scene, entry("."), PAL, { x: LR_X, y: LR_Y, w: LR_W, h: LR_H, fontSize: 50, prefixW: 240 });
        K.set(rowDot.el, { opacity: 0 });
        const tFull = T.word(4, "full");
        tl.to(rowDot.el, { opacity: 1 }, tFull - 0.2, { dur: 0.35 });
        rowDot.cells.forEach((c, i) => K.drawOn(tl, c.strokes, tFull + 0.1 + i * 0.1, 0.25, 0.03));
        tl.fromTo(strip.words[0], { color: "#3a3a3a" }, { color: GOLD }, tFull, { dur: 0.3 });
        tl.to(strip.words[0], { color: "#3a3a3a" }, tFull + 1.2, { dur: 0.4 });

        tl.to(plate, { opacity: 1 }, tWhatever + 0.3, { dur: 0.3 });
        tl.to(Object.values(QUARTERS), { opacity: 0.4 }, tWhatever + 0.3, { dur: 0.6, stagger: 0.1 });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["same-algorithm"] = tl;
      });
