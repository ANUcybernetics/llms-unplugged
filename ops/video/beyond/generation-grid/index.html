<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Generation (grid), beyond the slides</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- Generation (grid), beyond the slides: ops/video/beyond/scripts/
         generation-grid.md. The magpie's whole grid writes ". it sits on the
         dog ." one roll at a time (rows lifted out of the grid, a d10 strip
         shared by the tallies, a pencil strip); then the tree of everything
         it could have written, and ten thousand words of its own writing
         counted back into a blank grid. Sibling of generation-ledger: the
         walk, the tree and the recount are the shared parts in ../_parts/. -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="generation-grid"
         data-start="0" data-duration="135.67" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="135.67" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="135.67" data-track-index="1"></audio>
    </div>
    <script type="module">
      import { WALK, tenFaces, wordTimes, paperLine, splice, walkStyle } from "./parts/generation-walk.js";
      import { magpieGrid, liftedRow, liftOut, gridStyle } from "./parts/generation-grid.js";
      import { tree, labels, walkWords, samplePaths, treeStyle, GOLD } from "./parts/tree.js";
      import * as CV from "./parts/converge.js";

      const build = (tl, S, T) => {
        const K = KIT, MG = MAGPIE;
        const scene = document.getElementById("scene");
        const A = S.area;
        const W = wordTimes(T);
        const w = W.word;
        treeStyle(), walkStyle(), gridStyle();

        // ---- the model: the magpie, lowercased, columns in first-use order
        const bg = K.bigrams(MG.words, MG.vocab);
        const IDX = (word) => bg.idx.get(word);
        const opts = (word) => K.rowOptions(bg, IDX(word));
        const cols = (word) => opts(word).map((o) => IDX(o.word));

        // ---- the desk: the grid full frame, later small at the top left
        const GRID_FULL = { x: 31, y: 17, scale: 1 };
        const GRID_SMALL = { x: 40, y: 36, scale: 0.42 };
        const grid = magpieGrid(scene, bg, { x: GRID_FULL.x, y: GRID_FULL.y });
        K.set(grid.cells.flat().flatMap((c) => c.strokes), { strokeDashoffset: 0 });
        K.set(grid.el, { opacity: 0 });
        // a paper-coloured veil over every row but the first, to single it out
        const veil = K.svg("rect", { x: 0, y: grid.headH + grid.cellH, width: grid.width, height: grid.height - grid.headH - grid.cellH, fill: "var(--paper)", opacity: 0 }, grid.svg);
        // gold boxes over single cells
        const cellLit = (r, c) => {
          const cl = grid.cells[r][c];
          return K.svg("rect", { x: cl.x + 2, y: cl.y + 2, width: cl.w - 4, height: cl.h - 4, rx: 4, fill: "none", stroke: "var(--gold)", "stroke-width": 3, opacity: 0 }, grid.svg);
        };

        // the lifted row's slot, the dice strip, the die, the paper
        const FR = { x: 880, y: 64 };
        const SX = 930, SY = 262;
        const lifted = {};
        for (const word of [".", "it", "sits", "on", "the", "dog"]) {
          const lr = liftedRow(scene, word, opts(word), { x: FR.x, y: FR.y });
          K.set(lr.all.map((b) => b.el), { opacity: 0 });
          lifted[word] = lr;
        }
        // the strip labels its bands in type; a punctuation band gets the
        // symbol tile instead, in the band's colour
        const punctLabels = (st) => st.bands.forEach((b, i) => {
          if (!K.isPunct(b.word)) return;
          const lab = st.labels[i];
          lab.setAttribute("display", "none");
          const x = +lab.getAttribute("x"), y = +lab.getAttribute("y");
          const g = K.punctBox(st.svg, b.word, { x, y: y - 15, size: 32, colour: K.tokenColour(b.word) });
          K.set(g, { opacity: 0 });
          st.labels[i] = g;
        });
        const strips = {};
        for (const word of [".", "it", "the", "dog"]) {
          const st = K.strip(scene, tenFaces(opts(word)), { x: SX, y: SY, face: 80 });
          K.set(st.el, { opacity: 0 });
          punctLabels(st);
          strips[word] = st;
        }
        const die = K.die(scene, { x: 1302, y: 478, size: 150 });
        K.set(die.el, { opacity: 0 });
        const PAPER = { x: 310, y: 684, scale: 1 };
        const paper = paperLine(scene, WALK.slice(1), { x: PAPER.x, y: PAPER.y, w: 1300, h: 116, size: 62 });
        K.set(paper.el, { opacity: 0 });

        // ---- helpers
        const lightFor = (els, t, hold = 1.0) => {
          tl.to(els, { opacity: 1 }, t, { dur: 0.2 });
          tl.to(els, { opacity: 0 }, t + hold, { dur: 0.35 });
        };
        const exitRow = (lr, t) => tl.to(lr.all.map((b) => b.el), { opacity: 0, y: "-=30" }, t, { dur: 0.35, ease: "in-cubic", stagger: 0.02 });
        // a strip's band grows in under its faces, the faces' numbers turn white
        const shadeBand = (st, i, t) => {
          const b = st.bands[i];
          tl.set(st.blocks[i], { opacity: 1 }, t);
          tl.fromTo(st.blocks[i], { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1 }, t, { dur: 0.45, ease: "out-cubic" });
          tl.to(st.labels[i], { opacity: 1 }, t + 0.1, { dur: 0.3 });
          tl.to(st.nums.slice(b.from, b.to + 1), { fill: "#ffffff" }, t + 0.2, { dur: 0.25 });
        };
        // (no yoyo: the engine's yoyo returns to an unresolved value)
        const pulse = (els, t, s = 1.15) => {
          tl.to(els, { scale: s, transformOrigin: "50% 50%" }, t, { dur: 0.22, ease: "out-quad" });
          tl.to(els, { scale: 1 }, t + 0.22, { dur: 0.25, ease: "in-out-quad" });
        };
        // the rolled face's number lifts (the kit's strip.light, without yoyo)
        const lightFace = (st, i, t) => pulse(st.nums[i], t, 1.4);
        // the row's band on the (small) grid lights as its row comes out
        const rowOn = (word, t) => tl.to(grid.rowBands[IDX(word)], { opacity: 1 }, t, { dur: 0.25 });
        const rowOff = (word, t) => tl.to(grid.rowBands[IDX(word)], { opacity: 0 }, t, { dur: 0.3 });
        const bandIndex = (word, next) => opts(word).findIndex((o) => o.word === next);

        // ============================================================ line 0
        // (TC) the finished grid, full frame, held still
        tl.to(grid.el, { opacity: 1 }, 0.1, { dur: 0.5 });

        // ============================================================ line 1
        // a row is a word; its tallies are what came next, and how often
        const rThe = IDX("the");
        tl.to(grid.rowHead, { fill: "#be830e" }, w(1, "row"), { dur: 0.25 });
        tl.to(grid.rowHead, { fill: "#1a1a1a" }, w(1, "row") + 0.9, { dur: 0.4 });
        tl.to(grid.rowBands[rThe], { opacity: 1 }, w(1, "word"), { dur: 0.3 });
        tl.to(veil, { opacity: 0.72 }, w(1, "word"), { dur: 0.4 });
        const theLit = cols("the").map((c) => cellLit(rThe, c));
        tl.to(theLit, { opacity: 1 }, w(1, "tallies"), { dur: 0.25, stagger: 0.1 });
        tl.to(cols("the").map((c) => grid.colHead[c]), { fill: "#be830e" }, w(1, "which"), { dur: 0.25, stagger: 0.1 });
        pulse(cols("the").map((c) => grid.cells[rThe][c].g), w(1, "how"), 1.3);
        const tSame = w(1, "same");
        tl.to([veil, grid.rowBands[rThe], ...theLit], { opacity: 0 }, tSame - 0.4, { dur: 0.5 });
        tl.to(cols("the").map((c) => grid.colHead[c]), { fill: "#1a1a1a" }, tSame - 0.4, { dur: 0.5 });

        // ============================================================ line 2
        // start at the row for full stop: it slides out, its boxes spread wide
        const tDotRow = w(2, "start") - 0.2;
        rowOn(".", tDotRow);
        const tShrink = w(2, "row") - 0.1;
        tl.to(grid.el, GRID_SMALL, tShrink, { dur: 0.8, ease: "in-out-cubic" });
        liftOut(tl, lifted["."], grid, IDX("."), cols("."), GRID_FULL, tShrink);
        [["it", "It"], ["here", "here"], ["down", "down"], ["swoop", "swoop"]].forEach(([next, said], i) => {
          const t = w(2, said);
          lightFor(lifted["."].boxes[i].lit, t, 0.8);
          pulse(lifted["."].boxes[i].el, t, 1.06);
        });

        // ============================================================ line 3
        // the ten faces shared across the row by its tallies
        const sDot = strips["."];
        K.appear(tl, sDot.el, w(3, "Share"), { y: 16 });
        const dotStrokes = lifted["."].boxes.flatMap((b) => b.strokes);
        tl.to(dotStrokes, { opacity: 0.25 }, w(3, "Seventeen"), { dur: 0.2, stagger: 0.04 });
        tl.to(dotStrokes, { opacity: 1 }, w(3, "Seventeen") + 0.2, { dur: 0.2, stagger: 0.04 });
        shadeBand(sDot, 0, w(3, "it"));
        lightFor(lifted["."].boxes[0].lit, w(3, "it"), 1.3);
        const tOthers = w(3, "others");
        [1, 2, 3].forEach((i) => {
          shadeBand(sDot, i, tOthers + (i - 1) * 0.2);
          lightFor(lifted["."].boxes[i].lit, tOthers + (i - 1) * 0.2, 0.5);
        });

        // ============================================================ line 4
        // roll a two: the band for "it"; write it; its row is next
        K.land(tl, die, 2, w(4, "Roll") + 0.2);
        lightFace(sDot, 2, w(4, "two"));
        pulse(sDot.blocks[0], w(4, "band"), 1.08);
        lightFor(lifted["."].boxes[0].lit, w(4, "band"), 1.2);
        K.appear(tl, paper.el, w(4, "band") + 0.3, { y: 20 });
        K.write(tl, paper.words[0], w(4, "it", 2));
        const tToIt = w(4, "row") - 0.3;
        exitRow(lifted["."], tToIt);
        K.vanish(tl, [sDot.el, die.el], tToIt);
        rowOff(".", tToIt);
        rowOn("it", tToIt + 0.1);
        liftOut(tl, lifted.it, grid, IDX("it"), cols("it"), GRID_SMALL, tToIt + 0.25);

        // ============================================================ line 5
        // ten tallies, a face each; roll a one: "sits"
        const sIt = strips.it, lrIt = lifted.it;
        K.appear(tl, sIt.el, w(5, "has") - 0.2, { y: 16 });
        pulse(lrIt.boxes.flatMap((b) => b.strokes), w(5, "ten"), 1.2);
        const tDrop = w(5, "every");
        let face = 0;
        lrIt.boxes.forEach((b) => {
          for (let k = 0; k < b.count; k++, face++) {
            const L = K.layer(scene, 0, 0);
            const sv = K.svg("svg", { width: 24, height: 52, viewBox: "0 0 24 52" }, L);
            const p = K.prepDraw([K.svg("path", { d: "M12 4 L12 48", class: "draw tally", style: "stroke-width: 3.5" }, sv)]);
            K.set(p, { strokeDashoffset: 0 });
            const from = { x: b.x + b.tallyAt(k).x - 12, y: b.y + b.tallyAt(k).y - 26 };
            const to = sIt.faceAt(face);
            const t = tDrop + face * 0.12;
            K.set(L, { ...from, opacity: 0 });
            tl.set(L, { opacity: 1 }, t);
            tl.set(b.strokes[k], { opacity: 0.15 }, t);
            tl.to(L, { x: to.x - 12, y: to.y - 26 }, t, { dur: 0.5, ease: "in-out-cubic" });
            tl.to(L, { opacity: 0 }, t + 0.75, { dur: 0.3 });
          }
        });
        // each word's band shades as its last tally lands
        let acc = 0;
        lrIt.boxes.forEach((b, i) => {
          acc += b.count;
          shadeBand(sIt, i, tDrop + (acc - 1) * 0.12 + 0.45);
        });
        K.land(tl, die, 1, w(5, "Roll") + 0.1);
        lightFace(sIt, 1, w(5, "sits") - 0.3);
        lightFor(lrIt.boxes[bandIndex("it", "sits")].lit, w(5, "sits") - 0.3, 1.2);
        K.write(tl, paper.words[1], w(5, "sits"));

        // ============================================================ line 6
        // one option, no roll
        const tSits = w(6, "Sits") - 0.3;
        exitRow(lrIt, tSits);
        K.vanish(tl, [sIt.el, die.el], tSits);
        rowOff("it", tSits);
        rowOn("sits", tSits + 0.1);
        liftOut(tl, lifted.sits, grid, IDX("sits"), cols("sits"), GRID_SMALL, tSits + 0.2, { dur: 0.6 });
        lightFor(lifted.sits.boxes[0].lit, w(6, "on") - 0.1, 0.9);
        K.write(tl, paper.words[2], w(6, "on"));
        const tOn = w(6, "on", 2) - 0.35;
        exitRow(lifted.sits, tOn);
        rowOff("sits", tOn);
        rowOn("on", tOn + 0.1);
        liftOut(tl, lifted.on, grid, IDX("on"), cols("on"), GRID_SMALL, tOn + 0.15, { dur: 0.55 });
        lightFor(lifted.on.boxes[0].lit, w(6, "the") - 0.1, 0.9);
        K.write(tl, paper.words[3], w(6, "the"));
        pulse(lifted.on.boxes[0].el, w(6, "One"), 1.06);

        // ============================================================ line 7
        // the row for "the", four ways: roll a nine, "dog"; the row for "dog",
        // five faces each: roll a three, full stop
        const tThe = T.start(7) - 0.1;
        exitRow(lifted.on, tThe);
        rowOff("on", tThe);
        rowOn("the", tThe + 0.1);
        liftOut(tl, lifted.the, grid, rThe, cols("the"), GRID_SMALL, tThe + 0.25);
        const sThe = strips.the, lrThe = lifted.the;
        K.appear(tl, sThe.el, w(7, "shares"), { y: 16 });
        [0, 1, 2, 3].forEach((i) => {
          shadeBand(sThe, i, w(7, "four") + i * 0.18);
          lightFor(lrThe.boxes[i].lit, w(7, "four") + i * 0.18, 0.45);
        });
        K.land(tl, die, 9, w(7, "Roll") + 0.15);
        lightFace(sThe, 9, w(7, "nine"));
        lightFor(lrThe.boxes[bandIndex("the", "dog")].lit, w(7, "nine") + 0.2, 1.2);
        K.write(tl, paper.words[4], w(7, "dog"));
        const tDog = w(7, "after") - 0.25;
        exitRow(lrThe, tDog);
        K.vanish(tl, [sThe.el, die.el], tDog);
        rowOff("the", tDog);
        rowOn("dog", tDog + 0.1);
        liftOut(tl, lifted.dog, grid, IDX("dog"), cols("dog"), GRID_SMALL, tDog + 0.2);
        const sDog = strips.dog, lrDog = lifted.dog;
        K.appear(tl, sDog.el, w(7, "after") + 0.5, { y: 16 });
        shadeBand(sDog, 0, w(7, "full"));
        lightFor(lrDog.boxes[0].lit, w(7, "full"), 0.6);
        shadeBand(sDog, 1, w(7, "runs"));
        lightFor(lrDog.boxes[1].lit, w(7, "runs"), 0.6);
        pulse(sDog.blocks, w(7, "five"), 1.06);
        K.land(tl, die, 3, w(7, "Roll", 2) + 0.15);
        lightFace(sDog, 3, w(7, "three"));
        lightFor(lrDog.boxes[0].lit, w(7, "three") + 0.2, 1.0);
        K.write(tl, paper.words[5], w(7, "full", 2));

        // ============================================================ line 8
        // the book never says it: two of its sentences, whose halves make it
        const t8 = T.start(8) - 0.5;
        exitRow(lrDog, t8);
        K.vanish(tl, [sDog.el, die.el, grid.el], t8);
        const PAPER_MID = { x: (1920 - 1300) / 2, y: 560, scale: 1 };
        tl.to(paper.el, { x: PAPER_MID.x, y: PAPER_MID.y }, t8 + 0.2, { dur: 0.8, ease: "in-out-cubic" });
        splice(tl, scene, { cx: 960, y: 300, size: 68, times: { show: w(8, "book") - 0.1, pieces: w(8, "sits", 2), join: w(8, "Nobody") } });
        const sp = scene.querySelectorAll(".splice-word");

        // ============================================================ line 9
        // everything the model could have written: the tree, the walk in gold
        const tCol = T.end(8) + 0.15;
        const box = { x0: 250, x1: A.x + A.w - 10, y0: A.y + 16, y1: A.y + A.h - 16 };
        const tGrow = [w(9, "here's"), w(10, "Every") - 0.7];
        const tWalk = w(10, "Every") - 0.35, STEP = 0.3;
        const tFade = w(10, "run") - 0.1;
        const others = samplePaths(MG.rows, { n: 3, seed: 11, avoid: WALK });
        const tOther = w(10, "different");
        const T3 = tree(tl, scene, {
          rows: MG.rows,
          box,
          grow: tGrow,
          dim: { t: tGrow[1] - 0.3, to: 0.35 },
          paths: [
            { words: WALK, colour: GOLD, t0: tWalk, step: STEP },
            ...others.map((p, i) => ({ words: p, colour: [255, 255, 255], width: 3.5, t0: tOther + i * 0.22, step: 0.07, out: tOther + i * 0.22 + 1.0 })),
          ],
          canvasBox: { x: 0, y: 0, w: S.W, h: S.H - S.captionH },
        });
        K.set(T3.el, { opacity: 0 });
        tl.set(T3.el, { opacity: 1 }, tGrow[0] - 0.05);
        const lab = labels(tl, scene, T3, { from: 1, to: 3 });
        tl.to([...lab.values()], { opacity: 0.25 }, tGrow[1] - 0.3, { dur: 0.8 });
        const from = [{ x: paper.centres(PAPER_MID)[0].x - 90, y: paper.centres(PAPER_MID)[0].y }, ...paper.centres(PAPER_MID)];
        tl.to([paper.el, ...sp], { opacity: 0 }, tCol, { dur: 0.4 });
        const ww = walkWords(tl, scene, T3, WALK, { from, colX: A.x + 40, labels: lab, times: { col: tCol, root: w(9, "And") - 0.1, walk: tWalk, step: STEP } });
        tl.to([T3.el, ...lab.values(), ...ww.all], { opacity: 0 }, tFade, { dur: 0.5 });

        // ============================================================ lines 10-11
        // run it ten thousand times and count what comes out
        // the recount samples each next word in exact proportion to the
        // counts (the model itself), not the d10's rounded bands: the claim
        // is that the counts come back, and the bands are only how one die
        // approximates them. Seed 37: its first twenty words give the row
        // for "the" three postie and nothing else.
        const sim = CV.simulate(MG.rows, { n: 10000, seed: 37 });
        const nAt = CV.schedule({ t0: w(10, "count") - 0.3, t1: w(11, "different"), short: 20, hold: w(11, "sounding") - 0.5, t2: w(11, "book") + 0.2, long: 10000 });
        const BG = { x: 40, y: 36, scale: 0.58 };
        const blank = magpieGrid(scene, bg, { x: BG.x, y: BG.y, tallies: false });
        K.set(blank.el, { scale: BG.scale, opacity: 0 });
        blank.el.setAttribute("data-layout-allow-occlusion", ""); // the recount's marks draw over it
        tl.to(blank.el, { opacity: 1 }, tFade + 0.3, { dur: 0.5 });
        const s = BG.scale;
        const cells = [];
        bg.vocab.forEach((a, r) => bg.vocab.forEach((b, c) => {
          const cl = blank.cells[r][c];
          cells.push({ a, b, x: cl.x * s, y: cl.y * s, w: cl.w * s, h: cl.h * s });
        }));
        const markC = CV.marks(tl, scene, sim, nAt, { x: BG.x, y: BG.y, w: blank.width * s, h: blank.height * s, cells, cap: 9, th: blank.cellH * s * 0.58, sp: 3.4, lw: 1.4, font: 11 });
        const streamC = CV.stream(tl, scene, sim, nAt, { x: 40, y: 600, w: 1840, h: 80, size: 40 });
        K.set([markC.el, streamC.el], { opacity: 0 });
        tl.set([markC.el, streamC.el], { opacity: 1 }, tFade + 0.3);
        const tShares = w(11, "Every") - 0.1;
        tl.to(blank.rowBands[rThe], { opacity: 1 }, tShares, { dur: 0.3 });
        const sharesC = CV.shares(tl, scene, sim, nAt, {
          x: 1190, y: 120, w: 680, h: 380, row: "the",
          followers: opts("the").map((o) => ({ word: o.word, count: o.count, colour: K.tokenColour(o.word) })),
          labels: (t, k) => ["the row for “the” in the book", `in ${Math.floor(k).toLocaleString("en-AU")} words it wrote`],
        });
        K.set(sharesC.el, { opacity: 0 });
        tl.to(sharesC.el, { opacity: 1 }, tShares, { dur: 0.4 });

        // ============================================================ line 12
        // on your grid: start anywhere with a row; faces, roll, write; no row?
        // pick again. The grid is one the room could fill: the book's last line.
        const t12 = T.start(12) - 0.5;
        tl.to([blank.el, markC.el, streamC.el, sharesC.el], { opacity: 0 }, t12, { dur: 0.4 });
        const endToks = K.split("it is spring , and the magpie is back .");
        const ebg = K.bigrams(endToks);
        const EI = (word) => ebg.idx.get(word);
        const eg = magpieGrid(scene, ebg, { x: 60, y: 60, cellW: 86, cellH: 62, headW: 124, headH: 56, font: 30, sp: 9, th: 32 });
        K.set(eg.cells.flat().flatMap((c) => c.strokes), { strokeDashoffset: 0 });
        K.set(eg.el, { opacity: 0 });
        const eStrip = K.strip(scene, tenFaces(K.rowOptions(ebg, EI("is"))), { x: 990, y: 70, face: 80 });
        K.set(eStrip.el, { opacity: 0 });
        const eDie = K.die(scene, { x: 1362, y: 300, size: 150 });
        K.set(eDie.el, { opacity: 0 });
        const ePaper = paperLine(scene, ["is", "back", ".", "the", "magpie"], { x: 990, y: 520, w: 894, h: 116, size: 60 });
        K.set(ePaper.el, { opacity: 0 });
        K.appear(tl, [eg.el, ePaper.el], t12 + 0.3, { y: 16, stagger: 0.15 });
        const eRow = (word, t, hold) => {
          tl.to(eg.rowBands[EI(word)], { opacity: 1 }, t, { dur: 0.25 });
          if (hold) tl.to(eg.rowBands[EI(word)], { opacity: 0 }, t + hold, { dur: 0.3 });
        };
        eRow("is", w(12, "row") - 0.2, w(12, "find") - w(12, "row"));
        K.write(tl, ePaper.words[0], w(12, "it", 1));
        K.appear(tl, eStrip.el, w(12, "Share"), { y: 16 });
        shadeBand(eStrip, 0, w(12, "across"));
        shadeBand(eStrip, 1, w(12, "across") + 0.35);
        K.land(tl, eDie, 7, w(12, "roll") + 0.05);
        lightFace(eStrip, 7, w(12, "roll") + 0.5);
        K.write(tl, ePaper.words[1], w(12, "down", 2));
        K.vanish(tl, [eStrip.el, eDie.el], w(12, "find"));
        eRow("back", w(12, "find") + 0.1, w(12, "No") - w(12, "find") - 0.2);
        K.write(tl, ePaper.words[2], w(12, "row", 3));
        eRow(".", w(12, "No"), w(12, "Pick", 2) - w(12, "No") + 0.1);
        pulse(eg.rowHead[EI(".")], w(12, "row", 4), 1.3);
        eRow("the", w(12, "Pick", 2) + 0.3, 1.2);
        K.write(tl, ePaper.words[3], w(12, "new"));
        K.write(tl, ePaper.words[4], w(12, "carry"));

        // ============================================================ line 13
        // (TC) pick a starting word and roll
        K.land(tl, eDie, 4, w(13, "roll"));
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["generation-grid"] = tl;
      });
    </script>
