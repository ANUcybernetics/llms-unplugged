<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Agentic AI (ledger)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- Agentic AI (ledger): ops/video/beyond/scripts/agentic-ai-ledger.md,
         the sibling of agentic-ai-grid on The magpie's real ledger sheets
         (the CLI's, from KIT_DATA) and the cup. The desk: five sheets, the cup,
         the paper strip, a phone that slides in when the tool is called. The
         harness beats (phone, splice, back-fill, the loop) are shared in
         parts/agentic.js. Every beat lands on a word of the voice track. -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="agentic-ai-ledger"
         data-start="0" data-duration="130.59" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="130.59" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="130.59" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as AG from "./parts/agentic.js";
      const build = (tl, S, T) => {
        const K = KIT, D = KIT_DATA;
        const scene = document.getElementById("scene");
        const PAL = D.palette; // red, blue, green, yellow: the ledger's column order
        const LG = D.ledger["the-magpie"];
        // ---- the model: the magpie's five ledger sheets, drawn at print
        // proportions and scaled down; layout A spreads them 3 + 2 across the
        // top of the desk
        const SW = 1700, RH = 120, HEADH = 90, PAD = 24, SS = 0.36;
        const sheets = LG.sheets.map((s) => {
          const sh = K.sheet(scene, s.pages[0], PAL, { w: SW, rowH: RH, header: [s.range[0].join(" "), s.range[1].join(" ")], title: LG.title });
          sh.rows.forEach((r) => (r.prefixEl.style.fill = "#1a1a1a"));
          K.set(sh.el, { opacity: 0 });
          // every mark is already on the sheet: these are finished sheets
          K.set(sh.rows.flatMap((r) => r.cells.flatMap((c) => c.strokes)), { strokeDashoffset: 0 });
          return sh;
        });
        const A_POS = [{ x: 30, y: 10 }, { x: 654, y: 10 }, { x: 1278, y: 10 }, { x: 342, y: 290 }, { x: 966, y: 290 }];
        const placeSheets = (t) => sheets.forEach((sh, i) => (t === null ? K.set(sh.el, { ...A_POS[i], scale: SS }) : tl.set(sh.el, { ...A_POS[i], scale: SS }, t)));
        placeSheets(null);
        const rowY = (i) => HEADH + PAD + i * RH;
        // every row, with where it sits, and each row's share of punctuation
        const rows = sheets.flatMap((sh, s) => sh.rows.map((r, i) => {
          const tot = r.entry.followers.reduce((n, f) => n + f.count, 0);
          const p = r.entry.followers.filter((f) => K.isPunct(f.text)).reduce((n, f) => n + f.count, 0);
          return { sh, s, i, r, word: r.entry.prefix.join(" "), share: p / tot };
        }));
        const find = (w) => rows.find((x) => x.word === w);
        const colOf = (row, w) => row.r.entry.followers.findIndex((f) => f.text === w);
        // rows light stronger than the kit default; a mute (over the row) and an outline, per row
        for (const x of rows) x.r.lit.setAttribute("fill-opacity", "0.45");
        for (const x of rows) {
          x.mute = K.svg("rect", { x: 0, y: rowY(x.i), width: SW, height: RH, fill: "var(--paper)" }, x.sh.svg);
          x.outline = K.svg("rect", { x: 5, y: rowY(x.i) + 5, width: SW - 10, height: RH - 10, fill: "none", stroke: "var(--gold)", "stroke-width": 9 }, x.sh.svg);
          K.set([x.mute, x.outline], { opacity: 0 });
        }
        const punctCells = rows.flatMap((x) => x.r.cells.filter((c) => c.follower && K.isPunct(c.follower.text)));
        const allCells = rows.flatMap((x) => x.r.cells.filter((c) => c.follower));
        // ---- the right of the desk (shared), and the cup
        const d = AG.desk(scene, S);
        const CUP_R = 140;
        const cup = K.cup(scene, { r: CUP_R });
        const CUP_A = { x: 130, y: 580, scale: 0.8 }, CUP_B = { x: 150, y: 215, scale: 1 };
        K.set(cup.el, CUP_A);
        K.set(cup.svg, { transformOrigin: "50% 50%" });
        const cupCentre = (P) => ({ x: P.x + (cup.D / 2) * P.scale, y: P.y + (cup.D / 2) * P.scale });

        // ---- focus rows: one row drawn large, lifted off its sheet
        const FX = 60, FY = 30, FW = 1320, FH = 140;
        const focus = (w) => {
          const x = find(w);
          const r = K.ledgerRow(scene, x.r.entry, PAL, { x: FX, y: FY, w: FW, h: FH, fontSize: 52, prefixW: 260 });
          r.prefixEl.style.fill = "#1a1a1a";
          K.set(r.cells.flatMap((c) => c.strokes), { strokeDashoffset: 0 });
          K.set(r.el, { opacity: 0 });
          return r;
        };
        const fDog = focus("dog"), fStop = focus(".");
        // a follower's word centre on a focus row, in scene coordinates
        const wordAt = (row, c) => ({ x: FX + row.cells[c].x + 18 + (52 * 1.15) / 2, y: FY + FH / 2 });
        // fill the cup with a row's counters (hidden until t), over dur
        const fill = (entry, t, dur) => {
          const total = entry.followers.reduce((n, f) => n + f.count, 0);
          const out = [];
          let k = 0;
          entry.followers.forEach((f, c) => {
            for (let j = 0; j < f.count; j++, k++) {
              const it = cup.add(PAL[c].name, k, total);
              tl.fromTo(it.el, { opacity: 0, y: it.y - 40 }, { opacity: 1, y: it.y }, t + (k * dur) / total, { dur: 0.25, ease: "out-cubic" });
              out.push({ ...it, colour: PAL[c].name });
            }
          });
          return out;
        };
        // one counter comes out of the cup: it lifts from its slot to beside the cup
        const drawOut = (it, P, t, to) => {
          const cr = cup.cr * P.scale;
          const c = K.counter(scene, it.colour, { r: cr });
          const from = { x: P.x + it.x * P.scale - cr - 4, y: P.y + it.y * P.scale - cr - 4 };
          K.set(c.el, { ...from, opacity: 0 });
          tl.set(it.el, { opacity: 0 }, t);
          tl.set(c.el, { opacity: 1 }, t);
          K.raise(tl, c.el, t);
          tl.to(c.el, { x: to.x - cr - 4, y: to.y - cr - 4, scale: 1.3 }, t, { dur: 0.6, ease: "out-cubic" });
          return c;
        };

        // ============================================================ line 0 (TC)
        // the desk, held; then "the loop you've already run": ". here comes
        // the dog", each word found on its row
        AG.fadeIn(tl, [...sheets.map((s) => s.el), cup.el, d.note.el, d.pen], 0.2, { stagger: 0.1 });
        const tRun = T.word(0, "It's");
        AG.write(tl, d, 0, 0, tRun);
        [[".", "Here"], ["Here", "comes"], ["comes", "the"], ["the", "dog"]].forEach(([a, b], k) => {
          const t = tRun + 0.55 + k * 0.72, x = find(a), cell = x.r.cells[colOf(x, b)];
          tl.to(x.r.lit, { opacity: 1 }, t, { dur: 0.2 });
          tl.to(cell.lit, { opacity: 1, fillOpacity: 0.7 }, t + 0.1, { dur: 0.2 });
          AG.write(tl, d, 0, k + 1, t + 0.35);
          tl.to([x.r.lit, cell.lit], { opacity: 0 }, t + 0.6, { dur: 0.2 });
          tl.set(cell.lit, { fillOpacity: 0.3 }, t + 0.85);
        });

        // ============================================================ line 1
        // "the moment you draw a punctuation mark": every box holding one
        // lights, sheet by sheet; "full stop", "comma" name theirs
        const tPunct = T.word(1, "punctuation");
        sheets.forEach((sh, s) => {
          const cells = rows.filter((x) => x.s === s).flatMap((x) => x.r.cells.filter((c) => punctCells.includes(c)));
          tl.to(cells.map((c) => c.lit), { opacity: 1 }, tPunct + s * 0.3, { dur: 0.3 });
        });
        const markCells = (m) => punctCells.filter((c) => c.follower.text === m).map((c) => c.lit);
        const flash = (els, t) => {
          tl.to(els, { fillOpacity: 0.75 }, t, { dur: 0.2 });
          tl.to(els, { fillOpacity: 0.3 }, t + 0.5, { dur: 0.35 });
        };
        flash(markCells("."), T.word(1, "full"));
        flash(markCells(","), T.word(1, "comma"));
        flash(punctCells.map((c) => c.lit), T.word(1, "tool"));

        // ============================================================ line 2
        // "It draws one, like any other word": every box lights like the
        // punctuation ones. "Some rows almost never call it. Some always do.":
        // each row lights by its share of punctuation counters.
        const tLike = T.word(2, "like");
        const others = allCells.filter((c) => !punctCells.includes(c)).map((c) => c.lit);
        tl.to(others, { opacity: 1 }, tLike, { dur: 0.35 });
        tl.to(others, { opacity: 0 }, T.word(2, "word") + 0.6, { dur: 0.4 });
        const tRows = T.word(2, "rows");
        tl.to(punctCells.map((c) => c.lit), { opacity: 0 }, tRows, { dur: 0.4 });
        rows.forEach((x, n) => {
          if (x.share) tl.to(x.r.lit, { opacity: x.share }, tRows + 0.1 + n * 0.04, { dur: 0.3 });
          else tl.to(x.mute, { opacity: 0.6 }, T.word(2, "never"), { dur: 0.4 });
        });
        tl.to(rows.filter((x) => x.share === 1).map((x) => x.outline), { opacity: 1 }, T.word(2, "always"), { dur: 0.25, stagger: 0.08 });
        const t3 = T.start(3);
        tl.to(rows.flatMap((x) => [x.r.lit, x.mute, x.outline]), { opacity: 0 }, t3 - 0.3, { dur: 0.4 });

        // ============================================================ line 3
        // "Say you've written 'here comes the dog'. The row for 'dog': two red
        // for a full stop, two blue for 'runs'. Draw one. Red. Full stop. Stop."
        AG.ringWords(tl, d, 0, 1, 4, T.word(3, "written"), T.word(3, "row") - 0.4);
        const tRow = T.word(3, "row");
        const xDog = find("dog");
        // the row lifts off its sheet into the focus slot; the other sheets go
        tl.to(xDog.r.lit, { opacity: 1 }, tRow - 0.9, { dur: 0.25 });
        tl.to(sheets.map((s) => s.el), { opacity: 0 }, tRow - 0.5, { dur: 0.35 });
        tl.to(xDog.r.lit, { opacity: 0 }, tRow + 0.3, { dur: 0.2 });
        const from = { x: A_POS[xDog.s].x, y: A_POS[xDog.s].y + rowY(xDog.i) * SS, scale: (SW * SS) / FW };
        K.raise(tl, fDog.el, tRow - 0.5);
        tl.fromTo(fDog.el, { ...from, opacity: 0 }, { x: FX, y: FY, scale: 1, opacity: 1 }, tRow - 0.5, { dur: 0.7, ease: "in-out-cubic" });
        tl.to(fDog.lit, { opacity: 1 }, tRow + 0.2, { dur: 0.3 });
        tl.to(fDog.lit, { opacity: 0 }, T.word(3, "two") - 0.1, { dur: 0.3 });
        tl.to(cup.el, CUP_B, tRow - 0.5, { dur: 0.7, ease: "in-out-cubic" });
        // the row's counters drop into the cup as each colour is named
        const cStop = colOf(xDog, "."), cRuns = colOf(xDog, "runs");
        const dogCounters = [];
        [[cStop, T.word(3, "red")], [cRuns, T.word(3, "blue")]].forEach(([c, t]) => {
          tl.to(fDog.cells[c].lit, { opacity: 1 }, t - 0.1, { dur: 0.2 });
          tl.to(fDog.cells[c].lit, { opacity: 0 }, t + 1.0, { dur: 0.3 });
          for (let j = 0; j < 2; j++) {
            const k = dogCounters.length;
            const it = cup.add(PAL[c].name, k, 4);
            tl.fromTo(it.el, { opacity: 0, y: it.y - 40 }, { opacity: 1, y: it.y }, t + j * 0.2, { dur: 0.25, ease: "out-cubic" });
            dogCounters.push({ ...it, colour: PAL[c].name });
          }
        });
        // "Draw one": the cup shakes; "Red.": a red counter comes out
        tl.to(cup.svg, { rotation: -7 }, T.word(3, "Draw"), { dur: 0.18, yoyo: true });
        tl.to(cup.svg, { rotation: 7 }, T.word(3, "Draw") + 0.36, { dur: 0.18, yoyo: true });
        const OUT = { x: 620, y: 380 };
        const drawn = drawOut(dogCounters[0], CUP_B, T.word(3, "red", 2), OUT);
        // "Full stop.": its box lights, and the full stop lifts out of it
        const tFull = T.word(3, "full", 2);
        tl.to(fDog.cells[cStop].lit, { opacity: 1, fillOpacity: 0.6 }, tFull - 0.1, { dur: 0.25 });
        const tStop = T.word(3, "stop", 3);
        AG.pending(tl, d, wordAt(fDog, cStop), tFull + 0.1, tStop - 0.2);
        AG.phoneIn(tl, d, tStop + 0.3);
        tl.to([fDog.cells[cStop].lit, drawn.el], { opacity: 0 }, T.end(3) + 0.3, { dur: 0.4 });
        tl.to(dogCounters.slice(1).map((c) => c.el), { opacity: 0 }, T.end(3) + 0.3, { dur: 0.4 });

        // ============================================================ line 4
        AG.toolCall(tl, T, d, 4);

        // ============================================================ line 5
        // the reply written whole, then the full stop; carry on from the full
        // stop: its row, its counters in the cup, one out, the pencil moves
        const { tFrom } = AG.splice(tl, T, d, 5, "drew");
        tl.to(fDog.el, { opacity: 0 }, tFrom, { dur: 0.3 });
        tl.to(fStop.el, { opacity: 1 }, tFrom + 0.1, { dur: 0.3 });
        const stopCounters = fill(fStop.entry, tFrom + 0.4, 0.9);
        const tIt = T.word(5, "stop", 2) + 0.35;
        const drawn2 = drawOut(stopCounters.find((c) => c.colour === PAL[colOf(find("."), "it")].name), CUP_B, tIt, OUT);
        const cIt = colOf(find("."), "it");
        tl.to(fStop.cells[cIt].lit, { opacity: 1 }, tIt + 0.3, { dur: 0.2 });
        AG.writeAfterStop(tl, d, tIt + 0.5);

        // ============================================================ line 6
        // "Why from the full stop, and not from 'sandwich'? Because nobody has a
        // row for 'sandwich'. But there's always a row for a full stop." The
        // sheets come back; their row words are read in order, and where
        // "sandwich" would sort (between "runs" and "sits") there's nothing.
        const t6 = T.start(6);
        tl.to([fStop.el, drawn2.el, d.phone.el, ...stopCounters.map((c) => c.el)], { opacity: 0 }, t6 + 0.2, { dur: 0.35 });
        tl.to(cup.el, CUP_A, t6 + 0.4, { dur: 0.6, ease: "in-out-cubic" });
        tl.to(sheets.map((s) => s.el), { opacity: 1 }, t6 + 0.5, { dur: 0.5 });
        AG.ringWords(tl, d, 1, 5, 5, T.word(6, "sandwich") - 0.1, T.word(6, "But") - 0.2);
        const xRuns = find("runs"), xSits = find("sits");
        const readTo = rows.indexOf(xRuns);
        const tRead = T.word(6, "nobody"), tGap = T.word(6, "sandwich", 2);
        const per = (tGap - 0.2 - tRead) / (readTo + 1);
        rows.slice(0, readTo + 1).forEach((x, n) => {
          tl.to(x.r.prefixEl, { fill: "#be830e" }, tRead + n * per, { dur: 0.05 });
          tl.to(x.r.prefixEl, { fill: "#1a1a1a" }, tRead + (n + 1) * per + 0.05, { dur: 0.15 });
        });
        const gapY = A_POS[xSits.s].y + rowY(xSits.i) * SS;
        const slotEl = K.el("div", { class: "ag-slot", style: { width: `${SW * SS - 16}px`, height: `${RH * SS * 0.8}px` } }, scene);
        K.set(slotEl, { x: A_POS[xSits.s].x + 8, y: gapY - RH * SS * 0.4, opacity: 0 });
        tl.to(slotEl, { opacity: 1 }, tGap - 0.1, { dur: 0.2 });
        tl.to(xSits.mute, { opacity: 0.5 }, tGap - 0.1, { dur: 0.2 });
        tl.to(xRuns.mute, { opacity: 0.5 }, tGap - 0.1, { dur: 0.2 });
        tl.to([slotEl, xSits.mute, xRuns.mute], { opacity: 0 }, T.word(6, "But"), { dur: 0.3 });
        const xStop = find(".");
        const tHas = T.word(6, "row", 2);
        tl.to(xStop.r.lit, { opacity: 1 }, tHas, { dur: 0.3 });
        tl.to(xStop.outline, { opacity: 1 }, T.word(6, "full", 2), { dur: 0.25 });
        tl.to([xStop.r.lit, xStop.outline], { opacity: 0 }, T.start(7) - 0.2, { dur: 0.35 });

        // ============================================================ line 7
        // the sheets make way for the phone; the full stop's row stays up
        const t7 = T.start(7);
        tl.to(sheets.map((s) => s.el), { opacity: 0 }, t7 - 0.2, { dur: 0.3 });
        tl.to(cup.el, CUP_B, t7 - 0.2, { dur: 0.5, ease: "in-out-cubic" });
        tl.to([fStop.el, d.phone.el], { opacity: 1 }, t7, { dur: 0.35 });
        AG.backfill(tl, T, d, 7);

        // ============================================================ line 8
        // the desk clears for the loop; the model stays: the sheet with the
        // row for "dog"
        const t8 = T.start(8);
        K.vanish(tl, [cup.el, fStop.el, d.note.el, d.pen, d.phone.el], t8 - 0.1, { dur: 0.4 });
        const shDog = sheets[xDog.s], LS = 0.5;
        tl.set(shDog.el, { x: 40, y: 440 - (sheets[xDog.s].height * LS) / 2, scale: LS }, t8);
        tl.to(shDog.el, { opacity: 1 }, t8 + 0.2, { dur: 0.5 });
        const loop = AG.harnessLoop(scene, { x: 950, y: 20, w: 920, h: 850, labels: ["draw", "punctuation", "pause", "message out", "reply in", "carry on"] });
        AG.drawLoop(tl, loop, t8 + 0.4, 1.8);
        // "never learned what comes next after 'the dog'": its row holds a
        // full stop and "runs", and nothing else
        const tAfter = T.word(8, "after");
        const dogMates = rows.filter((x) => x.s === xDog.s && x !== xDog);
        tl.to(xDog.r.lit, { opacity: 1 }, tAfter, { dur: 0.3 });
        tl.to(dogMates.map((x) => x.mute), { opacity: 0.5 }, tAfter, { dur: 0.4 });
        tl.to([xDog.r.cells[cStop].lit, xDog.r.cells[cRuns].lit], { opacity: 1, fillOpacity: 0.6 }, T.word(8, "dog") + 0.1, { dur: 0.3 });
        const tAsk = AG.harness(tl, T, loop, 8, "drew");
        tl.to(xDog.r.cells[cRuns].lit, { opacity: 0 }, tAsk, { dur: 0.3 });
        tl.to([xDog.r.lit, xDog.r.cells[cStop].lit, ...dogMates.map((x) => x.mute)], { opacity: 0 }, T.word(8, "thing"), { dur: 0.5 });

        // ============================================================ line 9
        const t10 = T.start(10);
        AG.takeOut(tl, T, loop, 9, t10 - 0.6);

        // ============================================================ line 10 (TC)
        // back to the desk as it opened: the sheets, the cup and a fresh strip
        K.vanish(tl, [loop.el, shDog.el], t10 - 0.5, { dur: 0.4 });
        placeSheets(t10 - 0.1);
        tl.set(cup.el, CUP_A, t10 - 0.1);
        tl.set([...d.note.lines.flatMap((l) => l.words)], { opacity: 0 }, t10 - 0.1);
        tl.set(d.pen, d.tip(0, 0, false), t10 - 0.1);
        tl.to([...sheets.map((s) => s.el), cup.el, d.note.el, d.pen], { opacity: 1 }, t10, { dur: 0.6, stagger: 0.08 });

        // glints: the cup while the desk is held at the open and the close; the
        // phone as it arrives, and while it waits for a slow reply
        K.glint(tl, cup.rim, { from: 0.8, to: tRun - 0.3 });
        K.glint(tl, cup.rim, { from: t10 + 0.8, to: T.duration, phase: 0.2 });
        AG.glint(tl, d.phone.body, { from: tStop + 1.1, to: T.word(4, "Send"), phase: 0.3 });
        AG.glint(tl, d.phone.body, { from: T.word(7, "time"), to: T.word(7, "fill") });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["agentic-ai-ledger"] = tl;
      });
    </script>
  </body>
</html>
