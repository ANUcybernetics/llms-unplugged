<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Pre-trained generation (grid)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script src="parts/generated/booklet.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      .abs { position: absolute; left: 0; top: 0; }
      .cellbox { position: absolute; left: 0; top: 0; background: var(--paper); border-right: 1px solid rgb(0 0 0 / 22%); border-bottom: 1px solid rgb(0 0 0 / 22%); }
      .slot { position: absolute; top: 0; display: flex; align-items: center; font-family: var(--font-tok); color: var(--ink); line-height: 1; white-space: nowrap; }
      .num b { font-weight: 700; }
      .hole { position: absolute; left: 0; top: 0; width: 100px; height: 100px; box-shadow: 0 0 0 4000px rgb(13 13 13 / 74%); transform-origin: 0 0; }
      .pencil .w.p { vertical-align: -0.2em; }
    </style>
  </head>
  <body>
    <!-- Pre-trained generation (grid): ops/video/beyond/scripts/pretrained-generation-grid.md.
         The magpie grid folds into the magpie booklet as the CLI builds it
         (parts/generated/booklet.js, checked there against magpie.js); then
         the room's Paterson booklet, walked on its real printed pages (sleep
         again I'd float ;, rolls 7, 80, 6, as the deck does), and its whole
         grid pulled back on a canvas from the CLI's own pairs. -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="pretrained-generation-grid"
         data-start="0" data-duration="155.78" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="155.78" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="155.78" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as C from "./kit/motion/canvas.js";

      const build = (tl, S, T) => {
        const K = KIT, MG = MAGPIE, PAT = BOOKLET.paterson;
        const scene = document.getElementById("scene");
        const A = S.area;
        const W = (i, w, n) => T.word(i, w, n);

        // ---- a camera on a layer: a view puts layer point (px, py) at stage
        // point (sx, sy) at scale s. A move tweens the scale logarithmically and
        // the tracked point linearly, so the point of interest tracks. Moves and
        // cuts are added in time order: each starts from the view before it.
        const camera = (layerEl, v0) => {
          const place = (v) => ({ x: v.sx - v.px * v.s, y: v.sy - v.py * v.s, scale: v.s });
          K.set(layerEl, { ...place(v0), transformOrigin: "0 0" });
          let cur = { ...v0 };
          return {
            screen: (v, px, py) => ({ x: v.sx + (px - v.px) * v.s, y: v.sy + (py - v.py) * v.s }),
            cut(t, v) {
              tl.set(layerEl, place(v), t);
              cur = { ...v };
            },
            move(t, v, dur = 0.8, ease = "in-out-cubic") {
              const a = { ...cur };
              tl.sample(layerEl, t, dur, (p) => place({
                s: Math.exp(K.lerp(Math.log(a.s), Math.log(v.s), p)),
                px: K.lerp(a.px, v.px, p), py: K.lerp(a.py, v.py, p),
                sx: K.lerp(a.sx, v.sx, p), sy: K.lerp(a.sy, v.sy, p),
              }), { ease });
              cur = { ...v };
            },
          };
        };
        // a word as the booklet sets it (punctuation as its symbol tile)
        const FS = 17, TOKFONT = (size, bold) => `${bold ? 700 : 400} ${size}px "Libertinus Serif"`;
        const tokW = (w, size = FS, bold = false) => (K.isPunct(w) ? size * 1.23 : K.measure(w, TOKFONT(size, bold)));
        const tokInto = (e, w) => (K.isPunct(w) ? K.punctTile(e, w) : (e.textContent = w));
        // dice diamonds as the booklet prints them (drawn, so no glyph can fall back)
        const diamonds = (parent, n, { x, y, size = 8 }) => {
          const s = K.svg("svg", { width: n * (size + 3), height: size + 2, viewBox: `0 0 ${n * (size + 3)} ${size + 2}`, style: "position:absolute;overflow:visible" }, parent);
          const polys = Array.from({ length: n }, (_, i) => K.svg("polygon", { points: `${i * (size + 3) + size / 2} 1 ${i * (size + 3) + size} ${size / 2 + 1} ${i * (size + 3) + size / 2} ${size + 1} ${i * (size + 3)} ${size / 2 + 1}`, fill: "var(--ink)" }, s));
          K.set(s, { x, y });
          return { el: s, polys };
        };
        // a strip of paper with pencil words; punctuation written as its tile
        const pencilStrip = (x, y, w, words, size = 54) => {
          const p = K.paper(scene, { x, y, w, h: size * 2.1 });
          const line = K.pencilLine(p.el, words, { x: 34, y: size * 0.5, size });
          line.words.forEach((s, i) => {
            if (!K.isPunct(words[i])) return;
            s.textContent = "";
            s.classList.add("p");
            K.punctTile(s, words[i]);
          });
          K.set(p.el, { opacity: 0 });
          // a notepad laid over the dimmed booklet: its words may cover the page's
          for (const w of line.words) for (const e of [w, ...w.querySelectorAll("text")]) e.setAttribute("data-layout-allow-overlap", "");
          p.el.dataset.layoutAllowOcclusion = "";
          return { ...p, words: line.words };
        };

        // ================================================================
        // The Paterson booklet: real printed pages (1 px = 1 pt), a spread of
        // pages 34 and 35 under the cover, and the walk's other pages placed
        // so each walk entry sits exactly where sleep's does: the camera holds
        // still and the pages turn under it.
        const bookOuter = K.layer(scene, 0, 0);
        const bookL = K.layer(bookOuter, 0, 0);
        const P = PAT.pages, PW = P[1].w, PH = P[1].h;
        const pageEl = (n, x, y) => {
          const pg = P[n];
          const d = K.el("div", { class: "paper", style: { width: `${pg.w}px`, height: `${pg.h}px`, overflow: "hidden" } }, bookL);
          K.set(d, { x, y });
          K.el("img", { src: `parts/${pg.img}`, class: "abs", style: { width: `${pg.w}px`, height: `${pg.h}px` } }, d);
          for (const pt of pg.patches) {
            const [rx, ry, rw, rh] = pt.region;
            K.el("img", { src: `parts/${pt.img}`, class: "abs", style: { left: `${rx}px`, top: `${ry}px`, width: `${rw}px`, height: `${rh}px` } }, d);
          }
          return { el: d, n, x, y, pg };
        };
        // an entry on a page: its words, from the PDF's text layer, in reading order
        const entryOn = (n, head) => {
          const pt = P[n].patches.find((p) => p.entry === head);
          const [bx, by, bw, bh] = pt.box;
          const ws = P[n].words
            .filter((w) => w[1] >= bx - 0.5 && w[3] <= bx + bw + 0.5 && w[2] >= by - 0.5 && w[4] <= by + bh + 0.5)
            .sort((a, b) => Math.round((a[2] + a[4]) / 4) - Math.round((b[2] + b[4]) / 4) || a[1] - b[1]);
          return { box: pt.box, ws };
        };
        // a gold highlighter mark on a page, over a box in page points
        const marker = (pgObj, [x0, y0, x1, y1], pad = 1.4) => {
          const m = K.el("div", { class: "abs", style: { left: `${x0 - pad}px`, top: `${y0 - pad}px`, width: `${x1 - x0 + 2 * pad}px`, height: `${y1 - y0 + 2 * pad}px`, background: "var(--gold)", mixBlendMode: "multiply" } }, pgObj.el);
          K.set(m, { opacity: 0 });
          return m;
        };
        const union = (ws) => [Math.min(...ws.map((w) => w[1])), Math.min(...ws.map((w) => w[2])), Math.max(...ws.map((w) => w[3])), Math.max(...ws.map((w) => w[4]))];
        // the "thr|word" pair for each of an entry's followers, checked against the booklet data
        const pairMarks = (pgObj, entry, head) => PAT.walk[head].followers.map(([f, thr]) => {
          const i = entry.ws.findIndex((w) => w[0].startsWith(`${thr}|`));
          if (i < 0) throw new Error(`${thr}|${f} not printed in ${head}'s entry`);
          const w = entry.ws[i];
          return marker(pgObj, union(w[0] === `${thr}|` ? [w, entry.ws[i + 1]] : [w]));
        });
        const diamondMark = (pgObj, entry) => marker(pgObj, union(entry.ws.filter((w) => w[0].startsWith("♦"))));

        const pSleep = PAT.pageOf.sleep;
        const page34 = pageEl(pSleep - 1, 0, 0);
        const page35 = pageEl(pSleep, PW, 0);
        const eSleep = entryOn(pSleep, "sleep");
        const [sbx, sby] = eSleep.box;
        const walkPage = (head) => {
          const n = PAT.pageOf[head], e = entryOn(n, head);
          const pgObj = pageEl(n, PW + sbx - e.box[0], sby - e.box[1]);
          K.set(pgObj.el, { opacity: 0 });
          return { ...pgObj, e };
        };
        const pAgain = walkPage("again"), pId = walkPage("I'd"), pFloat = walkPage("float");
        K.set(page34.el, { transformOrigin: "100% 50%", scaleX: 0 });
        // the cover, its title under a flat card: guess the book before you check
        const cover = pageEl(1, PW, 0);
        K.set(cover.el, { transformOrigin: "0 50%" });
        const title = union(P[1].words.slice(0, P[1].words.findIndex((w) => w[0] === "A")));
        const card = K.el("div", { class: "abs", style: { left: `${title[0] - 14}px`, top: `${title[1] - 14}px`, width: `${title[2] - title[0] + 28}px`, height: `${title[3] - title[1] + 28}px`, background: "var(--paper)", boxShadow: "0 2px 0 var(--paper-edge), 0 8px 18px rgb(0 0 0 / 30%)" } }, cover.el);
        K.set(card, { transformOrigin: "0% 100%" });

        const bcam = camera(bookL, { px: PW * 1.5, py: PH / 2, sx: A.cx, sy: A.cy, s: 0.8 });
        const CLOSED = { px: PW * 1.5, py: PH / 2, sx: A.cx, sy: A.cy, s: 0.8 };
        const SPREAD = { px: PW, py: PH / 2, sx: A.cx, sy: A.cy, s: 0.84 };
        const WALK = { px: PW + sbx, py: sby, sx: 200, sy: 150, s: 6.2 };
        const flipOpen = (t) => {
          tl.to(cover.el, { scaleX: 0 }, t, { dur: 0.3, ease: "in-quad" });
          tl.to(page34.el, { scaleX: 1 }, t + 0.3, { dur: 0.3, ease: "out-quad" });
        };
        const flipShut = (t) => {
          tl.to(page34.el, { scaleX: 0 }, t, { dur: 0.3, ease: "in-quad" });
          tl.to(cover.el, { scaleX: 1 }, t + 0.3, { dur: 0.3, ease: "out-quad" });
        };

        // ================================================================
        // The magpie grid and the booklet it folds into.
        const vocab = MG.vocab, NV = vocab.length;
        const entries = BOOKLET.magpie.entries; // [word, maxRoll, [[follower, threshold]…]], booklet order
        const CELL = 29, HW = 96, HH = 96, GX = 60, GY = 34, DIAW = 24, SC = 1.45;
        const foldOuter = K.layer(scene, 0, 0);
        const foldL = K.layer(foldOuter, 0, 0);
        K.set(foldOuter, { opacity: 0 });
        const fcam = camera(foldL, { px: 0, py: 0, sx: 0, sy: 0, s: 1 });
        // the booklet: the column page the rows slide into, then a two-page spread
        const COLX = 910;
        const CPW = 830, CPH = NV * CELL + 28;
        const colPage = K.el("div", { class: "paper", style: { width: `${CPW}px`, height: `${CPH}px`, transformOrigin: "0 0" } }, foldL);
        K.set(colPage, { x: COLX - 14, y: GY + HH - 14, opacity: 0 });
        const SPW = 610 * SC, SPH = (24 + 12 * 36 + 24) * SC;
        const spX = A.cx - SPW, spY = A.cy - SPH / 2;
        const spread = [0, 1].map((k) => {
          const d = K.el("div", { class: "paper", style: { width: `${SPW}px`, height: `${SPH}px` } }, foldL);
          K.set(d, { x: spX + k * SPW, y: spY, opacity: 0 });
          return d;
        });
        const spine = K.el("div", { class: "abs", style: { width: "2px", height: `${SPH}px`, background: "rgb(0 0 0 / 18%)" } }, foldL);
        K.set(spine, { x: A.cx - 1, y: spY, opacity: 0 });
        // header row and corner
        const corner = K.el("div", { class: "cellbox", style: { width: `${HW}px`, height: `${HH}px`, borderRight: "2px solid var(--ink)", borderBottom: "2px solid var(--ink)" } }, foldL);
        K.set(corner, { x: GX, y: GY });
        const colHead = K.layer(foldL, GX + HW, GY);
        const chSvg = K.svg("svg", { width: NV * CELL, height: HH, viewBox: `0 0 ${NV * CELL} ${HH}` }, colHead);
        K.svg("rect", { x: 0, y: 0, width: NV * CELL, height: HH, fill: "var(--paper)" }, chSvg);
        K.svg("line", { x1: 0, y1: HH - 1, x2: NV * CELL, y2: HH - 1, stroke: "var(--ink)", "stroke-width": 2 }, chSvg);
        vocab.forEach((w, c) => {
          const cx = c * CELL + CELL / 2;
          if (K.isPunct(w)) K.punctBox(chSvg, w, { x: cx, y: HH - 18, size: 15, colour: "var(--ink)" });
          else K.svg("text", { transform: `translate(${cx + 5} ${HH - 9}) rotate(-90)`, "font-size": 16, text: w }, chSvg);
          if (c) K.svg("line", { x1: c * CELL, y1: 0, x2: c * CELL, y2: HH, stroke: "rgb(0 0 0 / 22%)" }, chSvg);
        });
        // one layer per row: the header cell, its 24 boxes, and (hidden) what the
        // row becomes as an entry: follower labels, thresholds, dice diamonds
        const rows = entries.map(() => null);
        const rowOf = {};
        entries.forEach(([w, maxRoll, fs], i) => {
          const r = vocab.indexOf(w);
          const counts = new Map(MG.rows[w]);
          const el = K.layer(foldL, GX, GY + HH + r * CELL);
          K.set(el, { transformOrigin: "0 0" });
          const hdr = K.el("div", { class: "cellbox", style: { width: `${HW}px`, height: `${CELL}px`, borderRight: "none" } }, el);
          const heads = [false, true].map((bold) => {
            const h = K.el("div", { class: "slot", style: { width: `${HW - 8}px`, height: `${CELL}px`, justifyContent: "flex-end", fontSize: `${FS}px`, fontWeight: bold ? 700 : 400 } }, hdr);
            tokInto(h, w);
            return h;
          });
          K.set(heads[1], { opacity: 0 });
          const rule = K.el("div", { class: "abs", style: { width: "2px", height: `${CELL}px`, background: "var(--ink)" } }, el);
          K.set(rule, { x: HW - 1 });
          const cells = vocab.map((f, c) => {
            const d = K.el("div", { class: "cellbox", style: { width: `${CELL}px`, height: `${CELL}px` } }, el);
            K.set(d, { x: HW + c * CELL });
            const n = counts.get(f) || 0;
            if (n) {
              const s = K.svg("svg", { width: CELL, height: CELL, viewBox: `0 0 ${CELL} ${CELL}`, style: "position:absolute;left:0;top:0;overflow:visible" }, d);
              const sp = 3, g = Math.ceil(n / 5), last = n - 5 * (g - 1);
              const span = (g - 1) * 6 * sp + (Math.min(last, 4) - 1) * sp;
              const strokes = K.tally(s, n, (CELL - span) / 2, (CELL - 13) / 2, 13, sp);
              for (const p of strokes) p.style.strokeWidth = "1.5px";
            }
            return { el: d, f, n, c };
          });
          // the entry: each follower's box, then its word; the box later gives way to the threshold
          let x = HW + DIAW;
          const items = fs.map(([f, thr]) => {
            const it = { f, thr, cell: cells[vocab.indexOf(f)], x, lw: tokW(f) };
            it.w = CELL + 3 + it.lw;
            it.label = K.el("div", { class: "slot", style: { height: `${CELL}px`, fontSize: `${FS}px` } }, el);
            tokInto(it.label, f);
            K.set(it.label, { x: x + CELL + 3, opacity: 0 });
            it.num = K.el("div", { class: "slot num", style: { width: `${CELL + 2}px`, height: `${CELL}px`, justifyContent: "flex-end", fontSize: `${FS}px` } }, el);
            it.num.innerHTML = `<b>${thr}</b>|`;
            K.set(it.num, { x: x + 1, opacity: 0 });
            it.mark = K.el("div", { class: "abs", style: { width: `${it.w + 8}px`, height: `${CELL - 4}px`, background: "var(--gold)", mixBlendMode: "multiply" } }, el);
            K.set(it.mark, { x: x - 4, y: 2, opacity: 0 });
            x += it.w + 12;
            return it;
          });
          const dia = fs.length > 1 ? diamonds(el, String(maxRoll).length, { x: HW + 5, y: CELL / 2 - 5 }) : null;
          if (dia) K.set(dia.el, { opacity: 0 });
          const row = { w, i, r, el, hdr, heads, rule, cells, items, dia, entryW: x - 12, maxRoll };
          rows[i] = row;
          rowOf[w] = row;
        });
        const byGrid = [...rows].sort((a, b) => a.r - b.r);
        // where entry i sits in the spread (booklet order, twelve a page)
        const slotOf = (i) => ({ x: spX + Math.floor(i / 12) * SPW + 22 * SC, y: spY + (24 + (i % 12) * 36) * SC });

        // ================================================================
        // The Paterson grid, on a canvas: every non-empty box from the CLI's
        // pairs, rows and columns in the order the book first uses each word,
        // with the magpie grid beside its corner at the same cell size.
        const NP = PAT.stats.words, cells = PAT.cells, NC = cells.length / 2;
        const MAGX = -30; // the magpie grid's corner, in Paterson cells (it sits up and left of the big grid)

        // ================================================================
        // desk furniture on top: the dimmer that frames an entry, the dice strip,
        // dice, pencil strips, the mug, the tools link
        const hole = K.el("div", { class: "hole" }, scene);
        K.set(hole, { opacity: 0 });
        const holeTo = (t, { x, y, w, h }, dur = 0) => {
          const v = { x: x - 12, y: y - 12, scaleX: (w + 24) / 100, scaleY: (h + 24) / 100 };
          dur ? tl.to(hole, v, t, { dur, ease: "in-out-cubic" }) : tl.set(hole, v, t);
        };

        // ================================================================
        // line 0 (TC): somebody else did the counting. The closed booklet on the
        // desk, title under a card; it opens on a spread full of words and numbers.
        K.appear(tl, bookOuter, 0.2, { y: 20 });
        flipOpen(W(0, "booklet"));
        bcam.move(W(0, "booklet"), SPREAD, 0.6);
        bcam.move(W(0, "model"), { px: PW + 250, py: 330, sx: A.cx, sy: A.cy, s: 2.4 }, 1.1);

        // ================================================================
        // line 1: the magpie grid folds into a booklet. Each row peels off into
        // an entry; the empty boxes fall away; the column closes into a spread.
        tl.to(bookOuter, { x: -1920 }, W(1, "here's"), { dur: 0.7, ease: "in-cubic" });
        tl.to(foldOuter, { opacity: 1 }, W(1, "grid") - 0.05, { dur: 0.01 });
        K.appear(tl, [corner, colHead, ...byGrid.map((r) => r.el)], W(1, "grid") - 0.1, { y: 14, stagger: 0.005 });
        K.appear(tl, colPage, W(1, "booklet"), { y: 0, dur: 0.5 });
        tl.fromTo(colPage, { x: COLX + 26 }, { x: COLX - 14 }, W(1, "booklet"), { dur: 0.5, ease: "out-cubic", immediate: false });
        const peel = (row, t, dur, closeT) => {
          tl.to(row.el, { x: COLX }, t, { dur, ease: "in-out-cubic" });
          tl.to(row.heads[0], { opacity: 0 }, t + 0.1, { dur: 0.3 });
          tl.to(row.heads[1], { opacity: 1 }, t + 0.1, { dur: 0.3 });
          tl.to(row.rule, { opacity: 0 }, t, { dur: 0.3 });
          tl.to(row.hdr, { backgroundColor: "rgb(255 255 255 / 0%)" }, t + dur, { dur: 0.3 });
          // the kept boxes close up behind the headword, in the booklet's order, words beside them
          row.items.forEach((it, k) => {
            tl.to(it.cell.el, { x: it.x }, closeT + k * 0.04, { dur: 0.5, ease: "in-out-cubic" });
            tl.to(it.label, { opacity: 1 }, closeT + 0.35 + k * 0.04, { dur: 0.3 });
          });
        };
        const fallAway = (row, t) => row.cells.forEach((c, j) => {
          if (c.n) return;
          const dt = t + K.jitter(row.r * 31 + j) * 0.35;
          tl.to(c.el, { y: 44, opacity: 0 }, dt, { dur: 0.45, ease: "in-quad" });
        });
        const first = byGrid[0];
        peel(first, W(1, "every"), 1.0, W(1, "empty") + 0.55);
        byGrid.forEach((row) => fallAway(row, W(1, "empty")));
        tl.to([corner, colHead], { opacity: 0, y: 30 }, W(1, "empty") + 0.3, { dur: 0.5, ease: "in-quad" });
        const tRest = W(1, "fall") - 0.1;
        byGrid.slice(1).forEach((row, k) => peel(row, tRest + k * 0.045, 0.6, tRest + k * 0.045));
        // the column closes up into two pages, in the booklet's (alphabetical) order
        const tSpread = Math.max(tRest + 23 * 0.045 + 0.7, T.start(2));
        rows.forEach((row) => {
          const s = slotOf(row.i);
          tl.to(row.el, { x: s.x, y: s.y, scale: SC }, tSpread + K.jitter(row.i) * 0.2, { dur: 0.8, ease: "in-out-cubic" });
        });
        // the page opens out into the spread under them
        tl.to(colPage, { x: spX, y: spY, scaleX: (2 * SPW) / CPW, scaleY: SPH / CPH }, tSpread, { dur: 0.8, ease: "in-out-cubic" });
        tl.set(spread, { opacity: 1 }, tSpread + 0.8);
        tl.set(colPage, { opacity: 0 }, tSpread + 0.8);
        tl.to(spine, { opacity: 1 }, tSpread + 0.8, { dur: 0.3 });

        // ================================================================
        // line 2: the entry for dog. Its two boxes, and the die bands from
        // generation under them; the booklet keeps only each band's last face.
        const dog = rowOf.dog;
        const Z = 2.4, VIEW = (row) => ({ px: slotOf(row.i).x, py: slotOf(row.i).y, sx: 60, sy: 150, s: Z / SC });
        const rowRect = (row) => ({ x: 60, y: 150, w: (row.entryW + 8) * Z, h: CELL * Z });
        const tDog = W(2, "dog") - 0.35;
        fcam.move(tDog, VIEW(dog), 0.8);
        holeTo(tDog, rowRect(dog));
        tl.to(hole, { opacity: 1 }, tDog + 0.5, { dur: 0.4 });
        const bands = K.diceBands(dog.items.map((it) => ({ word: it.f, count: it.cell.n })));
        const FACE = 72;
        const dstrip = K.strip(scene, bands, { x: 330, y: 330, face: FACE, labelSize: 40 });

            ctx.globalAlpha = 1;
          }
        }, { x: 0, y: 0, w: S.W, h: S.H - S.captionH });
        scene.prepend(gridCanvas.el); // under everything: it only draws while the rest is away

        // ================================================================
        // line 8: the booklet, closed, with the line so far; it runs on, and a
        // few of its words give the book away. The card lifts a crack.
        const t8 = T.start(8);
        bcam.cut(tFall, BOOK8);
        tl.set([pAgain.el, pId.el, pFloat.el], { opacity: 0 }, tFall);
        tl.set(page35.el, { x: PW, opacity: 1 }, tFall);
        tl.set(page34.el, { scaleX: 0 }, tFall);
        tl.set(cover.el, { scaleX: 1 }, tFall);
        // the booklet cross-fades in over the specks as they arrive
        tl.to(bookOuter, { opacity: 1 }, tG0 + 0.45, { dur: 0.45 });
        const NX = 680;
        notes.forEach((n, k) => {
          tl.set(n.el, { x: NX, y: 180 + k * 130 }, t8);
          if (k) K.appear(tl, n.el, W(8, "listen") - 0.2 + k * 0.3, { y: 14 });
          else tl.to(n.el, { opacity: 1 }, tG0 + 0.7, { dur: 0.4 });
        });
        const tRun = W(8, "listen"), rest = noteWords.slice(5);
        rest.forEach((w, k) => K.write(tl, w, tRun + 0.1 + k * ((T.wordEnd(8, "out") + 0.6 - tRun) / rest.length)));
        const tells = ["station", "mob", "Murray"].map((w) => noteWords[walkWords.indexOf(w)]);
        const tTell = W(8, "guess");
        tells.forEach((w, k) => tl.to(w, { color: "var(--gold)" }, tTell + k * 0.4, { dur: 0.25 }));
        tl.to(card, { rotation: -3.5 }, W(8, "cover"), { dur: 0.35, ease: "out-cubic" });
        tl.to(card, { rotation: 0 }, W(8, "cover") + 0.8, { dur: 0.45, ease: "in-out-cubic" });

        // ================================================================
        // line 9: open weights. The booklet open flat, a mug beside it; the
        // numbers down a column light one after another.
        const t9 = T.start(9);
        tl.to(notes.map((n) => n.el), { opacity: 0 }, t9 + 0.1, { dur: 0.4 });
        const OPEN9 = { px: PW, py: 0, sx: 250, sy: 40, s: 2.0 };
        flipOpen(t9 + 0.2);
        bcam.move(t9 + 0.2, OPEN9, 1.0);
        const colNums = page35.pg.words
          .filter((w) => /^\d+\|/.test(w[0]) && w[1] >= 192 && w[1] < 318 && w[4] < 380)
          .sort((a, b) => a[2] - b[2] || a[1] - b[1]);
        const colMarks = colNums.map((w) => marker(page35, [w[1], w[2], w[3], w[4]]));
        const tRead = W(9, "read"), tTable = W(9, "table");
        colMarks.forEach((m, k) => tl.to(m, { opacity: 0.45 }, tRead + (k * (tTable - tRead)) / colMarks.length, { dur: 0.12 }));
        const mugIcon = K.icon(scene, "coffee-cup", { x: 1500, y: 436, size: 280 });
        const mug = mugIcon.el;
        K.set(mug, { opacity: 0 });
        K.appear(tl, mug, W(9, "kitchen"), { y: 16 });
        K.glint(tl, mugIcon.paths, { phase: 0.9, from: W(9, "kitchen"), to: W(10, "grab") });

        // ================================================================
        // line 10 (TC): grab it and roll. The booklet shuts under its card, as
        // it began; a die lands beside it; the tools link.
        const t10 = W(10, "grab");
        tl.to([...colMarks, mug], { opacity: 0 }, t10, { dur: 0.3 });
        flipShut(t10);
        bcam.move(t10, { px: PW, py: 0, sx: 330, sy: 108, s: 0.8 }, 0.9);
        tl.set(dieA.el, { x: 1080, y: 250 }, W(10, "rolling") - 0.1);
        K.land(tl, dieA, 7, W(10, "rolling"));
        const link = K.el("div", { class: "label gold", text: "llmsunplugged.org/tools", style: { fontSize: "44px" } }, scene);
        K.set(link, { x: 900, y: 560, opacity: 0 });
        K.appear(tl, link, W(10, "llmsunplugged.org/tools"), { y: 12 });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["pretrained-generation-grid"] = tl;
      });
    </script>
  </body>
