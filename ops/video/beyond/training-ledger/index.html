<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LLMs Unplugged — Training (ledger), beyond the slides</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/generated/data.js"></script>
    <script src="parts/generated/magpie.js"></script>
    <script src="parts/generated/frankenstein.js"></script>
    <script type="module" src="kit/kit.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      .page { font-family: var(--font-tok); color: var(--ink); line-height: 1.45; }
      .cover { display: flex; flex-direction: column; align-items: center; font-family: var(--font-tok); color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- Training (ledger), beyond the slides: ops/video/beyond/scripts/training-ledger.md.
         The sibling of ../training-grid: the same book, strip, bracket and
         machine-speed run (parts/stream.js), counted onto ledger sheets, then
         Frankenstein's real counts as a growing stack of sheets
         (parts/frankenstein.js). Every beat lands on a word of the voice
         track (timing.json).

         Where the video's sheets differ from the printed magpie set (the
         CLI's ledger for data/originals/the-magpie.txt), following the
         script's "lowercase everything" (STYLE.md, Faithfulness); the counts
         are the same (parts/build-magpie.py checks them against the CLI):
         - lowercase: the printed set keeps "Here", "Down" and "Swoop"
           capitalised (the book only writes them that way), as rows and as
           followers in the full stop's row (it, Here, Down, Swoop); here
           they are "here", "down", "swoop"
         - row order: the printed set is in dictionary order; these sheets
           are in the order the book first uses each word, as a hand-filled
           set is (the script's Builds-on)
         - sheet breaks: five sheets of five rows (four on the last), as
           printed, but each sheet holds the next five words met rather than
           a dictionary run (printed: ! to back, comes to goes, Here to on,
           postie to Swoop, the to watches)
         - the ledger's Frankenstein stack lays the CLI's rows (four boxes to
           a line, continuing onto the lines below) five lines to a sheet, in
           reading order; the CLI prints no such set -->
    <div id="stage" class="stage" data-aspect="landscape" data-composition-id="training-ledger"
         data-start="0" data-duration="120.06" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="120.06" data-track-index="0"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="120.06" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as C from "./kit/motion/canvas.js";
      import { streamPairs, stepTo, pairBox, bracket, bracketSet, bracketTo } from "./parts/stream.js";
      import * as FR from "./parts/frankenstein.js";

      const build = (tl, S, T) => {
        const K = KIT, D = KIT_DATA, MG = MAGPIE;
        const scene = document.getElementById("scene");
        const A = S.area;

        // ---- objects (as in training-grid) ----------------------------------
        const cover = (parent, title, { x = 0, y = 0, w = 520, h = 640, sub = "", fence = true } = {}) => {
          const d = K.el("div", { class: "paper cover", style: { width: `${w}px`, height: `${h}px`, padding: `${h * 0.14}px 40px 0` } }, parent);
          K.el("div", { text: title, style: { fontSize: `${w * 0.16}px`, fontWeight: 600, lineHeight: 1.1, textAlign: "center" } }, d);
          if (sub) K.el("div", { text: sub, style: { fontSize: `${w * 0.065}px`, fontStyle: "italic", marginTop: `${w * 0.05}px`, color: "var(--ink-muted)" } }, d);
          if (fence) {
            const s = K.svg("svg", { width: w, height: h * 0.3, viewBox: `0 0 ${w} ${h * 0.3}`, style: "position: absolute; left: 0; bottom: 24px" }, d);
            const ph = h * 0.3;
            K.svg("rect", { x: 30, y: ph * 0.45, width: w - 60, height: 10, fill: "#6b6b6b" }, s);
            K.svg("rect", { x: 30, y: ph * 0.75, width: w - 60, height: 10, fill: "#6b6b6b" }, s);
            for (let px = 44; px < w - 50; px += 38) K.svg("path", { d: `M${px} ${ph} L${px} ${ph * 0.22} L${px + 11} ${ph * 0.12} L${px + 22} ${ph * 0.22} L${px + 22} ${ph} Z`, fill: "#8a8a8a" }, s);
          }
          K.set(d, { x, y });
          return d;
        };
        const page = (parent, words, { x = 0, y = 0, w = 520, h = 640, size = 46, pad = 56 } = {}) => {
          const d = K.el("div", { class: "paper page", style: { width: `${w}px`, height: `${h}px`, padding: `${pad}px`, fontSize: `${size}px` } }, parent);
          const spans = words.map((t) => {
            const s = K.el("span", { text: t }, d);
            d.append(" ");
            return s;
          });
          K.set(d, { x, y });
          return { el: d, spans, w, h };
        };
        const spanBox = (s) => ({ x: s.offsetLeft, y: s.offsetTop, w: s.offsetWidth, h: s.offsetHeight });
        const frame = (parent, b, pad = 10) => {
          const r = K.ring(parent, { w: b.w + 2 * pad, h: b.h + 2 * pad });
          K.set(r.el, { x: b.x - pad, y: b.y - pad });
          return r;
        };
        const drawStrokes = (paths, t, dur = 0.35, stagger = 0) => {
          paths.forEach((p, k) => tl.set(p, { opacity: 1 }, t + k * stagger));
          K.drawOn(tl, paths, t, dur, stagger);
        };
        const allow = (root, kind) => root.querySelectorAll("text, span, div").forEach((e) => e.setAttribute(`data-layout-allow-${kind}`, "true"));

        // ---- the magpie's ledger, lowercased, rows in first-use order --------
        const bg = K.bigrams(MG.words, MG.vocab);
        const entries = MG.vocab.map((w) => ({ prefix: [w], followers: MG.rows[w].map(([text, count]) => ({ text, count })) }));
        const slotOf = (from, to) => MG.rows[from].findIndex(([w]) => w === to);
        const ROWS = 5, SW = 1600, ROWH = 150, PAD = 24, SH = ROWS * ROWH + 2 * PAD, GAP = 60;
        const PREFIXW = 260, BOXW = (SW - PREFIXW) / 4;
        // sheet k's place in sheet px: three across, then two (the first five
        // slots of frankenstein.js's shells, so the sheets can hand over to it)
        const sheetAt = (k) => ({ x: (k % 3) * (SW + GAP), y: Math.floor(k / 3) * (SH + GAP) });
        const makeSheets = (parent, { finished = false } = {}) => {
          const sheets = [];
          for (let k = 0; k * ROWS < entries.length; k++) {
            const at = sheetAt(k);
            const sh = K.sheet(parent, entries.slice(k * ROWS, k * ROWS + ROWS), D.palette, { x: at.x, y: at.y, w: SW, rowH: ROWH, pad: PAD, header: null, fontSize: 44, prefixW: PREFIXW });
            // the kit's small colour names read under AA; darken them (as TASK-154 did)
            sh.svg.querySelectorAll("text.ui").forEach((t) => (t.style.fill = "#4a4a4a"));
            sheets.push(sh);
          }
          const strokes = sheets.flatMap((sh) => sh.rows.flatMap((r) => r.cells.flatMap((c) => c.strokes)));
          if (finished) K.set(strokes, { strokeDashoffset: 0 });
          else K.set(strokes, { opacity: 0 }); // hidden until drawn (a round cap shows as a dot)
          return sheets;
        };
        // a word on a sheet with its symbol-tile box, if punctuation
        const withBox = (textEl) => (K.isPunct(textEl.textContent) ? [textEl.previousElementSibling, textEl] : [textEl]);

        // ---- the fan of finished sheets and the book (line 0) ----------------
        const fanL = K.layer(scene, 0, 0);
        const fan = makeSheets(fanL, { finished: true });
        fan.forEach((sh, k) => {
          K.set(sh.el, { x: 90 + k * 70, y: A.y + 20 + k * 58, scale: 0.46, rotation: (k - 2) * 2.2, transformOrigin: "0 0" });
          allow(sh.el, "overlap");
        });
        K.set(fanL, { opacity: 0 });

        const BY = A.y + 60;
        const bookL = K.layer(scene, 330, 0);
        const leftPage = K.el("div", { class: "paper", style: { width: "520px", height: "640px" } }, bookL);
        K.set(leftPage, { x: 440, y: BY, scaleX: 0, transformOrigin: "100% 50%" });
        const first = page(bookL, ["The", "magpie", "is", "back.", "It", "sits", "on", "the", "fence."], { x: 960, y: BY });
        first.spans[3].after(K.el("br", {}));
        first.spans.forEach((sp) => { sp.setAttribute("data-layout-allow-overlap", "true"); sp.setAttribute("data-layout-allow-occlusion", "true"); }); // under the cover; later stepped off the desk
        const bookCover = cover(bookL, "The magpie", { x: 960, y: BY });
        K.set(bookCover, { transformOrigin: "0 50%" });
        K.set(bookL, { opacity: 0 });

        // ---- the tiles ------------------------------------------------------
        const TS = { size: 40, gap: 12, padX: 16, maxW: 1e6 };
        const SX = A.x, SY = A.y;
        const raw = ["The", "magpie", "is", "back.", "It", "sits", "on", "the", "fence."];
        const setA = K.tiles(scene, raw, { ...TS, x: SX, y: SY });
        const setB = K.tiles(scene, raw.map((w) => w.toLowerCase()), { ...TS, x: SX, y: SY });
        setB.tiles.forEach((t, i) => K.set(t.el, { x: setA.tiles[i].x }));
        const strip = K.tiles(scene, MG.words, { ...TS, x: SX, y: SY });
        K.set([...setA.tiles, ...setB.tiles, ...strip.tiles].map((t) => t.el), { opacity: 0 });
        const fromA = [0, 1, 2, 3, 3, 4, 5, 6, 7, 8, 8];

        // ---- the working sheets: blank, filled as the book is read -----------
        const ledL = K.layer(scene, 0, 0);
        const sheets = makeSheets(ledL);
        const rowOf = (w) => { const r = bg.idx.get(w); return { k: Math.floor(r / ROWS), i: r % ROWS, row: sheets[Math.floor(r / ROWS)].rows[r % ROWS] }; };
        // everything written in waits hidden
        sheets.forEach((sh) => sh.rows.forEach((row) => {
          K.set(withBox(row.prefixEl), { opacity: 0 });
          row.cells.forEach((c) => c.wordEl && K.set(withBox(c.wordEl), { opacity: 0 }));
        }));
        K.set(sheets.slice(1).map((s) => s.el), { opacity: 0 });
        K.set(ledL, { opacity: 0 });
        ledL.setAttribute("data-layout-allow-overflow", "true");
        allow(ledL, "occlusion"); // the camera takes the sheets past the frame, under the captions
        // the strokes of each box in a group of their own, so they can collapse
        // into a numeral without the word beside them
        const markGroups = sheets.map((sh) => sh.rows.map((row) => row.cells.map((c) => {
          if (!c.strokes.length) return null;
          const g = K.svg("g", {}, c.g);
          c.strokes[0].before(g);
          c.strokes.forEach((p) => g.append(p));
          return g;
        })));
        // numerals in the box's colour (line 6), in the strip
        const NUMC = FR.LEDGER_STYLE.numColours;
        const numerals = sheets.map((sh) => sh.rows.map((row) => row.cells.map((c, j) => {
          if (!c.follower) return null;
          const t = K.svg("text", { x: c.cx, y: c.cy, "text-anchor": "middle", "dominant-baseline": "central", class: "ui", "font-size": 64, "font-weight": 700, fill: NUMC[j], text: String(c.follower.count) }, c.g);
          K.set(t, { opacity: 0, transformOrigin: "50% 50%" });
          return t;
        })));

        // the camera over the sheets: sheet px → stage
        let cam = { x: 110, y: 150, s: 0.85 };
        K.set(ledL, { x: cam.x, y: cam.y, scale: cam.s });
        const onStage = (px, py, c = cam) => ({ x: c.x + px * c.s, y: c.y + py * c.s });
        const camTo = (st, t, dur = 0.8) => {
          tl.to(ledL, { x: st.x, y: st.y, scale: st.s }, t, { dur, ease: "in-out-cubic" });
          cam = st;
        };
        // where things are on a sheet, in sheet px
        const rowY = (k, i) => sheetAt(k).y + PAD + i * ROWH;
        const PFONT = '700 44px "Libertinus Serif"', WFONT = '44px "Libertinus Serif"';
        const wordW = (w, font) => (K.isPunct(w) ? 44 * 1.15 : K.measure(w, font));
        const prefixSlot = (w) => { const { k, i } = rowOf(w); return { x: sheetAt(k).x + (K.isPunct(w) ? 14 : 24) + wordW(w, PFONT) / 2, y: rowY(k, i) + ROWH / 2 }; };
        const boxSlot = (from, j, to) => { const { k, i } = rowOf(from); return { x: sheetAt(k).x + PREFIXW + j * BOXW + (K.isPunct(to) ? 18 : 24) + wordW(to, WFONT) / 2, y: rowY(k, i) + ROWH / 2 }; };
        const stripSlot = (from, j) => { const { k, i } = rowOf(from); return { x: sheetAt(k).x + PREFIXW + j * BOXW + BOXW * 0.79, y: rowY(k, i) + ROWH / 2 }; };

        const br = bracket(scene, { h: strip.size });
        let stripX = SX;
        // a copy of a strip tile flies to its place on the sheet and hands over
        const flyTo = (tile, slot, els, t) => {
          const punct = K.isPunct(tile.text);
          const clone = K.el("div", { class: `tile${punct ? " punct" : ""}`, ...(punct ? {} : { text: tile.text }), style: { width: `${tile.w}px`, height: `${tile.h}px`, fontSize: "40px" } }, scene);
          if (punct) K.punctTile(clone, tile.text);
          K.set(clone, { opacity: 0 });
          const p = onStage(slot.x, slot.y);
          tl.set(clone, { x: stripX + tile.x, y: SY + tile.y, opacity: 1 }, t);
          tl.to(clone, { x: p.x - tile.w / 2, y: p.y - tile.h / 2, scale: (44 / 40) * cam.s }, t, { dur: 0.6, ease: "in-out-cubic" });
          tl.to(clone, { opacity: 0 }, t + 0.55, { dur: 0.15 });
          tl.to(els, { opacity: 1 }, t + 0.55, { dur: 0.2 });
        };
        // a row starts (its first word written in), a follower takes its box
        const started = new Set(), boxed = new Set();
        const startRow = (tokIdx, t) => {
          const w = MG.words[tokIdx];
          if (started.has(w)) return;
          started.add(w);
          flyTo(strip.tiles[tokIdx], prefixSlot(w), withBox(rowOf(w).row.prefixEl), t);
        };
        const fillBox = (tokIdx, t) => {
          const from = MG.words[tokIdx], to = MG.words[tokIdx + 1], j = slotOf(from, to);
          if (boxed.has(`${from} ${to}`)) return;
          boxed.add(`${from} ${to}`);
          flyTo(strip.tiles[tokIdx + 1], boxSlot(from, j, to), withBox(rowOf(from).row.cells[j].wordEl), t);
        };
        const mark = (p, t, dur = 0.35) => drawStrokes([rowOf(p.from).row.cells[slotOf(p.from, p.to)].strokes[p.nth - 1]], t, dur);
        const lightRow = (w, t, off) => {
          tl.to(rowOf(w).row.lit, { opacity: 1 }, t, { dur: 0.3 });
          tl.to(rowOf(w).row.lit, { opacity: 0 }, off, { dur: 0.4 });
        };

        // ==== line 0: finished sheets, and the book they came from
        K.appear(tl, fanL, 0.2, { y: 24 });
        K.appear(tl, bookL, 0.5, { y: 24 });
        // every mark: the marks lift a moment
        const tMark0 = T.word(0, "mark");
        fan.flatMap((sh) => sh.rows.flatMap((r) => r.cells.flatMap((c) => c.strokes))).forEach((p, i) => {
          tl.to(p, { y: -8 }, tMark0 + K.jitter(i) * 0.3, { dur: 0.16, ease: "out-cubic", yoyo: true });
        });
        const COVER0 = { x: 330 + 960, y: BY, w: 520, h: 640 };
        const bookRing = frame(scene, COVER0, 14);
        tl.to(bookRing.el, { opacity: 1 }, T.word(0, "reading"), { dur: 0.3 });
        tl.to(bookRing.el, { opacity: 0 }, T.word(0, "keep") + 0.2, { dur: 0.3 });
        tl.to(bookRing.el, { opacity: 1 }, T.word(0, "book"), { dur: 0.3 });
        // the sheets slide aside; the book comes to the middle and opens
        const tAside = T.word(0, "seconds") - 0.2;
        tl.to(bookRing.el, { opacity: 0 }, tAside, { dur: 0.2 });
        tl.to(fanL, { x: -1500 }, tAside, { dur: 0.8, ease: "in-cubic" });
        const tOpen = tAside + 0.5;
        tl.to(bookL, { x: 0 }, tOpen, { dur: 0.7, ease: "in-out-cubic" });
        tl.to(bookCover, { scaleX: 0 }, tOpen + 0.1, { dur: 0.3, ease: "in-quad" });
        tl.set(bookCover, { opacity: 0 }, tOpen + 0.4);
        tl.to(leftPage, { scaleX: 1 }, tOpen + 0.4, { dur: 0.3, ease: "out-quad" });
        const tLift = tOpen + 1.0;
        setA.tiles.forEach((tile, i) => {
          const b = spanBox(first.spans[i]);
          const cx = 960 + b.x + b.w / 2, cy = BY + b.y + b.h / 2, s = 46 / 40;
          tl.fromTo(tile.el, { opacity: 0, x: cx - tile.w / 2, y: cy - tile.h / 2 - SY, scale: s }, { opacity: 1, x: tile.x, y: tile.y, scale: 1 }, tLift + i * 0.08, { dur: 0.6, ease: "in-out-cubic" });
          tl.to(first.spans[i], { opacity: 0.18 }, tLift + i * 0.08, { dur: 0.3 });
        });
        const BOOK_SMALL = { x: 1490 - 440 * 0.33, y: 600 - BY * 0.33, scale: 0.33 };
        tl.to(bookL, BOOK_SMALL, T.start(1) - 0.2, { dur: 0.7, ease: "in-out-cubic" });

        // ==== line 1: lowercase, one tile at a time; full stops split off
        const tLower = T.word(1, "lowercase");
        setA.tiles.forEach((tile, i) => {
          const b = setB.tiles[i];
          if (tile.text === b.text) {
            tl.set(tile.el, { opacity: 0 }, tLower);
            tl.set(b.el, { opacity: 1 }, tLower);
          }
        });
        [0, 4].forEach((i, k) => {
          const t = tLower + 0.05 + k * 0.35;
          tl.to(setA.tiles[i].el, { opacity: 0, y: 14 }, t, { dur: 0.25, ease: "in-quad" });
          tl.fromTo(setB.tiles[i].el, { opacity: 0, y: -14 }, { opacity: 1, y: 0 }, t + 0.1, { dur: 0.3, ease: "out-cubic" });
        });
        const tSplit = T.word(1, "full");
        tl.set(setB.tiles.map((t) => t.el), { opacity: 0 }, tSplit);
        fromA.forEach((a, j) => {
          const tile = strip.tiles[j], src = setA.tiles[a];
          const punct = K.isPunct(tile.text);
          const x0 = punct ? src.x + src.w - tile.w - 6 : src.x;
          tl.fromTo(tile.el, { x: x0, opacity: punct ? 0 : 1 }, { x: tile.x, opacity: 1 }, tSplit, { dur: 0.55, ease: "out-cubic", immediate: false });
        });

        // ==== line 2: find the row, the second word in a box, a mark; slide
        const P = bg.pairs;
        K.appear(tl, ledL, T.start(2) + 0.2, { y: 20 });
        // the book steps off the desk while the sheet needs the width, and comes back
        tl.to(bookL, { y: BOOK_SMALL.y + 420 }, T.start(2), { dur: 0.6, ease: "in-cubic" });
        tl.to(bookL, { y: BOOK_SMALL.y }, T.word(4, "Here's") + 0.2, { dur: 0.6, ease: "out-cubic" });
        const tTwo = T.word(2, "two");
        bracketSet(tl, br, { ...pairBox(strip, 0), x: SX + pairBox(strip, 0).x, y: SY }, tTwo - 0.3);
        tl.to(br.el, { opacity: 1 }, tTwo, { dur: 0.3 });
        tl.to([strip.tiles[0].el, strip.tiles[1].el], { y: -10 }, tTwo + 0.1, { dur: 0.25, ease: "out-cubic", yoyo: true });
        const row0 = rowOf("the").row;
        tl.to(row0.lit, { opacity: 1 }, T.word(2, "row", 1), { dur: 0.3 });
        startRow(0, T.word(2, "first") - 0.1);
        const box00 = row0.cells[0];
        tl.to(box00.lit, { opacity: 1 }, T.word(2, "box") - 0.2, { dur: 0.3 });
        fillBox(0, T.word(2, "second") + 0.2);
        mark(P[0], T.word(2, "mark"));
        tl.to([row0.lit, box00.lit], { opacity: 0 }, T.word(2, "Then"), { dur: 0.4 });
        const tSlide = T.word(2, "slide");
        stripX = stepTo(tl, { strip, bracket: br, i: 1, t: tSlide, dur: 0.5, anchor: 1100, x0: SX, stripX });
        startRow(1, tSlide + 0.35);
        lightRow("magpie", tSlide + 0.8, T.word(2, "again") - 0.1);
        fillBox(1, tSlide + 0.55);
        mark(P[1], T.word(2, "one") + 0.2, 0.3);
        const tAgain = T.word(2, "do");
        stripX = stepTo(tl, { strip, bracket: br, i: 2, t: tAgain - 0.2, dur: 0.45, anchor: 1100, x0: SX, stripX });
        startRow(2, tAgain + 0.1);
        lightRow("is", tAgain + 0.55, T.end(2) + 0.9);
        fillBox(2, tAgain + 0.3);
        mark(P[2], tAgain + 0.95, 0.3);

        // ==== line 3: a new follower takes the next box; pairs come round again
        const t3 = T.start(3);
        K.appear(tl, strip.tiles.slice(11).map((t) => t.el), t3 - 0.4, { y: 12, stagger: 0.012, dur: 0.35 });
        tl.to(row0.lit, { opacity: 1 }, T.word(3, "same") , { dur: 0.3 });
        const theP = P.filter((p) => p.from === "the").slice(1);
        const slowT = [T.word(3, "new") - 0.3, T.word(3, "when") - 0.35, T.word(3, "round") - 0.3];
        const fastT0 = T.word(3, "mark") + 0.3, fastT1 = T.word(3, "fence") - 0.35;
        const theTimes = [...slowT, ...Array.from({ length: theP.length - 3 }, (_, k) => fastT0 + (fastT1 - fastT0) * Math.pow(k / (theP.length - 4), 0.75))];
        theP.forEach((p, k) => {
          const t = theTimes[k], gap = (theTimes[k + 1] ?? t + 0.6) - t;
          const dur = Math.min(0.45, gap * 0.7);
          stripX = stepTo(tl, { strip, bracket: br, i: p.i, t, dur, anchor: 1000, x0: SX, stripX });
          // "fence" writes into the next empty box on the word that says so
          const tBox = k === 0 ? T.word(3, "next") - 0.5 : t + dur * 0.3;
          fillBox(p.i, tBox);
          mark(p, k < 3 ? (k === 0 ? T.word(3, "box") : k === 2 ? T.word(3, "another") : tBox + 0.7) : t + dur * 0.8, Math.min(0.35, gap * 0.6));
        });
        const boxRing = (j, tOn, tOff) => {
          const r = frame(ledL, { x: PREFIXW + j * BOXW, y: PAD, w: BOXW, h: ROWH }, 4);
          tl.to(r.el, { opacity: 1 }, tOn, { dur: 0.25 });
          tl.to(r.el, { opacity: 0 }, tOff, { dur: 0.3 });
        };
        boxRing(1, T.word(3, "fence"), T.word(3, "the", 5) - 0.1);
        boxRing(0, T.word(3, "magpie"), T.end(3) + 0.8);

        // ==== line 4: the rest of the book at machine speed
        tl.to(row0.lit, { opacity: 0 }, T.word(4, "training"), { dur: 0.5 });
        const tRest = T.word(4, "Here's");
        stripX = stepTo(tl, { strip, bracket: br, i: 3, t: tRest, dur: 0.6, anchor: 1000, x0: SX, stripX });
        const S5 = 0.36;
        const FULL4 = { x: A.x, y: 142, s: S5 };
        camTo(FULL4, tRest, 0.8);
        const run = P.slice(3);
        const sheetShown = new Set([0]);
        const res = streamPairs(tl, scene, {
          strip, bracket: br, pairs: run, t0: T.word(4, "rest") + 0.1, dur: 2.4, ease: "in-out-quad",
          anchor: 1000, x0: SX,
          skip: (p) => p.from === "the",
          target: (p) => { const b = stripSlot(p.from, slotOf(p.from, p.to)); return onStage(b.x, b.y, FULL4); },
          land: (p, t) => {
            const { k, row } = rowOf(p.from);
            if (!sheetShown.has(k)) {
              sheetShown.add(k);
              tl.fromTo(sheets[k].el, { opacity: 0, y: sheetAt(k).y + 200 }, { opacity: 1, y: sheetAt(k).y }, t - 0.3, { dur: 0.35, ease: "out-cubic" });
            }
            if (!started.has(p.from)) { started.add(p.from); tl.to(withBox(row.prefixEl), { opacity: 1 }, t, { dur: 0.12 }); }
            const j = slotOf(p.from, p.to), key = `${p.from} ${p.to}`;
            if (!boxed.has(key)) { boxed.add(key); tl.to(withBox(row.cells[j].wordEl), { opacity: 1 }, t, { dur: 0.12 }); }
            const stroke = row.cells[j].strokes[p.nth - 1];
            tl.set(stroke, { opacity: 1 }, t);
            K.drawOn(tl, [stroke], t, 0.12, 0);
            tl.to(row.lit, { opacity: 0.8 }, t, { dur: 0.04 });
            tl.to(row.lit, { opacity: 0 }, t + 0.04, { dur: 0.25 });
          },
        });
        stripX = res.stripX;
        tl.to(br.el, { opacity: 0 }, res.end + 0.3, { dur: 0.4 });

        // ==== line 5: what it kept
        const tSent = T.word(5, "sentences");
        strip.tiles.forEach((tile, i) => {
          const sx = stripX + tile.x;
          if (sx < -200 || sx > 2100) { tl.set(tile.el, { opacity: 0 }, tSent); return; }
          tl.to(tile.el, { opacity: 0, y: 40 }, tSent + (sx / 1920) * 0.4, { dur: 0.35, ease: "in-cubic" });
        });
        const tStory = T.word(5, "story");
        tl.to(leftPage, { scaleX: 0 }, tStory, { dur: 0.3, ease: "in-quad" });
        tl.set(bookCover, { opacity: 1 }, tStory + 0.3);
        tl.to(bookCover, { scaleX: 1 }, tStory + 0.3, { dur: 0.3, ease: "out-quad" });
        tl.to(bookL, { x: 2300 }, T.word(5, "magpie") - 0.2, { dur: 0.8, ease: "in-cubic" });
        const MOS_W = 3 * SW + 2 * GAP, MOS_H = 2 * SH + GAP;
        const FULL = { x: 960 - (MOS_W * 0.365) / 2, y: 445 - (MOS_H * 0.365) / 2, s: 0.365 };
        camTo(FULL, T.word(5, "counts") - 0.2, 0.9);

        // ==== line 6: a row of marks is a row of numbers
        const ROW = { x: 960 - SW * 0.95 / 2, y: 445 - (PAD + ROWH / 2) * 0.95, s: 0.95 };
        camTo(ROW, T.word(6, "row", 1) - 0.1, 0.8);
        tl.to(row0.lit, { opacity: 0.6 }, T.word(6, "row", 3), { dur: 0.3 });
        const countOff = (k, i, j, t0, t1, tNum) => {
          const c = sheets[k].rows[i].cells[j], n = c.strokes.length;
          c.strokes.forEach((s, m) => tl.to(s, { stroke: "#be830e" }, t0 + ((t1 - t0) * m) / n, { dur: 0.05 }));
          tl.to(markGroups[k][i][j], { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" }, tNum - 0.12, { dur: 0.18, ease: "in-quad" });
          tl.fromTo(numerals[k][i][j], { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1 }, tNum, { dur: 0.25, ease: "out-back" });
        };
        const w6 = [T.word(6, "five"), T.word(6, "six"), T.word(6, "four", 1), T.word(6, "four", 2)];
        countOff(0, 0, 0, w6[0] - 0.9, w6[0] - 0.2, w6[0]);
        countOff(0, 0, 1, w6[0] + 0.05, w6[1] - 0.15, w6[1]);
        countOff(0, 0, 2, w6[1] + 0.05, w6[2] - 0.15, w6[2]);
        countOff(0, 0, 3, w6[2] + 0.05, w6[3] - 0.15, w6[3]);
        tl.to(row0.lit, { opacity: 0 }, T.end(6) + 0.1, { dur: 0.4 });
        // pull back as the change ripples down every row of every sheet
        const tRipple = T.end(6) + 0.2;
        camTo(FULL, tRipple, 0.9);
        sheets.forEach((sh, k) => sh.rows.forEach((row, i) => row.cells.forEach((c, j) => {
          if (!c.strokes.length || (k === 0 && i === 0)) return;
          const t = tRipple + 0.3 + (k * ROWS + i) * 0.045 + j * 0.03;
          tl.to(markGroups[k][i][j], { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" }, t, { dur: 0.18, ease: "in-quad" });
          tl.fromTo(numerals[k][i][j], { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1 }, t + 0.1, { dur: 0.25, ease: "out-back" });
        })));

        // ==== line 8: a bigger book: Frankenstein's rows, sheet after sheet
        const FM = FR.model();
        const FL = FR.ledgerLayout(FM, { lines: ROWS });
        const tBig = T.word(8, "bigger");
        // the stack's square of sheets, fitted to the frame's height
        const REG = { x: A.x, y: A.y + 35, h: 700 };
        REG.w = (REG.h * (SW + GAP)) / (SH + GAP);
        const V0 = 6; // sheets across when the five have shrunk to their corner
        const mosScale = (m) => REG.h / (m * (SH + GAP)); // sheet px → stage px for m sheets across
        const CORNER = { x: REG.x, y: REG.y, s: mosScale(V0) };
        camTo(CORNER, tBig, 1.2);
        const fCover = cover(scene, "Frankenstein", { x: 2000, y: A.y + 110, w: 400, h: 540, sub: "Mary Shelley", fence: false });
        fCover.setAttribute("data-layout-allow-overflow", "true");
        const edges = [3, 2, 1].map((k) => {
          const e = K.el("div", { class: "paper", style: { width: "400px", height: "540px", background: k % 2 ? "#e9e9e9" : "#f6f6f6" } }, scene);
          fCover.before(e);
          e.setAttribute("data-layout-allow-overflow", "true");
          K.set(e, { x: 2000 + k * 7, y: A.y + 110 + k * 7 });
          return e;
        });
        const FC = { x: 1460, y: A.y + 110 };
        tl.to([fCover, ...edges], { x: (i) => FC.x + (i ? (4 - i) * 7 : 0) }, tBig + 0.2, { dur: 0.9, ease: "out-cubic" });
        const tFill = T.word(8, "Frankenstein") - 0.1, tFull = T.word(8, "rows") + 0.1;
        const mFill = (t) => Math.exp(K.lerp(Math.log(1), Math.log(Math.sqrt(FL.nSheets)), C.phase(t, tFill, tFull - tFill, "in-out-quad")));
        tl.to(ledL, { opacity: 0 }, tFill + 0.1, { dur: 0.6 });
        const tFold = T.word(9, "But");
        const field = C.canvas(tl, scene, (ctx, t) => {
          if (t < tBig || t > tFold + 1.2) return;
          const m = mFill(t);
          const pairs = t < tFill ? 0 : FR.pairsForSheets(FM, FL, m * m);
          const view = Math.max(V0, Math.ceil(FR.sheetsAt(FM, FL, pairs) ** 0.5), m);
          const s = mosScale(view);
          FR.drawLedger(ctx, FM, FL, { pairs, x: REG.x, y: REG.y, sw: SW * s, gap: GAP * s, ghost: Math.ceil(view) ** 2, alpha: C.phase(t, tBig, 0.6) });
        }, { x: 0, y: 0, w: S.W, h: S.H - S.captionH });
        field.el.setAttribute("data-layout-allow-occlusion", "true");
        K.set(field.el, { opacity: 0 });
        tl.set(field.el, { opacity: 1 }, tBig);
        scene.append(ledL);

        // ==== line 9: the stack folds into the book
        const fs = 400 / REG.w;
        tl.to(field.el, { x: FC.x - REG.x * fs, y: FC.y - REG.y * fs, scale: fs, opacity: 0 }, tFold, { dur: 0.9, ease: "in-out-cubic" });
        const coverRing = frame(scene, { x: FC.x, y: FC.y, w: 400, h: 540 }, 14);
        tl.to(coverRing.el, { opacity: 1 }, tFold + 0.7, { dur: 0.3 });
        tl.to(coverRing.el, { opacity: 0 }, T.word(9, "do") + 0.2, { dur: 0.3 });
        tl.to([fCover, ...edges], { x: "+=700" }, T.word(9, "do") + 0.3, { dur: 0.6, ease: "in-cubic" });

        // ==== line 10: three things catch people out, on a blank sheet
        const tipEntries = [
          { prefix: ["."], followers: MG.rows["."].map(([text, count]) => ({ text, count })) },
          { prefix: ["it"], followers: MG.rows["it"].slice(0, 3).map(([text, count]) => ({ text, count })) },
          { prefix: ["spring"], followers: [] },
          { prefix: ["spring"], followers: [] },
          { prefix: [""], followers: [] },
        ];
        const TP = { x: 160, y: A.y + 20, s: 0.95 };
        const tipL = K.layer(scene, TP.x, TP.y);
        const tip = K.sheet(tipL, tipEntries, D.palette, { w: SW, rowH: ROWH, pad: PAD, header: null, fontSize: 44, prefixW: PREFIXW });
        tip.svg.querySelectorAll("text.ui").forEach((t) => (t.style.fill = "#4a4a4a"));
        K.set(tipL, { scale: TP.s, opacity: 0 });
        const [tDot, tIt, tSpring, tTwice] = tip.rows;
        tip.rows.forEach((row) => {
          K.set(withBox(row.prefixEl), { opacity: 0 });
          row.cells.forEach((c) => { if (c.wordEl) K.set(withBox(c.wordEl), { opacity: 0 }); K.set(c.strokes, { opacity: 0 }); });
        });
        const t10 = T.start(10);
        K.appear(tl, tipL, t10 + 0.1, { y: 30 });
        const write = (els, t) => tl.fromTo(els, { opacity: 0, y: -8 }, { opacity: 1, y: 0 }, t, { dur: 0.3, ease: "out-cubic" });
        // a full stop is a word, and its row says how sentences start
        const tStop = T.word(10, "full");
        write(withBox(tDot.prefixEl), tStop);
        tl.to(tDot.lit, { opacity: 1 }, tStop, { dur: 0.3 });
        const tStart = T.word(10, "sentences");
        tDot.cells.forEach((c, j) => {
          write(withBox(c.wordEl), tStart + j * 0.25);
          drawStrokes(c.strokes, tStart + 0.15 + j * 0.25, 0.25, 0.04);
        });
        tl.to(tDot.lit, { opacity: 0 }, T.word(10, "new", 1) - 0.4, { dur: 0.4 });
        // the next empty box, never skip one: "goes" lands a box too far, the
        // gap flashes, and it slides back
        const tNew = T.word(10, "new", 1);
        write(withBox(tIt.prefixEl), tNew - 0.9);
        [0, 1].forEach((j) => { write(withBox(tIt.cells[j].wordEl), tNew - 0.7 + j * 0.15); drawStrokes(tIt.cells[j].strokes, tNew - 0.6 + j * 0.15, 0.2, 0.03); });
        const goes = tIt.cells[2];
        const skip = BOXW; // one box too far
        tl.fromTo(withBox(goes.wordEl), { opacity: 0, x: skip }, { opacity: 1, x: skip }, tNew + 0.1, { dur: 0.3 });
        const gap = frame(tipL, { x: goes.x, y: PAD + ROWH, w: BOXW, h: ROWH }, 4);
        tl.to(gap.el, { opacity: 1 }, T.word(10, "empty") - 0.1, { dur: 0.15 });
        tl.to(gap.el, { opacity: 0.2 }, T.word(10, "empty") + 0.15, { dur: 0.15 });
        tl.to(gap.el, { opacity: 1 }, T.word(10, "empty") + 0.35, { dur: 0.15 });
        tl.to(withBox(goes.wordEl), { x: 0 }, T.word(10, "skip") - 0.1, { dur: 0.5, ease: "in-out-cubic" });
        tl.to(gap.el, { opacity: 0 }, T.word(10, "one", 1) + 0.2, { dur: 0.3 });
        drawStrokes(goes.strokes, T.word(10, "one", 1) + 0.1, 0.25, 0.04);
        // say a new word out loud when you start its row: nobody starts it twice
        const tLoud = T.word(10, "loud");
        write(withBox(tSpring.prefixEl), T.word(10, "new", 2));
        const bub = K.layer(scene, 0, 0);
        const bubBox = K.el("div", { class: "paper", text: "spring!", style: { width: "230px", height: "96px", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--font-tok)", fontStyle: "italic", fontSize: "44px", color: "var(--ink)" } }, bub);
        K.el("div", { style: { position: "absolute", left: "-16px", top: "32px", width: "0", height: "0", borderTop: "16px solid transparent", borderBottom: "16px solid transparent", borderRight: "18px solid var(--paper)" } }, bub);
        const sp0 = onStage(0, 0, { x: TP.x, y: TP.y, s: TP.s });
        // beside the new row's word, as if said across the table
        K.set(bub, { x: sp0.x + (PREFIXW + 30) * TP.s, y: sp0.y + (PAD + 2.5 * ROWH) * TP.s - 48, opacity: 0 });
        tl.to(bub, { opacity: 1 }, tLoud - 0.1, { dur: 0.25 });
        tl.to(bub, { opacity: 0 }, T.word(10, "so") , { dur: 0.3 });
        // the second, identical row starts, then wipes away
        const dup = withBox(tTwice.prefixEl);
        K.set(tTwice.prefixEl, { transformOrigin: "0 50%" });
        tl.fromTo(dup, { opacity: 0 }, { opacity: 0.8 }, T.word(10, "nobody"), { dur: 0.3 });
        tl.to(tTwice.lit, { opacity: 1 }, T.word(10, "starts"), { dur: 0.2 });
        tl.to(dup, { opacity: 0, x: -30 }, T.word(10, "twice"), { dur: 0.4, ease: "in-cubic" });
        tl.to(tTwice.lit, { opacity: 0 }, T.word(10, "twice") + 0.2, { dur: 0.3 });

        // ==== line 11: reader, grab the text; two words at a time
        const t11 = T.start(11);
        tl.to(tipL, { opacity: 0, x: TP.x - 200 }, t11 - 0.3, { dur: 0.5, ease: "in-cubic" });
        const endCover = cover(scene, "The magpie", { x: 180, y: A.y + 80, w: 460, h: 566 });
        const endTiles = K.tiles(scene, ["the", "magpie", "is", "back", "."], { ...TS, x: 780, y: A.y + 250 });
        const endBr = bracket(scene, { h: endTiles.size });
        const eb = pairBox(endTiles, 0);
        bracketSet(tl, endBr, { ...eb, x: 780 + eb.x, y: A.y + 250 }, 0);
        K.set([endCover, endTiles.el], { opacity: 0 });
        K.appear(tl, endCover, T.word(11, "grab") - 0.2, { y: 24 });
        K.appear(tl, endTiles.el, T.word(11, "text") - 0.1, { y: 16 });
        tl.to(endBr.el, { opacity: 1 }, T.word(11, "Two"), { dur: 0.3 });
      };
      KIT.ready(build).then(({ tl }) => {
        window.__timelines["training-ledger"] = tl;
      });
    </script>
  </body>
</html>
