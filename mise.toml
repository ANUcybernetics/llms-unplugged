[tools]
node = "24"
pnpm = "latest"
# components/targets declared so a fresh install (CI's mise-action) gets
# everything cli.yml needs; a bare version string installs neither
rust = { version = "1.97.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
typst = "0.15.0"
typstyle = "0.14.4"
jq = "1.8.1"
# the cutouts-print task also needs qpdf (not in the mise registry):
# apt install qpdf

[tasks]
test = { run = "cargo test", dir = "cli" }
build = { run = "cargo build", dir = "cli" }
check = { run = "cargo check", dir = "cli" }
fmt = { run = "cargo fmt", dir = "cli" }
clippy = { run = "cargo clippy", dir = "cli" }

[tasks.wasm-build]
description = "Rebuild the committed wasm bundle (website/src/wasm-pkg) from cli/src. Run after any Rust change that affects the wasm feature; website/test/wasmPkg.test.ts asserts the committed bundle still matches the Rust behaviour."
run = '''
#!/usr/bin/env bash
set -euo pipefail

# wasm-pack is version-pinned because it bundles wasm-opt, whose version
# changes the emitted bytes --- a floating version would churn the committed
# .wasm on every rebuild.
(cd cli && pnpm dlx wasm-pack@0.15.0 build --target web \
  --out-dir ../website/src/wasm-pkg --no-default-features --features wasm)

# wasm-pack clobbers the out-dir .gitignore with "*"; restore the documented one.
cat > website/src/wasm-pkg/.gitignore << 'GITIGNORE'
# wasm-bindgen output - rebuild with:
#   mise run wasm-build
# These files are checked in so CI can bundle them in the website build.
# website/test/wasmPkg.test.ts asserts the committed bundle matches the
# current Rust behaviour via the shared tokenisation fixture.
GITIGNORE

echo "Rebuilt website/src/wasm-pkg"
'''

[tasks.cutouts-print]
description = "Build a printable duplex cutouts PDF (rotates even pages 180° so long-edge binding works). Usage: mise run cutouts-print <input> [--pages N] [<cli-args>...]"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -lt 1 ]]; then
  echo "usage: mise run cutouts-print <input> [--pages N] [<cli-args>...]" >&2
  exit 1
fi

input="$1"; shift
pages=""
cli_args=()
while [[ $# -gt 0 ]]; do
  case "$1" in
    --pages) pages="$2"; shift 2 ;;
    --pages=*) pages="${1#--pages=}"; shift ;;
    *) cli_args+=("$1"); shift ;;
  esac
done

n=2
expect_n=0
for arg in ${cli_args[@]+"${cli_args[@]}"}; do
  if [[ $expect_n == 1 ]]; then
    n="$arg"
    expect_n=0
    continue
  fi
  case "$arg" in
    -n|--n) expect_n=1 ;;
    -n=*|--n=*) n="${arg#*=}" ;;
  esac
done
case "$n" in
  2) ngram="bigram" ;;
  3) ngram="trigram" ;;
  *) ngram="${n}gram" ;;
esac

if [[ ! -f "$input" ]]; then
  for cand in "data/$input" "data/${input}.txt"; do
    if [[ -f "$cand" ]]; then input="$cand"; break; fi
  done
fi
if [[ ! -f "$input" ]]; then
  echo "Input file not found: $input" >&2
  exit 1
fi

base="$(basename "$input" .txt)"
work_dir="cli/out/cutouts-print/${base}-${ngram}"
out_dir="cli/out/cutouts-print"
mkdir -p "$work_dir"

(cd cli && cargo build --release --quiet)

cli/target/release/llms_unplugged cutouts \
  --input "$input" \
  --output "$work_dir" \
  --duplex \
  ${cli_args[@]+"${cli_args[@]}"}

raw="$work_dir/cutouts.pdf"
final="$out_dir/${base}-${ngram}-print.pdf"

if [[ -n "$pages" ]]; then
  trunc="$work_dir/truncated.pdf"
  qpdf "$raw" --pages . "1-$pages" -- "$trunc"
  qpdf "$trunc" --rotate=180:1-z:even "$final"
  rm "$trunc"
else
  qpdf "$raw" --rotate=180:1-z:even "$final"
fi

echo "Wrote $final"
'''
