[package]
name = "llms_unplugged"
version = "1.4.7"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Ben Swift <ben@benswift.me>"]
description = "CLI tool for generating N-gram language model booklets"
repository = "https://github.com/ANUcybernetics/llms-unplugged"
homepage = "https://www.llmsunplugged.org"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:clap", "rand/thread_rng"]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
# default-features disabled so the wasm build does not pull getrandom (only the
# CLI needs thread-local entropy via rand::rng(), enabled by the `cli` feature).
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = "0.10"
# Toneless pinyin romanisation, used to order Chinese vocabulary in the
# booklets the way a Chinese dictionary does. Pure lookup tables, so it builds
# for the wasm target the tools page uses as well as the native CLI.
pinyin = "0.10"
# Chinese word segmentation for word-level (rather than per-character) CJK
# tokenisation. The default dictionary is embedded, so the native CLI and the
# wasm build the tools page loads share exactly one segmenter and dictionary.
jieba-rs = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Counts to f64 for entropy and dice scaling; the precision loss is the point.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"

# lto + one codegen unit shrink the wasm bundle the website ships (and the
# native binary) noticeably; the build is small enough that the extra time
# doesn't matter.
[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "llms_unplugged"
path = "src/main.rs"
required-features = ["cli"]
