[package]
name = "llms_unplugged"
version = "1.4.7"
edition = "2024"
license = "MIT"
authors = ["Ben Swift <ben@benswift.me>"]
description = "CLI tool for generating N-gram language model booklets"
repository = "https://github.com/ANUcybernetics/llms-unplugged"
homepage = "https://www.llmsunplugged.org"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:clap", "rand/thread_rng"]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
# default-features disabled so the wasm build does not pull getrandom (only the
# CLI needs thread-local entropy via rand::rng(), enabled by the `cli` feature).
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = "0.10"
# Toneless pinyin romanisation, used to order Chinese vocabulary in the
# booklets the way a Chinese dictionary does. Pure lookup tables, so it builds
# for the wasm target the tools page uses as well as the native CLI.
pinyin = "0.10"
# Chinese word segmentation for word-level (rather than per-character) CJK
# tokenisation. The default dictionary is embedded, so the native CLI and the
# wasm build the tools page loads share exactly one segmenter and dictionary.
jieba-rs = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "llms_unplugged"
path = "src/main.rs"
required-features = ["cli"]
