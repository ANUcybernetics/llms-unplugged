[package]
name = "llms_unplugged"
version = "1.4.7"
edition = "2024"
license = "MIT"
authors = ["Ben Swift <ben@benswift.me>"]
description = "CLI tool for generating N-gram language model booklets"
repository = "https://github.com/ANUcybernetics/llms-unplugged"
homepage = "https://www.llmsunplugged.org"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "llms_unplugged"
path = "src/main.rs"
required-features = ["cli"]
