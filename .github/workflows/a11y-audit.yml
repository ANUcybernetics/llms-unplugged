name: A11y Audit

# The accessibility scan (axe + JSDOM over every built page) takes ~8 min, so it
# is kept out of the every-push deploy (see website/astro.config.ts). It runs
# here instead — weekly and on demand. A failed run means new accessibility
# violations have landed on main; the build throws on any violation.
on:
  schedule:
    # Mondays 19:00 UTC — early Tuesday in Canberra. GitHub cron is always UTC.
    - cron: "0 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node + pnpm come from the repo-root mise.toml (see deploy-website.yml)
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Cache Astro image transforms
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-images-${{ hashFiles('website/src/assets/**', 'website/src/decks/assets/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-images-

      - name: Build with accessibility scan
        working-directory: website
        run: pnpm run build:a11y
