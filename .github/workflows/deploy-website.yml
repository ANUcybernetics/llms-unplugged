name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node + pnpm come from the repo-root mise.toml, so CI resolves the same
      # versions as local dev (pnpm = "latest"; package.json declares a floor
      # via engines.pnpm rather than a packageManager pin).
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      # Image transforms (avif encodes especially) dominate cold build time;
      # the cache keeps rebuilds warm so only changed images re-encode.
      - name: Cache Astro image transforms
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-images-${{ hashFiles('website/src/assets/**', 'website/src/decks/assets/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-images-

      # The accessibility scan is deliberately not run here (it adds ~8 min and
      # doesn't change the output) — see the weekly a11y-audit workflow.
      - name: Build
        working-directory: website
        run: pnpm run build

      # typecheck + lint + format:check + test (build.test reuses dist/)
      - name: Check
        working-directory: website
        run: pnpm run check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
