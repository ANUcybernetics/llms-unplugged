name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'mise.toml'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'mise.toml'
  workflow_dispatch:

jobs:
  test:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust + typst come from the repo-root mise.toml (which also declares
      # the rustfmt/clippy components and the wasm target), so CI compiles
      # with the same pinned toolchain as local dev rather than a floating
      # stable.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust typst

      # The two end-to-end PDF tests skip themselves when typst isn't on PATH,
      # so a soft install failure would leave the whole PDF pipeline untested
      # under a green tick. Fail here instead, where it is legible.
      - name: Verify Typst is on PATH
        run: typst --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run tests (all features)
        run: cargo test --manifest-path cli/Cargo.toml --all-features

      - name: Check wasm target
        run: cargo check --manifest-path cli/Cargo.toml --no-default-features --features wasm --target wasm32-unknown-unknown
