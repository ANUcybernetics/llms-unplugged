<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>typst.ts Browser Compilation PoC</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .status {
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    .status.loading {
      background: #fff3cd;
      border: 1px solid #ffc107;
    }
    .status.success {
      background: #d4edda;
      border: 1px solid #28a745;
    }
    .status.error {
      background: #f8d7da;
      border: 1px solid #dc3545;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button:hover {
      background: #0056b3;
    }
    button:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    .controls {
      margin: 1rem 0;
    }
    #preview {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      min-height: 200px;
    }
    #preview svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>typst.ts browser compilation proof-of-concept</h1>

  <p>This page demonstrates compiling Typst documents in the browser using <a href="https://github.com/Myriad-Dreamin/typst.ts">typst.ts</a>.</p>

  <div class="controls">
    <button id="initBtn" onclick="initCompiler()">1. Initialise compiler</button>
    <button id="loadFontsBtn" onclick="loadFonts()" disabled>2. Load fonts</button>
    <button id="compileBtn" onclick="compileDocument()" disabled>3. Compile to SVG</button>
    <button id="pdfBtn" onclick="compileToPdf()" disabled>4. Download PDF</button>
  </div>

  <div id="status" class="status loading">Ready to start...</div>

  <div id="preview">
    <p style="color: #666;">Preview will appear here after compilation.</p>
  </div>

  <!-- Load typst.ts from CDN -->
  <script type="module">
    // Import the all-in-one bundle
    import { $typst } from 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst.ts@0.5.3/dist/esm/contrib/all-in-one-lite.bundle.js';

    // Make $typst available globally
    window.$typst = $typst;

    // Status logging
    window.log = function(message, isError = false) {
      const status = document.getElementById('status');
      const timestamp = new Date().toLocaleTimeString();
      status.textContent += `\n[${timestamp}] ${message}`;
      status.scrollTop = status.scrollHeight;
      if (isError) {
        status.className = 'status error';
      }
    };

    // Hardcoded small model for testing (subset of Green Eggs and Ham bigram)
    window.modelJson = {
      "data": [
        [".", 99, ["I", 44], ["not", 58], ["and", 70]],
        ["I", 99, ["do", 40], ["am", 59], ["will", 78], ["would", 94]],
        ["am", 99, [".", 62], ["Sam", 99]],
        ["Sam", 99, ["I", 73], [".", 99]],
        ["do", 99, ["not", 94], ["I", 99]],
        ["not", 99, ["like", 42], [",", 60], ["in", 78], ["eat", 99]],
        ["like", 99, ["them", 77], ["green", 99]],
        ["them", 99, ["in", 23], ["with", 41], [",", 57], ["here", 73], ["anywhere", 99]],
        ["green", 99, ["eggs", 99]],
        ["eggs", 99, ["and", 99]],
        ["and", 99, ["ham", 42], ["I", 99]],
        ["ham", 99, [".", 54], ["I", 99]]
      ],
      "metadata": {
        "author": "Dr Seuss",
        "n": 2,
        "title": "Green Eggs and Ham",
        "url": "https://example.com",
        "version": "1.0.0"
      }
    };

    // SVG logo as a string (simplified SOCY logo)
    window.socyLogoSvg = `<?xml version="1.0" encoding="iso-8859-1"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<polygon style="fill:#000000;" points="600.362,274.305 362.804,274.305 530.783,106.326 494.205,69.749 326.227,237.728
  326.227,0.169 274.498,0.169 274.498,274.305 0.362,274.305 0.362,326.033 237.921,326.033 69.942,494.013 106.519,530.591
  274.498,362.612 274.498,600.17 326.227,600.17 326.227,326.033 600.362,326.033 "/>
</svg>`;

    // Simplified book template that doesn't require external packages
    window.bookTemplate = `
// Simplified book template for browser PoC
#let paper_size = sys.inputs.at("paper_size", default: "a4")
#let font_size = sys.inputs.at("font_size", default: "10pt")
#let num_columns = sys.inputs.at("columns", default: "2")
#let json_path = sys.inputs.at("json_path", default: "model.json")

#set text(font: "Libertinus Serif", size: eval(font_size))
#set page(
  paper: paper_size,
  margin: (inside: 2.4cm, outside: 1.5cm, top: 3cm, bottom: 2cm),
)

#let json_data = json(json_path)
#let data = json_data.data
#let doc_metadata = json_data.metadata

#let model-type(n) = {
  if n == 1 { "unigram" }
  else if n == 2 { "bigram" }
  else if n == 3 { "trigram" }
  else { str(n) + "-gram" }
}

#set document(
  title: doc_metadata.title,
  author: (doc_metadata.author, "Ben Swift"),
)

#let punct-box(content, baseline: -0.2em) = box(
  rect(
    fill: none,
    stroke: 0.25pt + black,
    radius: 1pt,
    inset: (x: 0.1em, y: 0pt),
    outset: (y: 0pt),
    text(content, weight: "bold", baseline: baseline),
  ),
)

#let display-with-punctuation(text-content, size: 1.5em, weight: "bold") = {
  let parts = text-content.split(" ")
  for (i, part) in parts.enumerate() {
    if part == "." or part == "," {
      let styled-punct = text(part, size: size, weight: weight, baseline: -0.2em)
      box(rect(fill: none, stroke: 0.25pt + black, radius: 1pt, inset: (x: 0.1em, y: 0pt), outset: (y: 0pt), styled-punct))
    } else if part == "—" {
      text(" — ", size: size, weight: weight)
    } else {
      text(part, size: size, weight: weight)
    }
    if i < parts.len() - 1 and parts.at(i + 1) != "—" and part != "—" { h(0.3em) }
  }
}

#let format-dice-indicator(total_count, num_followers) = {
  if num_followers > 1 and total_count != 10 {
    let num-dice = str(total_count).len()
    text(baseline: -0.1em, size: 0.9em, fill: black, "♦" * num-dice)
  }
}

#let format-follower(word, count, show-count: true) = {
  if word == "." or word == "," {
    if show-count { box([#text(weight: "semibold")[#count]|#punct-box(word)]) }
    else { punct-box(word) }
  } else {
    if show-count { box([#text(weight: "semibold")[#count]|#text[#word]]) }
    else { box([#word]) }
  }
}

#let format-followers(followers) = {
  for follower in followers {
    let word = follower.at(0)
    let count = follower.at(1)
    let show-count = followers.len() > 1
    format-follower(word, count, show-count: show-count)
    h(0.5em)
  }
}

#let format-entry(prefix, total_count, followers) = {
  display-with-punctuation(prefix, size: 1.5em, weight: "bold")
  h(0.2em)
  format-dice-indicator(total_count, followers.len())
  h(0.6em)
  format-followers(followers)
}

// Title page
#place(top + left)[#image("socy-logo-bw.svg", width: 1.8cm)]
#align(center + horizon)[
  #v(2cm)
  #text(font: "Libertinus Sans", weight: "bold", size: 3em)[#doc_metadata.title]
  #v(1cm)
  #text(font: "Libertinus Sans", size: 1.5em)[A #model-type(doc_metadata.n) language model]
]
#place(bottom + right)[
  #text(font: "IBM Plex Mono", size: 14pt)[Cybernetic\\ Studio]
]
#pagebreak()

// Copyright page
#set text(size: 11pt)
#align(horizon)[
  #text(size: 1.2em, style: "italic")[#doc_metadata.title] by #doc_metadata.author
  #v(0.5cm)
  © 2025 Ben Swift
  #v(0.5cm)
  This work is licensed under CC BY-NC-SA 4.0.
  #v(0.5cm)
  Published by Cybernetic Studio Press
]
#pagebreak()

// Main content
#set page(columns: int(num_columns), numbering: "1")

#for (i, item) in data.enumerate() {
  let prefix = item.at(0)
  let total_count = item.at(1)
  let followers = item.slice(2)
  format-entry(prefix, total_count, followers)
  v(0.1em)
}
`;

    log('typst.ts module loaded successfully');
  </script>

  <script>
    // Font URLs from Fontsource CDN
    const FONT_URLS = {
      'Libertinus Serif': [
        'https://cdn.jsdelivr.net/fontsource/fonts/libertinus-serif@latest/latin-400-normal.woff2',
        'https://cdn.jsdelivr.net/fontsource/fonts/libertinus-serif@latest/latin-700-normal.woff2',
        'https://cdn.jsdelivr.net/fontsource/fonts/libertinus-serif@latest/latin-400-italic.woff2',
      ],
      'Libertinus Sans': [
        'https://cdn.jsdelivr.net/fontsource/fonts/libertinus-sans@latest/latin-400-normal.woff2',
        'https://cdn.jsdelivr.net/fontsource/fonts/libertinus-sans@latest/latin-700-normal.woff2',
      ],
      'IBM Plex Mono': [
        'https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-400-normal.woff2',
        'https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-700-normal.woff2',
      ],
    };

    async function initCompiler() {
      const status = document.getElementById('status');
      status.className = 'status loading';
      status.textContent = 'Initialising typst.ts compiler...';

      try {
        // Configure the compiler with WASM module paths
        window.$typst.setCompilerInitOptions({
          getModule: () =>
            'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@0.5.3/pkg/typst_ts_web_compiler_bg.wasm',
        });

        window.$typst.setRendererInitOptions({
          getModule: () =>
            'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@0.5.3/pkg/typst_ts_renderer_bg.wasm',
        });

        log('Compiler options configured');
        log('Waiting for WASM modules to load...');

        // The modules will be loaded on first use
        document.getElementById('initBtn').disabled = true;
        document.getElementById('loadFontsBtn').disabled = false;
        status.className = 'status success';
        log('Compiler initialised successfully!');
      } catch (error) {
        log('Error initialising compiler: ' + error.message, true);
      }
    }

    async function loadFonts() {
      const status = document.getElementById('status');
      status.className = 'status loading';
      log('Loading fonts from CDN...');

      try {
        for (const [fontFamily, urls] of Object.entries(FONT_URLS)) {
          for (const url of urls) {
            log(`Loading ${fontFamily} from ${url.split('/').pop()}...`);
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Failed to fetch ${url}: ${response.status}`);
            }
            const fontData = await response.arrayBuffer();

            // Extract filename for the path
            const filename = url.split('/').pop();
            const fontPath = `/fonts/${filename}`;

            // Add font to the compiler's virtual filesystem
            window.$typst.mapShadow(fontPath, new Uint8Array(fontData));
            log(`  Added ${filename} to virtual filesystem`);
          }
        }

        // Add the model JSON
        log('Adding model.json to virtual filesystem...');
        const modelJsonStr = JSON.stringify(window.modelJson);
        await window.$typst.addSource('/model.json', modelJsonStr);

        // Add the SVG logo
        log('Adding socy-logo-bw.svg to virtual filesystem...');
        const svgEncoder = new TextEncoder();
        window.$typst.mapShadow('/socy-logo-bw.svg', svgEncoder.encode(window.socyLogoSvg));

        // Add the template
        log('Adding book template...');
        await window.$typst.addSource('/main.typ', window.bookTemplate);

        document.getElementById('loadFontsBtn').disabled = true;
        document.getElementById('compileBtn').disabled = false;
        document.getElementById('pdfBtn').disabled = false;
        status.className = 'status success';
        log('All resources loaded successfully!');
      } catch (error) {
        log('Error loading fonts: ' + error.message, true);
        console.error(error);
      }
    }

    async function compileDocument() {
      const status = document.getElementById('status');
      const preview = document.getElementById('preview');
      status.className = 'status loading';
      log('Compiling document to SVG...');

      try {
        const svg = await window.$typst.svg({
          mainFilePath: '/main.typ',
        });

        preview.innerHTML = svg;
        status.className = 'status success';
        log('SVG compilation successful!');
      } catch (error) {
        log('Compilation error: ' + error.message, true);
        console.error(error);
      }
    }

    async function compileToPdf() {
      const status = document.getElementById('status');
      status.className = 'status loading';
      log('Compiling document to PDF...');

      try {
        const pdfData = await window.$typst.pdf({
          mainFilePath: '/main.typ',
        });

        // Create download link
        const blob = new Blob([pdfData], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ngram-model.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        status.className = 'status success';
        log('PDF generated and download started!');
      } catch (error) {
        log('PDF compilation error: ' + error.message, true);
        console.error(error);
      }
    }
  </script>
</body>
</html>
