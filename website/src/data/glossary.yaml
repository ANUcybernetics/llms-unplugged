- id: token
  term: Token
  category: core
  description: >-
    A single unit of text that the model works with. In our activities, each word
    and punctuation mark is a token. Modern LLMs use subword tokens that can be
    parts of words.
  synonyms:
    - word (in introductory contexts)
  note: >-
    The lessons use "word" initially to keep things accessible, then transition
    to "token" once the concept is established. Both terms refer to the same
    thing in our activities.
  see:
    - label: Training
      href: /lessons/training

- id: vocabulary
  term: Vocabulary
  category: core
  description: >-
    All the unique tokens your model knows. The words across the top and side of
    your grid (or the cutouts' prefix labels) form your vocabulary.
  see:
    - label: Training
      href: /lessons/training

- id: language-model
  term: Language model
  category: core
  description: >-
    A system that predicts what text comes next based on patterns learned from
    training data. Your hand-built grid or cutouts spread is a language model.
  see:
    - label: Training
      href: /lessons/training
    - label: Generation
      href: /lessons/generation

- id: training
  term: Training
  category: core
  description: >-
    The process of building a model by counting patterns in text. When you tally
    word transitions or spread cutouts on a table, you're training your model.
  synonyms:
    - learning
  see:
    - label: Training
      href: /lessons/training

- id: pre-training
  term: Pre-training
  category: core
  description: >-
    The initial, expensive training phase where a model learns general patterns
    from a large corpus. Most users of modern LLMs use pre-trained models
    without ever training one themselves, much like using a provided booklet
    rather than building your own grid.
  related:
    - post-training
    - training
  see:
    - label: Pre-trained Model Generation
      href: /lessons/pretrained-generation

- id: generation
  term: Generation
  category: core
  description: >-
    Using a trained model to produce new text by repeatedly predicting and
    selecting the next token.
  see:
    - label: Generation
      href: /lessons/generation

- id: inference
  term: Inference
  category: core
  description: >-
    Using a trained model to produce outputs. In language models, inference
    means generating text. These lessons say "generation" because that better
    describes what language models do, but "inference" is the term you'll find
    in AI/ML literature and tooling.
  synonyms:
    - decoding
  see:
    - label: Generation
      href: /lessons/generation

- id: probability-distribution
  term: Probability distribution
  category: core
  description: >-
    A set of options with associated likelihoods. In your model, the counts in a
    row (or matching cutouts in the spread) form a probability distribution over possible
    next words.
  see:
    - label: Generation
      href: /lessons/generation
    - label: Sampling
      href: /lessons/sampling

- id: prompt
  term: Prompt
  category: core
  description: >-
    The input text you give to a language model. In a bigram model, the
    "prompt" is just the single current word used to predict what comes next.
    In modern LLMs, a prompt can be hundreds of thousands or even millions of
    tokens long, giving the model much more context to work with.
  see:
    - label: Generation
      href: /lessons/generation

- id: llm
  term: LLM (Large Language Model)
  category: core
  description: >-
    A language model trained on a very large amount of text, with billions of
    parameters. The hand-built models in these lessons are tiny language
    models; ChatGPT, Claude, and Gemini are large language models. The core
    principles are identical---the difference is scale.
  see:
    - label: Training
      href: /lessons/training

- id: training-data
  term: Training data
  category: core
  description: >-
    The collection of text used to train a model. In our activities, this is
    the passage you read through to fill in your grid or spread out as cutouts. Modern LLMs
    are trained on billions of pages of text from books, websites, and other
    sources.
  synonyms:
    - training set
    - corpus (plural corpora)
  see:
    - label: Training
      href: /lessons/training

- id: start-end-tokens
  term: Start and end tokens
  category: core
  description: >-
    Special tokens that mark the beginning and end of a text. Real LLMs use
    these to know when to start and stop generating. The lessons in this
    project don't include them explicitly---you just pick a starting word and
    decide when to stop---but they're an important part of how real models
    handle sentence and document boundaries.

- id: chatgpt
  term: ChatGPT
  category: core
  description: >-
    OpenAI's chatbot, and probably the most well-known LLM product. On this site
    we often use "ChatGPT" as shorthand for any modern LLM chatbot---the
    concepts apply equally to Claude, Gemini, DeepSeek and others. The
    underlying principles are the same regardless of which product you use.

- id: claude
  term: Claude
  category: core
  description: >-
    Anthropic's LLM chatbot. The concepts on this site apply equally to Claude,
    ChatGPT, Gemini, and other LLMs---the underlying principles are the same
    regardless of which product you use.

- id: gemini
  term: Gemini
  category: core
  description: >-
    Google's LLM chatbot. The concepts on this site apply equally to Gemini,
    ChatGPT, Claude, and other LLMs---the underlying principles are the same
    regardless of which product you use.

- id: bigram-model
  term: Bigram model
  category: model-types
  description: >-
    A model that predicts the next word based on one previous word. This is what
    you build in the fundamental lessons---each row of your grid represents what
    can follow a single word.
  synonyms:
    - 2-gram model
  see:
    - label: Training
      href: /lessons/training
    - label: Generation
      href: /lessons/generation

- id: trigram-model
  term: Trigram model
  category: model-types
  description: >-
    A model that uses two previous words for prediction, capturing more context
    than a bigram. The grid becomes three-dimensional (or you track word pairs
    instead of single words).
  synonyms:
    - 3-gram model
  see:
    - label: More Context
      href: /lessons/more-context

- id: n-gram-model
  term: N-gram model
  category: model-types
  description: >-
    The general term for models that predict based on the previous n-1 words.
    Bigrams are 2-grams, trigrams are 3-grams, and so on.
  see:
    - label: Training
      href: /lessons/training
    - label: More Context
      href: /lessons/more-context

- id: context-window
  term: Context window
  category: model-types
  description: >-
    How many previous tokens the model considers when making predictions. Bigrams
    have a context window of 1, trigrams have 2, and modern LLMs can consider
    hundreds of thousands or even millions of tokens.
  see:
    - label: More Context
      href: /lessons/more-context
    - label: In-context Memory
      href: /lessons/in-context-memory

- id: weighted-random-sampling
  term: Weighted random sampling
  category: sampling
  description: >-
    Choosing the next token with probability proportional to its frequency. Your
    dice rolls implement this---words with higher counts are more likely to be
    selected.
  see:
    - label: Generation
      href: /lessons/generation
    - label: Weighted Randomness
      href: /lessons/weighted-randomness

- id: decoding-strategy
  term: Decoding strategy
  category: sampling
  description: >-
    The procedure used to turn a model's probability distribution into actual
    output text. Greedy decoding picks the highest-probability word; sampling
    rolls weighted dice; beam search tracks several candidate paths at once.
  synonyms:
    - sampling strategy
  see:
    - label: Generation
      href: /lessons/generation
    - label: Sampling
      href: /lessons/sampling
    - label: Beam Search
      href: /lessons/beam-search

- id: temperature
  term: Temperature
  category: sampling
  description: >-
    A parameter controlling randomness in generation. Dividing counts by
    temperature makes output more random (high temperature) or more predictable
    (low temperature).
  see:
    - label: Sampling
      href: /lessons/sampling

- id: greedy-sampling
  term: Greedy sampling
  category: sampling
  description: >-
    Always choosing the most likely next word (equivalent to temperature
    approaching zero). Produces predictable but often repetitive text.
  synonyms:
    - greedy decoding
  see:
    - label: Sampling
      href: /lessons/sampling

- id: beam-search
  term: Beam search
  category: sampling
  description: >-
    A generation strategy that tracks multiple possible sequences simultaneously,
    choosing the best overall path rather than committing to one word at a time.
  see:
    - label: Beam Search
      href: /lessons/beam-search

- id: beam-width
  term: Beam width
  category: sampling
  description: >-
    How many candidate paths to track during beam search. Beam width 1 is
    equivalent to greedy search; larger widths explore more possibilities.
  see:
    - label: Beam Search
      href: /lessons/beam-search

- id: truncation-strategy
  term: Truncation strategy
  category: sampling
  description: >-
    A rule that limits which tokens are eligible for selection before sampling.
    Examples include top-k (only consider the k most likely) and top-p/nucleus
    (only consider tokens until cumulative probability reaches p).
  see:
    - label: Sampling
      href: /lessons/sampling

- id: top-k-sampling
  term: Top-k sampling
  category: sampling
  description: >-
    A truncation strategy that keeps only the k most likely next-word options
    before sampling. Setting k=1 is equivalent to greedy sampling; larger k
    allows more variety while still excluding very unlikely words.
  see:
    - label: Sampling
      href: /lessons/sampling

- id: top-p-sampling
  term: Top-p sampling
  category: sampling
  description: >-
    A truncation strategy that keeps just enough of the most likely options for
    their cumulative probability to reach a threshold p (e.g., 0.9). Unlike
    top-k, the number of options changes depending on how confident the model
    is about the next word.
  synonyms:
    - nucleus sampling
  see:
    - label: Sampling
      href: /lessons/sampling

- id: embedding
  term: Embedding
  category: understanding
  description: >-
    A numerical representation of a word. Each row in your bigram grid is that
    word's embedding vector---a fingerprint of its usage context. In real LLMs,
    embeddings are learned separately rather than derived from raw counts, but
    the principle is the same: words used in similar ways get similar vectors.
  synonyms:
    - word vector
    - embedding vector
  see:
    - label: Word Embeddings
      href: /lessons/word-embeddings

- id: similarity-matrix
  term: Similarity matrix
  category: understanding
  description: >-
    A grid showing how similar or different each pair of words is, calculated by
    comparing their embedding vectors. Words used in similar contexts have
    similar embeddings.
  synonyms:
    - distance matrix
    - distance grid
  see:
    - label: Word Embeddings
      href: /lessons/word-embeddings

- id: attention-mechanism
  term: Attention mechanism
  category: understanding
  description: >-
    The ability to focus on relevant previous words when making predictions.
    In real LLMs, attention is learned, weighted, and dynamic---the model
    decides what to focus on for each prediction. The in-context memory and
    induction-head lessons illustrate the motivation for attention: reusing more
    than just the immediately preceding word.
  see:
    - label: In-context Memory
      href: /lessons/in-context-memory
    - label: Induction Heads
      href: /lessons/induction-heads

- id: in-context-learning
  term: In-context learning
  category: understanding
  description: >-
    Picking up a pattern from the prompt and continuing it, with no change to
    the model's weights. The "learning" happens in the context the model is
    given, not in the model itself---which is why a few examples in a prompt can
    steer an LLM's output.
  see:
    - label: In-context Memory
      href: /lessons/in-context-memory
    - label: Induction Heads
      href: /lessons/induction-heads

- id: induction-head
  term: Induction head
  category: understanding
  description: >-
    A circuit found inside transformers that completes patterns by finding an
    earlier place where the current token appeared and copying what came next.
    Induction heads are a key mechanism behind in-context learning.
  see:
    - label: Induction Heads
      href: /lessons/induction-heads

- id: markov-chain
  term: Markov chain
  category: advanced
  description: >-
    A statistical model where the next state depends only on the current state.
    Andrey Markov introduced this idea in 1913 while analysing letter sequences
    in Pushkin's Eugene Onegin. A bigram language model is a simple Markov chain
    over words.

- id: neural-network
  term: Neural network
  category: advanced
  description: >-
    A computational system loosely inspired by biological neurons that learns
    patterns from data by adjusting numerical weights. Modern LLMs are large
    neural networks; hand-built models are not. Both rely on the same kind of
    pattern counting, just acquired manually rather than automatically.

- id: transformer
  term: Transformer
  category: advanced
  description: >-
    The neural network architecture used by GPT, Claude, and other modern LLMs.
    It uses attention mechanisms to process all words in parallel rather than
    sequentially.

- id: parameters
  term: Parameters
  category: advanced
  description: >-
    The numbers stored in the model that encode learned patterns. Each tally mark
    in your grid is a parameter. Modern models have billions of parameters.
  see:
    - label: Training
      href: /lessons/training

- id: fine-tuning
  term: Fine-tuning
  category: advanced
  description: >-
    Additional training on specific text to adapt a model for a particular domain
    or task. Like adding more tallies to your grid from a new text source.
  related:
    - supervised-fine-tuning
    - post-training
    - lora
    - base-model
  see:
    - label: LoRA
      href: /lessons/lora
    - label: Synthetic Data
      href: /lessons/synthetic-data

- id: base-model
  term: Base model
  category: advanced
  description: >-
    The original trained model that an adaptation (such as a LoRA layer) is
    applied to. The base model stays unchanged; the adaptation provides the
    domain-specific shift.
  see:
    - label: LoRA
      href: /lessons/lora

- id: lora
  term: LoRA (Low-Rank Adaptation)
  category: advanced
  description: >-
    A technique for efficiently fine-tuning models by training a small
    "adaptation layer" rather than modifying all the original parameters.
  see:
    - label: LoRA
      href: /lessons/lora

- id: agentic-tool-use
  term: Agentic tool use
  category: advanced
  description: >-
    The ability of language models to act as agents by recognising when to call
    external tools (like calculators or search engines) in a loop rather than
    generating text directly.
  see:
    - label: Agentic Tool Use
      href: /lessons/agentic-tool-use

- id: agent
  term: Agent
  category: advanced
  description: >-
    A language model that runs tools in a loop to achieve a goal. Instead of
    generating text directly, an agent calls external tools and uses their
    results to continue.
  synonyms:
    - AI agent
  see:
    - label: Agentic Tool Use
      href: /lessons/agentic-tool-use

- id: tool-use
  term: Tool use
  category: advanced
  description: >-
    The mechanism by which a language model calls external tools (calculators,
    search engines, databases, code runners) during generation. Modern LLMs
    output structured tool calls; in the unplugged activity, sampling a
    "trigger word" plays the same role.
  synonyms:
    - function calling
  see:
    - label: Agentic Tool Use
      href: /lessons/agentic-tool-use

- id: synthetic-data
  term: Synthetic data
  category: advanced
  description: >-
    Training data generated by models rather than collected from humans. Can be
    used to augment training sets or create specialised datasets.
  see:
    - label: Synthetic Data
      href: /lessons/synthetic-data

- id: model-collapse
  term: Model collapse
  category: advanced
  description: >-
    What happens when a model is trained on its own outputs (or outputs from
    similar models) over multiple generations. Common patterns get amplified,
    rare ones vanish, and the model converges towards a narrower, more
    repetitive style.
  synonyms:
    - mode collapse
  see:
    - label: Synthetic Data
      href: /lessons/synthetic-data

- id: post-training
  term: Post-training
  category: post-training
  description: >-
    Everything done to a model after pre-training to make it more useful.
    Pre-training teaches the model how language works in general; post-training
    shapes its behaviour for specific purposes---following instructions,
    refusing harmful requests, or working carefully through problems.
    Supervised fine-tuning, RLHF, and RLVR are all post-training techniques.
  related:
    - pre-training
    - supervised-fine-tuning
    - rlhf
    - rlvr

- id: supervised-fine-tuning
  term: Supervised fine-tuning (SFT)
  category: post-training
  description: >-
    Post-training on demonstration data---paired examples of (input, desired
    output). The model learns to imitate the demonstrations. SFT is the
    simplest form of post-training and often the first step before
    reinforcement-learning techniques like RLHF or RLVR are applied.
  synonyms:
    - SFT
  related:
    - post-training
    - fine-tuning
    - rlhf
    - rlvr

- id: rlhf
  term: RLHF (Reinforcement Learning from Human Feedback)
  category: post-training
  description: >-
    A post-training technique where humans compare pairs of model outputs and
    their preferences train a reward model, which then guides the main model.
    Suits fuzzy objectives like "be helpful" or "sound natural" where no
    automated checker exists. Sibling of RLVR, which uses an automated checker
    instead of human preferences.
  related:
    - rlvr
    - reward-model
    - alignment
    - post-training
  see:
    - label: RLHF
      href: /lessons/rlhf

- id: reward-model
  term: Reward model
  category: post-training
  description: >-
    A separate model that learns to predict human preferences, then guides the
    main model during RLHF. Rather than asking humans to rate every output, the
    reward model rates outputs at scale, trained on a smaller set of human
    comparisons.
  related:
    - rlhf
    - alignment
  see:
    - label: RLHF
      href: /lessons/rlhf

- id: alignment
  term: Alignment
  category: post-training
  description: >-
    The process of shaping a model's outputs to match human values and
    preferences (typically helpfulness, harmlessness, and honesty). RLHF is one
    of the main techniques used to align modern LLMs.
  related:
    - rlhf
    - rlvr
  see:
    - label: RLHF
      href: /lessons/rlhf

- id: rlvr
  term: RLVR (Reinforcement Learning from Verifiable Rewards)
  category: post-training
  description: >-
    A post-training technique where the model generates an attempt, an
    automated checker verifies whether it's correct, and successful attempts
    get reinforced. Unlike RLHF, no human preference data is needed---just a
    verifier. Works best on domains with cheap, reliable checking (mathematics,
    code, formal logic). RLVR is the main technique behind modern reasoning
    models.
  related:
    - verifier
    - rollout
    - on-policy
    - reasoning-model
    - rlhf
    - post-training

- id: verifier
  term: Verifier
  category: post-training
  description: >-
    A program or rule that checks whether a model's output is correct. The
    reward signal in RLVR. Examples include "does this code pass the test
    suite?", "does this answer match the known value?", and "is this output
    valid JSON?". Cheap, reliable verifiers are what make RLVR scalable.
  synonyms:
    - checker
  related:
    - rlvr

- id: rollout
  term: Rollout
  category: post-training
  description: >-
    A single generation from a model, sampled all the way through. During
    RL-based post-training the model produces many rollouts per problem; the
    reward signal then determines which ones to reinforce.
  related:
    - rlvr
    - on-policy

- id: on-policy
  term: On-policy
  category: post-training
  description: >-
    Training where the data the model learns from is generated by the current
    model itself. RLVR is on-policy: the model produces rollouts, the rollouts
    get scored, the model updates, and the next batch of rollouts comes from
    the improved model. Contrast with off-policy training (such as SFT on a
    fixed dataset of human-written examples), where the training data doesn't
    change as the model improves.
  synonyms:
    - off-policy (the opposite property)
  related:
    - rlvr
    - rollout
    - supervised-fine-tuning

- id: reasoning-model
  term: Reasoning model
  category: post-training
  description: >-
    A language model that's been trained to generate intermediate "thinking"
    steps before producing its final answer. OpenAI's o1 and o3, DeepSeek's
    R1, and Claude with extended thinking are reasoning models. The
    architecture is the same as any other LLM---what changes is the
    post-training (usually RLVR), which shapes the model to use extra tokens
    for working through problems.
  synonyms:
    - thinking model
  related:
    - chain-of-thought
    - thinking-tokens
    - test-time-compute
    - rlvr
    - post-training

- id: chain-of-thought
  term: Chain of thought
  category: post-training
  description: >-
    Step-by-step reasoning a model generates before its final answer. Started
    as a prompting trick ("let's think step by step") and is now built into
    reasoning models through post-training. The intermediate steps function
    like rough working in a maths exercise---visible scratch work that helps
    the model reach a correct answer.
  synonyms:
    - CoT
  related:
    - reasoning-model
    - thinking-tokens
    - test-time-compute

- id: thinking-tokens
  term: Thinking tokens
  category: post-training
  description: >-
    The tokens that make up a reasoning model's chain of thought. Mechanically
    they're produced the same way as any other tokens (same forward pass, same
    sampling), but they're often hidden from the user in product interfaces.
    Some products, such as Claude's extended thinking, show them by default.
  related:
    - chain-of-thought
    - reasoning-model

- id: test-time-compute
  term: Test-time compute
  category: post-training
  description: >-
    Compute spent at generation time rather than during training. Reasoning
    models trade test-time compute for accuracy: letting the model generate
    more thinking tokens before answering tends to improve performance in a
    roughly predictable way. This is a scaling axis distinct from model size
    and training data, and is what makes reasoning models qualitatively
    different from earlier LLMs.
  synonyms:
    - inference-time compute
  related:
    - reasoning-model
    - chain-of-thought
    - rlvr
